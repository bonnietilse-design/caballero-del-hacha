      } else { b.dir = hx > b.x ? 1 : -1; b.x += (hx - b.x) * 0.25; b.y += (hy - b.y) * 0.25; }
    }
  }
  loseLife() {
    this.lives--; this.deaths++; this.state = "dying"; this.stateTimer = 110; this.flyingAxe = null;
    const p = this.player; p.dead = true; p.vy = -11; p.attackTimer = 0; p.invuln = 0;
    play("die"); if (this.lives > 0) say("desastre", true);
  }
  burst(x, y, colors, n, speed = 4) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * (speed - 1), life = randInt(20, 40);
      this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, color: pick(colors), life, maxLife: life, size: randInt(3, 6) });
    }
  }
  popup(x, y, text, color = GOLD) { this.popups.push({ x, y, text, color, life: 55 }); }
  throwFan(e, player) {   // a dancer throws a spinning fan at the knight
    const sx = e.x + e.w / 2, sy = e.y + 14, tx = player.x + player.w / 2, ty = player.y + player.h * 0.4;
    const dist = Math.max(40, Math.abs(tx - sx)), speed = 3.6 * e.mul, dir = tx > sx ? 1 : -1;
    const vy = Math.max(-3, Math.min(3, (ty - sy) / (dist / speed)));
    this.shots.push({ kind: "fan", enemy: true, x: sx, y: sy, vx: dir * speed, vy, t: 0, col: e.dress[0], dark: e.dress[1] });
    play("swing");
  }
  enemyShot(x, y, player, speed, kind, col = rgb(255, 210, 120), dark = rgb(200, 110, 40)) {
    const tx = player.x + player.w / 2, ty = player.y + player.h * 0.45, d = Math.hypot(tx - x, ty - y) || 1;
    this.shots.push({ kind, enemy: true, x, y, vx: (tx - x) / d * speed, vy: (ty - y) / d * speed, t: 0, col, dark });
  }
  dust(x, y) { this.burst(x, y, [rgb(196, 176, 140), rgb(160, 140, 110)], 3, 2); }
  splashAt(x) { this.burst(x, WATER_Y, [WHITE, rgb(160, 210, 250), rgb(90, 170, 230)], 14, 5); }

  step() {
    this.t++;
    if (this.state === "play") this.updatePlay();
    else if (this.state === "dying") {
      const p = this.player; p.vy = Math.min(p.vy + GRAVITY * 0.8, MAX_FALL); p.y += p.vy;
      if (--this.stateTimer <= 0) {
        if (this.lives > 0) { this.resetLevel(); this.state = "play"; }
        else { this.state = "gameover"; play("gameover"); say("fin", true); }
      }
    } else if (this.state === "pole") this.updatePole();
    else if (this.state === "door") this.updateDoor();
    else if (this.state === "finale" || this.state === "credits") {
      this.stateTimer++;
      if (--this.musicT <= 0) { play("win"); this.musicT = 222; }   // the flamenco keeps playing
      if (this.state === "finale") this.updateFinale(); else this.updateCredits();
    } else if (this.state === "levelclear") {
      this.stateTimer++;
      if (this.stateTimer % 30 === 0)
        this.burst(this.camX + 100 + Math.random() * (W - 200), 60 + Math.random() * 160,
          pick([[GOLD, WHITE], [HEART, WHITE], [ARMOR_LIGHT, WHITE], [GRASS_LIGHT, WHITE]]), 30, 6);
    } else if (this.state === "shop") {
      if (this.shopMsgT > 0) this.shopMsgT--;
    }
    for (const c of this.level.coins) c.t++;
    for (const q of this.particles) { if (q.drag) { q.vx *= q.drag; q.vy *= q.drag; } q.vy += q.grav ?? 0.25; q.x += q.vx; q.y += q.vy; q.life--; }
    this.particles = this.particles.filter(q => q.life > 0);
    for (const q of this.popups) { q.y -= 0.8; q.life--; }
    this.popups = this.popups.filter(q => q.life > 0);
    if (this.shake > 0) this.shake--;
    inp.jumpPressed = inp.attack = false;
  }

  strike(e, fromDir, hitIds, base = 1) {   // an axe, knife or cannonball hits an enemy
    if (!e.alive || hitIds.has(e.id) || !e.hittable()) return;
    hitIds.add(e.id);
    const er = e.rect(), ex = er.x + er.w / 2, ey = er.y + er.h / 2;
    if (e.blocks && e.blocks(fromDir)) {   // clang! the shield stops it
      this.burst(ex - fromDir * 24, ey, [WHITE, GOLD, rgb(255, 160, 80)], 10, 4); play("clang");
      this.popup(ex, er.y - 12, "¡Bloqueado!", WHITE); if (Math.abs(this.player.x - e.x) < 200) this.player.vx = -fromDir * 4.5;
      return;
    }
    this.burst(ex, ey, this.upg.sharp ? [GOLD, WHITE] : [WHITE, rgb(255, 230, 120)], 8);
    this.shake = Math.max(this.shake, 5); play("hit");
    if (e.hit(fromDir, base * (this.upg.sharp ? 1.75 : 1))) this.defeated(e, ex, ey, er);
  }
  breakCrates(box) {
    const lvl = this.level;
    for (const t of lvl.tilesNear(box)) {
      const ch = lvl.tile(t.cx, t.cy);
      if ((ch !== "C" && ch !== "Q") || !collide(box, t)) continue;
      lvl.tiles.delete(t.cx + "," + t.cy);
      if (ch === "Q") {   // cracked stone: a secret passage!
        this.burst(t.x + 20, t.y + 20, [rgb(120, 116, 130), rgb(80, 76, 90), WHITE], 16, 4); this.shake = Math.max(this.shake, 4); play("crate");
        if (!lvl.passage) { lvl.passage = true; this.popup(t.x + 20, t.y - 10, "¡Un pasadizo!", GOLD); play("secret"); say("secreto", true); }
        continue;
      }
      this.burst(t.x + 20, t.y + 20, [WOOD, WOOD_DARK], 14);
      lvl.coins.push(new Coin(t.x + 20, t.y + 20));
      this.score += 10; this.shake = Math.max(this.shake, 3);
      this.popup(t.x + 20, t.y, "¡Crac!", WHITE); play("crate");
    }
  }

  updatePlay() {
    const p = this.player, lvl = this.level;
    this.levelTimer++; this.runFrames++;
    if (this.rk) { this.updateRocket(); return; }
    if (this.caught) { this.updateCaught(); return; }
    if (this.mirrorCd > 0) this.mirrorCd--;
    if (this.mirrorGlow > 0) this.mirrorGlow--;
    const racing = p.car && this.levelTimer >= RACE_GO;
    if (p.car && this.levelTimer < RACE_GO) {   // 3, 2, 1... ¡YA!
      if ([45, 85, 125].includes(this.levelTimer)) play("beep");
      if (this.levelTimer === RACE_GO - 1) { play("go"); this.popup(p.x + p.w / 2 + 200, 200, "¡YA!", GOLD); }
    }
    const wasAir = !p.onGround, fallV = p.vy;
    p.update(p.car && !racing ? NOINP : inp, lvl);
    if (p.justNitro) { play("nitro"); this.popup(p.x + p.w / 2, p.y - 20, "¡Turbo!", GOLD); }
    if (p.justUmb) { play("umbrella"); this.popup(p.x + p.w / 2, p.y - 60, p.umbrella ? "☂ ¡Abierto!" : "Cerrado", WHITE); }
    if (this.storm) this.updateStorm();
    if (this.shark) this.updateShark();
    if (p.sub && p.justFired) {   // fire a torpedo
      this.shots.push({ kind: "torpedo", x: p.x + p.w, y: p.y + 26, vx: 9 + p.vx, vy: 0, t: 0, life: 110, hit: new Set() }); play("torpedo");
    }
    if (p.justGrenade && this.grenades > 0) {   // pull the pin and throw!
      this.grenades--; play("swing"); if (this.grenades === 3) say("granada");
      this.shots.push({ kind: "grenade", x: p.x + p.w / 2 + p.facing * 14, y: p.y + 10, vx: p.facing * 6 + p.vx * 0.5, vy: -8, t: 0, life: 100, hit: new Set() });
    }
    if (racing) {   // the race clock
      this.raceT--;
      if (this.raceT < 600 && this.raceT % 60 === 0) play("tick");
      if (this.raceT <= 0) { this.popup(p.x + p.w / 2, p.y - 40, "¡SE ACABÓ EL TIEMPO!", HEART); say("tiempo", true); this.loseLife(); return; }
      for (const o of lvl.oils) if (p.onGround && p.spinT === 0 && collide(p.rect(), o)) { p.spinT = 40; p.vx *= 0.45; play("skid"); this.popup(p.x + p.w / 2, p.y - 20, "¡Aceite!", WHITE); }
      for (const b of lvl.boosts) if (p.onGround && collide(p.rect(), b) && p.nitroT < 30) { p.nitroT = 45; play("nitro"); this.popup(p.x + p.w / 2, p.y - 20, "¡Turbo!", GOLD); }
      for (const c of [...lvl.clocks]) if (collide(p.rect(), { x: c.x - 22, y: c.y - 22, w: 44, h: 44 })) {
        lvl.clocks.splice(lvl.clocks.indexOf(c), 1); this.raceT += 240; play("oneup"); this.popup(c.x, c.y - 20, "+4 s", GOLD); this.burst(c.x, c.y, [GOLD, WHITE], 12, 4);
      }
      if (p.onGround && Math.abs(p.vx) > 5 && this.t % 3 === 0) this.dust(p.x, p.y + p.h);
    }
    if (lvl.theme.bg === "cave") {   // how much noise is the knight making?
      let n = 0;
      if (p.onGround && Math.abs(p.vx) > 0.5) n += 0.9;
      if (p.onGround && wasAir) n += Math.min(40, Math.max(0, fallV) * 3);   // landing thump
      if (p.justSwung) n += 30;
      if (p.onGround && Math.abs(p.vx) > 0.5 && lvl.leaves.some(l => collide(p.rect(), l))) { n += 7; if (this.t % 6 === 0) play("click"); }
      this.noise = n;
    }
    if (p.justJumped) play("jump");
    if (p.justSwung) {
      play("swing");
      if (this.upg.boomerang && !this.flyingAxe)
        this.flyingAxe = new FlyingAxe(p.x + p.w / 2 + p.facing * 30, p.y + 14, p.facing);
      if (p.ninja && p.shuriken > 0) {   // the ninja throws a shuriken with every slash
        p.shuriken--; play("shing");
        this.shots.push({ kind: "shuriken", x: p.x + p.w / 2 + p.facing * 16, y: p.y + 24, vx: p.facing * 12, vy: 0, t: 0, hit: new Set() });
      }
      if (this.upg.knives && this.swings % 2 === 1)   // ninja throwing knife, every other swing
        this.shots.push({ kind: "knife", x: p.x + p.w / 2 + p.facing * 18, y: p.y + 24, vx: p.facing * 11, vy: 0, t: 0, hit: new Set() });
      this.swings++;
      if (this.upg.paella && this.swings % 4 === 0) {   // lob a pan of exploding paella
        this.shots.push({ kind: "paella", x: p.x + p.w / 2 + p.facing * 14, y: p.y + 8, vx: p.facing * 6.5 + p.vx * 0.5, vy: -7.5, t: 0, life: 140, hit: new Set() });
        play("swing");
      }
      if (this.upg.guitar && this.swings % 8 === 0) {   // a thunderous flamenco chord: a ring that stuns everything nearby
        this.rings.push({ x: p.x + p.w / 2, y: p.y + p.h / 2, r: 10, hit: new Set() }); play("chord"); this.shake = Math.max(this.shake, 6);
        this.popup(p.x + p.w / 2, p.y - 30, "¡Olé!", GOLD);
      }
    }
    if (p.plane && p.justFired) {   // rat-a-tat: each press of the attack button fires a burst
      this.shots.push({ kind: p.ufo ? "laser" : "bullet", x: p.x + p.w + 4, y: p.y + (p.ufo ? 20 : 18) + (p.burstN % 2 ? -2 : 2), vx: 15 + p.vx, vy: p.vy * 0.3, t: 0, hit: new Set() });
      play(p.ufo ? "zap" : "gun");
    }
    if (p.justRocket) {   // every fourth press: a rocket!
      this.shots.push({ kind: "shell", rocket: !p.ufo, plasma: p.ufo, x: p.x + p.w, y: p.y + 24, vx: 10 + p.vx, vy: p.ufo ? 0 : 0.2, t: 0, hit: new Set() }); play("rocket");
      this.popup(p.x + p.w / 2, p.y - 12, p.ufo ? "¡Plasma!" : "¡Cohete!", GOLD);
    }
    if (p.tank && p.justFired) {   // BOOM: the tank fires its cannon
      const mx = p.facing > 0 ? p.x + p.w + 10 : p.x - 10;
      this.shots.push({ kind: "shell", x: mx, y: p.y + 13, vx: p.facing * 9, vy: -0.4, t: 0, hit: new Set() });
      play("boom"); this.shake = Math.max(this.shake, 4);
      this.burst(mx, p.y + 13, [rgb(255, 200, 80), rgb(180, 180, 180), WHITE], 10, 3);
    }
    const box = p.attackBox();   // the held axe (or sword, katana, lance) hits enemies and crates
    if (box) {
      const ids = p.horse && !p.swingActive() ? p.rideHits : p.hitIds;
      for (const e of lvl.enemies) if (collide(box, e.rect())) this.strike(e, p.facing, ids);
      this.breakCrates(box);
    }
    const fa = this.flyingAxe;   // the flying axe too
    if (fa) {
      fa.update(p);
      const r = fa.rect(), dir = fa.t < 30 ? Math.sign(fa.vx) : (p.x > fa.x ? 1 : -1);
      for (const e of lvl.enemies) if (collide(r, e.rect())) this.strike(e, dir, fa.hitIds);
      this.breakCrates(r);
      if (!fa.alive) this.flyingAxe = null;
    }
    if (lvl.theme.bg === "space" && this.levelTimer % 50 === 0 && lvl.flag && p.x < lvl.flag.x - 1400)   // an endless stream of asteroids
      lvl.enemies.push(new Asteroid(this.camX + W + 80, randInt(70, 400), Math.random() < 0.5 ? 1 : 2, LEVELS[this.levelIndex].speed, true));
    for (const e of lvl.enemies) e.update(lvl, p, this);
    this.updateBees();
    if (!p.plane) this.revealBlocks();
    for (const g of this.rings) {   // the guitar's shockwave ring spreads out
      g.r += 9; if (g.r > 190) g.dead = true;
      for (const e of lvl.enemies) if (e.alive && Math.hypot(e.x + e.w / 2 - g.x, e.y + e.h / 2 - g.y) < g.r) { this.strike(e, e.x + e.w / 2 > g.x ? 1 : -1, g.hit, 1); if (e.alive && !e.blocks && e !== lvl.boss) e.stun = Math.max(e.stun, 30); }
      for (const o of this.shots) if (o.enemy && Math.hypot(o.x - g.x, o.y - g.y) < g.r) { o.dead = true; this.burst(o.x, o.y, [GOLD, WHITE], 6, 3); }
    }
    this.rings = this.rings.filter(g => !g.dead);
    lvl.enemies = lvl.enemies.filter(e => e.alive);

    const bk = lvl.bike;   // hop on the motorbike!
    if (bk && !bk.taken && !p.bike && collide(p.rect(), bk)) {
      bk.taken = true; p.mountBike(); play("vroom"); say("moto", true);
      this.popup(p.x + p.w / 2, p.y - 20, "¡Una moto!", GOLD); this.burst(p.x + p.w / 2, p.y + p.h, [rgb(196, 176, 140), WHITE], 16, 4);
    }
    const tk = lvl.tank;   // climb into the tank!
    if (tk && !tk.taken && !p.tank && !p.bike && collide(p.rect(), tk)) {
      tk.taken = true; p.mountTank(); play("vroom"); say("tanque", true);
      this.popup(p.x + p.w / 2, p.y - 40, "¡Un tanque!", GOLD); this.burst(p.x + p.w / 2, p.y + p.h, [rgb(160, 160, 160), WHITE], 16, 4);
    }
    if (p.horse) {   // hoofbeats and dust at the gallop
      if (this.t % 24 === 0) p.rideHits.clear();
      if (p.onGround && Math.abs(p.vx) > 1) {
        p.clopT = (p.clopT || 0) + Math.abs(p.vx);
        if (p.clopT > 34) { p.clopT = 0; play("clop"); }
        if (Math.abs(p.vx) > 4 && this.t % 4 === 0) this.dust(p.x + (p.vx > 0 ? 0 : p.w), p.y + p.h);
      }
    }
    for (const k of [...lvl.pickups]) if (collide(p.rect(), { x: k.x - 16, y: k.y - 16, w: 32, h: 32 })) {   // shuriken bundles
      lvl.pickups.splice(lvl.pickups.indexOf(k), 1); p.shuriken += 6; play("coin"); say("shuri");
      this.popup(k.x, k.y - 20, "+6 shuriken", WHITE); this.burst(k.x, k.y, [WHITE, rgb(200, 206, 220)], 10, 3);
    }
    if (p.tank && p.onGround && Math.abs(p.vx) > 2 && this.t % 6 === 0) this.dust(p.x + (p.vx > 0 ? 0 : p.w), p.y + p.h);
    if (p.bike) {
      if (p.onGround && Math.abs(p.vx) > 4 && this.t % 3 === 0) this.dust(p.x + (p.vx > 0 ? 0 : p.w), p.y + p.h);
      if (this.t % 24 === 0) p.rideHits.clear();
    }

    if (lvl.boss && lvl.boss.alive && !this.bossAnnounced && p.x > lvl.arena[0] - 200) {
      this.bossAnnounced = true; say(lvl.boss.voice, true); this.popup(p.x + p.w / 2, p.y - 30, lvl.boss.intro, HEART);
    }

    const pr = inflate(p.rect(), -6, -4);   // touching an enemy or spikes hurts, even from above
    const ouch = srcX => {
      if (!p.hurt(srcX)) return false;
      if (!p.plane) {   // never get knocked backwards into a pit: just hop in place instead
        const bx = p.x + p.w / 2 + Math.sign(p.vx) * 60, below = Math.floor((p.y + p.h + 4) / TILE);
        if (![0, 1, 2].some(k => lvl.solidAt(Math.floor(bx / TILE), below + k))) p.vx = 0;
      }
      this.shake = 8; this.burst(pr.x + pr.w / 2, pr.y + pr.h / 2, [HEART, WHITE], 10);
      this.popup(pr.x + pr.w / 2, pr.y - 10, "¡Jolín!", HEART);
      play("hurt"); say("jolin", true);
      return true;
    };
    for (const e of lvl.enemies) {
      if (!e.harmful() || !collide(pr, e.rect())) continue;
      if (e.kind === "Y") {   // crashed into a rival car
        if (ouch(e.x + e.w / 2)) { p.vx = Math.min(p.vx, e.vx - 4); p.vy = -5; play("boom"); }
        continue;
      }
      if (e.kind === "z" || e.kind === "W" || e.kind === "f") {   // flew into a mine: boom
        e.alive = false; this.burst(e.x + 15, e.y + 15, [rgb(255, 200, 80), rgb(255, 120, 40), rgb(120, 120, 120)], 24, 5); play("boom"); this.shake = 10;
      }
      const dx = e.x + e.w / 2 - (p.x + p.w / 2);
      if (p.bike && Math.abs(p.vx) > 5 && Math.sign(dx) === Math.sign(p.vx) && !FLYER_STATS[e.kind] && e !== lvl.boss) {
        this.strike(e, Math.sign(p.vx), p.rideHits); continue;   // rammed by the motorbike!
      }
      ouch(e.x + e.w / 2);
    }
    for (const e of lvl.enemies) if (e.slashBox && collide(pr, e.slashBox)) ouch(e.x + e.w / 2);   // the Black Knight's sword
    for (const s of lvl.spikes) if (collide(pr, { x: s.x + 4, y: s.y + 20, w: TILE - 8, h: 20 }) && ouch(s.x + TILE / 2)) p.vy = -10;
    for (const s of this.shots) {   // knives, cannonballs and the dancers' fans
      s.t++; s.x += s.vx; s.y += s.vy;
      if (s.kind === "shell") s.vy += s.rocket ? 0.01 : s.plasma ? 0 : 0.05;
      if (s.kind === "rock") s.vy += 0.3;
      if (s.kind === "arrow") s.vy += 0.15;
      if (s.kind === "paella") s.vy += 0.35;
      if (s.kind === "seed") s.vy += 0.18;
      if (s.kind === "grenade") {   // grenades bounce along the ground until the fuse runs out
        s.vy += 0.4;
        if (lvl.solidAt(Math.floor(s.x / TILE), Math.floor((s.y + 7) / TILE))) { s.y -= s.vy; s.vy = Math.abs(s.vy) < 2 ? 0 : -Math.abs(s.vy) * 0.45; s.vx *= 0.75; if (Math.abs(s.vy) > 1) play("click"); }
        if (lvl.solidAt(Math.floor((s.x + Math.sign(s.vx) * 7) / TILE), Math.floor(s.y / TILE))) s.vx = -s.vx * 0.5;
      }
      const boomy = s.kind === "shell" || s.kind === "paella" || s.kind === "grenade" || s.kind === "torpedo";
      const sr = s.kind === "wave" ? { x: s.x - 14, y: s.y - 12, w: 28, h: 28 } : { x: s.x - 9, y: s.y - 9, w: 18, h: 18 };
      if (s.enemy) {
        if (box && !s.nochop && collide(box, sr)) {   // chop a fan right out of the air
          s.dead = true; this.burst(s.x, s.y, [s.col, WHITE], 10, 3); this.popup(s.x, s.y - 10, "¡Zas!", WHITE); play("hit");
        } else if (collide(pr, sr) && this.upg.mirror && this.mirrorCd === 0 && p.invuln === 0) {   // the mirror shield sends it straight back
          s.enemy = false; s.vx = -s.vx * 1.4 || -p.facing * 8; s.vy = s.kind === "arrow" ? -Math.abs(s.vy) * 0.5 : -s.vy * 0.5; s.t = 0; s.life = 90; s.hit = new Set();
          this.mirrorCd = 480; this.mirrorGlow = 24; play("clang"); say("reflejo"); this.popup(p.x + p.w / 2, p.y - 20, "¡Reflejado!", ARMOR_LIGHT);
        } else if (collide(pr, sr)) { ouch(s.x); s.dead = true; }
      } else {
        for (const o of this.shots) if (o.enemy && !o.dead && !o.nochop && collide(sr, { x: o.x - 10, y: o.y - 10, w: 20, h: 20 })) {   // shoot fans down
          o.dead = true; this.burst(o.x, o.y, [o.col, WHITE], 10, 3); if (!boomy) s.dead = true;
        }
        for (const e of lvl.enemies) {
          if (s.dead && !boomy) break;
          if (!e.alive || !e.hittable() || s.hit.has(e.id) || !collide(sr, e.rect())) continue;
          this.strike(e, Math.sign(s.vx), s.hit, s.kind === "paella" ? 1.5 : boomy ? 2 : 1); s.dead = true; break;
        }
        this.breakCrates(sr);

// ------------------------------------------------------------------ screen, input, loop
const game = new Game();

let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * scale * dpr);
  canvas.height = Math.floor(H * scale * dpr);
}
window.addEventListener("resize", resize);

if (isTouch) document.body.classList.add("is-touch");

let fsTried = false;
function unlock() {   // first touch: allow sound, go fullscreen where the phone supports it
  initAudio();

    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  }
}
function tapStart() {
  if (game.paused) { setPaused(false); return true; }

  if (s === "title") { game.newGame(0); return true; }
  if (s === "finale") { if (game.stateTimer > 90) game.startCredits(); return true; }
  if (s === "credits") { if (game.creditsT > 150) game.newGame(0); return true; }
  if (s === "gameover") { game.newGame(game.levelIndex); return true; }

const keys = { left: false, right: false, jump: false };
const touch = { left: false, right: false, jump: false };
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "jump", ArrowUp: "jump", KeyW: "jump" };
window.addEventListener("keydown", e => {
  unlock();
  if (game.state === "shop") {   // keyboard shopping
    const n = SHOP.length;
    if (e.code === "ArrowLeft" || e.code === "KeyA") game.shopSel = (game.shopSel + n) % (n + 1);
    else if (e.code === "ArrowRight" || e.code === "KeyD") game.shopSel = (game.shopSel + 1) % (n + 1);
    else if (e.code === "ArrowDown" || e.code === "KeyS") game.shopSel = game.shopSel >= n ? 0 : Math.min(n, game.shopSel + PER_ROW);

    e.preventDefault();
    return;

  if (k) { e.preventDefault(); if (k === "jump" && !e.repeat) inp.jumpPressed = true; keys[k] = true; }
  if (["KeyX", "KeyJ", "ControlLeft"].includes(e.code) && !e.repeat) inp.attack = true;
  if (e.code === "KeyM") toggleSound();

const dpad = document.getElementById("dpad");
let dpadId = null;
function dpadSet(e) {

function holdButton(el, down, up) {

    el.classList.add("on"); down();

}

const bSound = document.getElementById("bSound");
function toggleSound() {
  soundOn = !soundOn;

}

const bPause = document.getElementById("bPause");
function setPaused(on) {
  if (on && game.state !== "play") return;   // only pause during play
  game.paused = on;

let last = performance.now(), acc = 0;
let slowFrames = 0;
function frame(now) {
  const dt = now - last;
  if (SHADE && game.state === "play" && !game.paused) { slowFrames = dt > 26 ? slowFrames + 1 : Math.max(0, slowFrames - 2); if (slowFrames > 150) SHADE = false; }
  acc += Math.min(100, now - last); last = now;

    inp.left = keys.left || touch.left;
    inp.right = keys.right || touch.right;
    inp.jumpHeld = keys.jump || touch.jump;
    game.step();
    acc -= STEP_MS;

  updateEngine();
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  game.draw();
  requestAnimationFrame(frame);
