<meta name="apple-mobile-web-app-title" content="Caballero">
<meta name="theme-color" content="#0f0f19">
<title>El Caballero del Hacha</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪓</text></svg>">
<style>
  :root { --ctl: min(19vh, 84px); }
  html, body {
    margin: 0; height: 100%; background: #0f0f19; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  .ctl { display: none; }
  body.is-touch .ctl { display: flex; }
  #dpad {
    position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom));
    width: calc(var(--ctl) * 2.1); height: var(--ctl); border-radius: calc(var(--ctl) / 2);
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.38); touch-action: none;
  }
  #dpad span {
    flex: 1; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.9);
    font-size: calc(var(--ctl) * .42); border-radius: calc(var(--ctl) / 2); pointer-events: none;
  }
  #dpad[data-dir="l"] span:first-child, #dpad[data-dir="r"] span:last-child { background: rgba(255,255,255,.3); }
  #btns {
    position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom));
    gap: 14px; align-items: flex-end;
  }
  .btn {
    width: var(--ctl); height: var(--ctl); border-radius: 50%; border: 2px solid rgba(255,255,255,.42);
    background: rgba(255,255,255,.16); color: #fff; font: 700 calc(var(--ctl) * .2) "Trebuchet MS", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; touch-action: none; padding: 0;
  }
  #bAxe {
    width: calc(var(--ctl) * 1.15); height: calc(var(--ctl) * 1.15); background: rgba(230,60,60,.38);
    font-size: calc(var(--ctl) * .5); margin-bottom: calc(var(--ctl) * .35);
  }
  .btn.on { background: rgba(255,255,255,.42); }
  .top {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.28); color: #fff; font-size: 20px; padding: 0; touch-action: none; cursor: pointer;
  }
  #bSound { right: calc(8px + env(safe-area-inset-right)); }
  #bPause { right: calc(60px + env(safe-area-inset-right)); font-size: 18px; }
  #rotate {
    display: none; position: fixed; left: 0; right: 0; top: calc(16vh + 56vw + 14px);
    color: rgba(255,255,255,.65); text-align: center; font-size: 15px; pointer-events: none;
  }
  @media (orientation: portrait) {
    body.is-touch #wrap { align-items: flex-start; padding-top: 16vh; }
    body.is-touch #rotate { display: block; }
  }
</style>
</head>

class FlyingAxe {   // the "Hacha voladora" upgrade: thrown axe that comes back like a boomerang
  constructor(x, y, dir) { this.x = x; this.y = y; this.vx = dir * 9.5; this.t = 0; this.hitIds = new Set(); this.alive = true; }

// ------------------------------------------------------------------ enemies
let nextId = 1;
class Enemy {   // shared bits for every enemy
  init(kind, w, h, hp, score) {
    Object.assign(this, { kind, w, h, hp, maxHp: hp, score, id: nextId++, vx: 0, vy: 0, dir: -1,
      onGround: false, hitWall: false, flash: 0, stun: 0, alive: true, t: Math.random() * 100 });
  }
  rect() { return { x: Math.round(this.x), y: Math.round(this.y), w: this.w, h: this.h }; }
  colors() { return ENEMY_COLORS[this.kind]; }
  hit(fromDir, dmg = 1) {
    this.hp -= dmg; this.flash = 8; this.stun = 16; this.vx = fromDir * 6.5; this.vy = -4; this.dir = -fromDir;
    if (this.hp <= 0) { this.alive = false; return true; }

  }

const ROO_STATS = {   // size, hit points, hop strength, pause between hops, points
  t: { w: 30, h: 42, hp: 1, hopVy: 7.0, hopVx: 2.2, wait: [25, 55], score: 100 },
  T: { w: 38, h: 56, hp: 3, hopVy: 6.5, hopVx: 1.6, wait: [50, 80], score: 500 },

  "2": { w: 34, h: 30, hp: 1, hopVy: 6.5, hopVx: 2.0, wait: [30, 70], score: 150 },   // moon blob

class Kangaroo extends Enemy {   // hops along, turning round at walls and ledges
  constructor(kind, tx, ty, mul = 1) {
    super();
    const s = ROO_STATS[kind];
    this.init(kind, s.w, s.h, s.hp, s.score);
    this.hopVy = s.hopVy; this.hopVx = s.hopVx * mul;

    const r = this.rect(), dist = this.hopVx * 2 * this.hopVy / GRAVITY;
    const front = this.dir > 0 ? r.x + r.w : r.x;
    const near = Math.floor((front + this.dir * 4) / TILE), land = Math.floor((front + this.dir * dist) / TILE);
    const below = Math.floor((r.y + r.h + 2) / TILE);
    if (level.solidAt(near, Math.floor((r.y + r.h - 4) / TILE))) return true;
    return !(level.solidAt(near, below) && level.solidAt(land, below));
  }
  update(level) {

    }

    const target = this.mode === "open" || this.mode === "lunge" ? 1 : 0;   // jaws open while it threatens and lunges
    this.jaw += (target - this.jaw) * 0.3;
    physicsMove(this, level);
    const blocked = this.hitWall || (this.onGround && ledgeAhead(this, level));

  }

  draw(cam) {

class Mole extends Enemy {   // digs towards the knight underground (watch the moving mound!) and pops up beside him

  }

  hittable() { return this.up > 0.4; }

    this.t++;

      else if (Math.abs(dx) < 300 && Math.abs(dy) < 50 && !player.dead && player.onGround) {
        this.dir = dx > 0 ? 1 : -1; this.vx = this.dir * this.speed;

      } else this.vx = this.dir * this.speed * 0.4;
    } else if (this.mode === "pop") {
      this.vx = 0; this.up = Math.min(1, this.up + 0.08);

    } else if (this.mode === "up") {

  }
  hit(fromDir, dmg = 1) {

class Dancer extends Enemy {   // fierce flamenco dancer: stamps towards you, throws spinning fans, twirls into you

class Shadow extends Enemy {   // shadow ninja: throws shuriken, slashes, blocks, and vanishes in smoke to strike from behind

    this.blinkT = randInt(140, 240); this.slashT = 0; this.slashCd = 0; this.slashBox = null; this.smoke = 0; this.guardT = 0;
  }

      }
      if (this.onGround && dist < 64 && Math.abs(dy) < 40 && this.slashCd === 0) { this.slashT = 20; this.slashCd = 70; }
      else if (this.onGround && player.onGround && dist > 110 && --this.blinkT <= 0) this.blink(level, player, game);
      else if (this.onGround && dist < 150 && dist > 64 && --this.jumpT <= 0) { this.vy = -10.5; this.vx = this.dir * 3; this.jumpT = randInt(80, 130); game.sound("swing"); }
    } else if (this.onGround) this.vx = this.dir * this.speed * 0.6;

class Archer extends Enemy {   // archer at the tourney: stands his ground and looses arrows in a high arc

  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dist = Math.abs(dx);
    if (this.stun > 0) { this.stun--; this.vx *= 0.85; this.drawT = 0; }
    else {
      this.vx = 0;
      if (dist < 640 && !player.dead) {
        this.dir = dx > 0 ? 1 : -1;
        if (this.drawT > 0) { if (--this.drawT === 0) this.shoot(player, game); }
        else if (--this.shootT <= 0) { this.drawT = 34; this.shootT = Math.round(randInt(100, 150) / this.mul); }
      }
    }

    if (this.y > level.pxH + 100) this.alive = false;

  shoot(player, game) {   // aim where the rider will be when the arrow comes down

    const tx = player.x + player.w / 2 + player.vx * T * 0.85, ty = player.y + player.h * 0.4;
    const vx = Math.max(-9, Math.min(9, (tx - sx) / T)), vy = (ty - sy - 0.5 * g * T * T) / T;
    game.shots.push({ kind: "arrow", enemy: true, x: sx, y: sy, vx, vy, t: 0, life: 200, col: rgb(150, 110, 60), dark: WOOD_DARK });

  }

class EnemyPlane extends Enemy {   // enemy biplane: flies at the knight shooting; red aces swing round and chase him
  constructor(tx, ty, mul = 1, awake = false) {
    super();
    this.init("E", 64, 30, 3, 250);
    this.x = tx; this.y = ty; this.baseY = ty; this.mul = mul; this.awake = awake; this.dir = -1;
    this.speed = (2.2 + Math.random() * 1.0) * mul; this.shootT = randInt(40, 100); this.phase = Math.random() * 6;
    this.ace = Math.random() < 0.3; this.spread = !this.ace && Math.random() < 0.45;
    this.paint = this.ace ? ACE_PLANE : pick(ENEMY_PLANES); this.chasing = false; this.chaseT = 0; this.peel = false;
  }
  fire(game, player, spread) {
    const sx = this.x + (this.dir > 0 ? this.w : 0), sy = this.y + 18;
    const a = Math.atan2(player.y + 17 - sy, player.x + player.w / 2 - sx);
    for (const o of spread ? [-0.22, 0, 0.22] : [0]) game.shots.push({ kind: "ebullet", enemy: true, x: sx, y: sy,
      vx: Math.cos(a + o) * 5.4 * this.mul, vy: Math.sin(a + o) * 5.4 * this.mul, t: 0, col: rgb(255, 210, 120), dark: rgb(200, 110, 40) });
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (!this.awake) { if (this.x < game.camX + W + 30) this.awake = true; else return; }
    if (this.chasing) {   // the ace sits on the knight's tail
      if (this.peel) { this.y -= 3; this.x += player.vx + 2; if (this.y < -60) this.alive = false; return; }
      this.x += Math.max(player.vx - 0.5, Math.min(player.vx + 2.5, (player.x - 160 - this.x) * 0.08 + player.vx));
      this.y += Math.max(-2.4, Math.min(2.4, (player.y - this.y) * 0.04));
      if (--this.shootT <= 0 && !player.dead) { this.fire(game, player, false); this.shootT = Math.round(randInt(60, 90) / this.mul); }
      if (++this.chaseT > 420) this.peel = true;
      return;
    }
    this.x -= this.speed; this.y = this.baseY + Math.sin(this.t * 0.04 + this.phase) * 34;
    if (this.x > player.x + 120 && --this.shootT <= 0 && !player.dead) {
      this.fire(game, player, this.spread); this.shootT = Math.round(randInt(80, 130) / this.mul);
    }
    if (this.ace && this.x < player.x - 40 && !player.dead) {   // loop round and give chase
      this.chasing = true; this.dir = 1; this.shootT = 50; game.sound("screech"); game.popup(this.x + 30, this.y - 10, "¡Un as!", HEART);
    }
    if (this.x + this.w < game.camX - 120) this.alive = false;   // flew past: gone
  }
  hit(fromDir, dmg = 1) { this.hp -= dmg; this.flash = 8; if (this.hp <= 0) { this.alive = false; return true; } return false; }
  draw(cam) {
    drawPlane(this.x - cam, this.y, this.dir, this.flash ? [WHITE, WHITE, WHITE] : this.paint, false, this.t,
      this.chasing ? (this.peel ? -0.4 : 0) : Math.cos(this.t * 0.04 + this.phase) * 0.12);
    drawCreatureHp(this, cam);
  }
}

class Airship extends Enemy {   // El Dirigible: an armoured airship guarding the finish line

class BlackKnight extends Enemy {   // the final duel: shield up while he walks, sword slashes, and leaps that send shockwaves

    this.combo = 0; this.chain = false; this.summoned = false;

  blocks(fromDir) { return this.guarding() && fromDir === -this.dir; }   // his shield stops blows from the front
  harmful() { return this.mode === "leap" || this.mode === "dash"; }   // his sword, leap, charge and the shockwaves hurt
  phase2() { return this.hp <= this.maxHp / 2; }
  startLeap(dx, game) {
    this.mode = "leap"; this.vy = -13; this.vx = Math.sign(dx) * Math.min(6, Math.abs(dx) / 42 + 1) * this.mul; this.leapT = this.t;
    game.sound("swing");
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;

    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dist = Math.abs(dx);

    else if (this.mode === "walk") {

        if (this.actions % 3 === 0) this.startLeap(dx, game);
        else { this.mode = "windup"; this.modeT = Math.round((p2 ? 24 : 30) / anger); this.vx = 0; this.combo = p2 ? 2 : 1; }
      } else if (dist > 200 && this.onGround && Math.random() < (p2 ? 0.025 : 0.01)) {   // lowers his sword and charges
        this.mode = "aim"; this.modeT = p2 ? 24 : 32; this.vx = 0; game.sound("clang"); game.popup(this.x + this.w / 2, this.y - 30, "¡Cuidado!", HEART);
      } else if (dist > 320 && this.onGround) { this.actions++; this.startLeap(dx, game); }
    } else if (this.mode === "windup") { this.vx = 0; if (--this.modeT <= 0) { this.mode = "slash"; this.modeT = 12; game.sound("swing"); } }
    else if (this.mode === "slash") {
      this.vx = this.dir * 2;
      const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 10 : r.x - 82, y: r.y + 10, w: 92, h: 80 };
      if (--this.modeT <= 0) {
        if (--this.combo > 0) { face(); this.mode = "windup"; this.modeT = 16; }   // a second slash straight after
        else { this.mode = "recover"; this.modeT = Math.round(34 / anger); }
      }
    } else if (this.mode === "aim") { this.vx = 0; face(); if (--this.modeT <= 0) { this.mode = "dash"; this.modeT = 45; game.sound("swing"); } }
    else if (this.mode === "dash") {
      this.vx = this.dir * 8.5 * this.mul;
      const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 10 : r.x - 60, y: r.y + 10, w: 70, h: 80 };
      if (--this.modeT <= 0 || this.x <= this.minX + 2 || this.x >= this.maxX - this.w - 2) { this.mode = "recover"; this.modeT = 40; }
    } else if (this.mode === "recover") { this.vx = 0; if (--this.modeT <= 0) this.mode = "walk"; }
    else if (this.mode === "stunned") {
      this.vx = 0;
      if (--this.modeT <= 0) { if (this.chain) this.startLeap(dx, game); else this.mode = "walk"; }
    }
    physicsMove(this, level);
    this.x = Math.max(this.minX, Math.min(this.x, this.maxX - this.w));
    if (this.mode === "leap" && this.onGround && this.t - this.leapT > 5) {   // lands: the ground shakes and shockwaves roll out
      this.mode = "stunned"; this.vx = 0;
      if (p2 && !this.chain) { this.chain = true; this.modeT = 30; }   // angry: he leaps again straight away
      else { this.chain = false; this.modeT = Math.round(56 / anger); }
      game.shake = Math.max(game.shake, 14); game.sound("stomp"); this.waveT = 16;   // a moment of rumbling first
      game.popup(this.x + this.w / 2, this.y - 30, "¡Salta!", GOLD);
    }
    if (this.waveT > 0) {
      if (this.waveT % 4 === 0) game.dust(this.x + this.w / 2 + randInt(-40, 40), this.y + this.h);
      if (--this.waveT === 0) for (const d of [-1, 1]) game.shots.push({ kind: "wave", enemy: true, nochop: true, life: 110, x: this.x + this.w / 2 + d * 30, y: this.y + this.h - 16,
        vx: d * (this.phase2() ? 7.5 : 6.5) * this.mul, vy: 0, t: 0, col: rgb(255, 120, 60), dark: rgb(180, 40, 40) });
    }
  }
  hit(fromDir, dmg = 1) {
    if (this.invuln > 0) return false;
    this.hp -= dmg; this.flash = 10; this.invuln = 14;
    if (this.mode === "walk" && !this.phase2()) { this.mode = "recover"; this.modeT = 24; }   // a blow from behind staggers him (until he's angry)
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  draw(cam) { drawBlackKnight(this, cam); }
}

class TRex extends Enemy {   // el Tiranosaurio Rex: stomps after you, snaps his jaws, roars rocks down from the sky and charges
  constructor(tx, ty, level, mul = 1) {
    super();
    this.init("R", 136, 104, 22, 5000);
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h;
    this.minX = level.arena[0]; this.maxX = level.arena[1]; this.mul = mul;
    this.mode = "wait"; this.modeT = 50; this.jaw = 0; this.invuln = 0; this.slashBox = null; this.actions = 0; this.rocks = 0;
    this.title = "EL TIRANOSAURIO REX"; this.voice = "trex"; this.intro = "¡Un tiranosaurio!";
  }
  harmful() { return this.mode === "charge"; }   // his body only hurts when he charges; his bite hurts any time
  startRoar(game) {
    this.mode = "roar"; this.modeT = 60; this.vx = 0; this.rocks = this.hp <= this.maxHp / 2 ? 7 : 5;
    game.sound("roar"); game.popup(this.x + this.w / 2, this.y - 30, "¡GRRROAAAR!", HEART);
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.invuln) this.invuln--;
    this.slashBox = null;
    const anger = 1 + (this.maxHp - this.hp) / this.maxHp * 0.6;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dist = Math.abs(dx), face = () => { this.dir = dx > 0 ? 1 : -1; };
    const awake = player.x > this.minX - 100 && !player.dead;
    let jawTo = 0;
    if (this.mode === "wait") { this.vx = 0; face(); if (awake && --this.modeT <= 0) this.mode = "walk"; }
    else if (this.mode === "walk") {
      face(); this.vx = this.dir * 1.25 * this.mul * anger;
      if (this.onGround && this.t % 32 === 0) { game.sound("stomp"); game.shake = Math.max(game.shake, 3); }
      const level_ = Math.abs(player.y + player.h - (this.y + this.h)) < 90;
      if (dist < 150 && level_) { this.actions++; this.mode = "rear"; this.modeT = Math.round(22 / anger); this.vx = 0; }
      else if ((dist > 260 || this.hitWall) && this.onGround && Math.random() < 0.014 * anger) this.startRoar(game);
    } else if (this.mode === "rear") { this.vx = 0; jawTo = 1; if (--this.modeT <= 0) { this.mode = "bite"; this.modeT = 12; game.sound("snap"); } }
    else if (this.mode === "bite") {   // CHOMP: his head lunges forward
      jawTo = this.modeT > 6 ? 1 : 0; this.vx = this.dir * 5;
      const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 34 : r.x - 46, y: r.y - 4, w: 80, h: 64 };
      if (--this.modeT <= 0) { this.mode = "recover"; this.modeT = Math.round(42 / anger); }
    } else if (this.mode === "recover") {
      this.vx = 0;
      if (--this.modeT <= 0) { if (this.actions % 3 === 0) this.startRoar(game); else this.mode = "walk"; }
    } else if (this.mode === "roar") {   // the ground shakes and rocks come tumbling down
      this.vx = 0; jawTo = 1; game.shake = Math.max(game.shake, 4);
      if (this.modeT % 9 === 0 && this.rocks > 0) {
        this.rocks--;
        const rx = Math.max(this.minX + 20, Math.min(this.maxX - 20, player.x + player.w / 2 + randInt(-170, 170)));
        game.shots.push({ kind: "rock", enemy: true, x: rx, y: -30, vx: 0, vy: 1, t: 0, life: 240, col: rgb(130, 96, 70), dark: rgb(80, 58, 42) });
      }
      if (--this.modeT <= 0) { this.mode = "aim"; this.modeT = 22; face(); game.popup(this.x + this.w / 2, this.y - 30, "¡Que viene!", HEART); }
    } else if (this.mode === "aim") { this.vx = 0; if (--this.modeT <= 0) { this.mode = "charge"; this.modeT = 100; game.sound("roar"); } }
    else if (this.mode === "charge") {   // head down, full speed, until he crashes into something
      this.vx = this.dir * Math.min(8.5, 6.2 * this.mul * anger);
      if (this.t % 4 === 0) game.dust(this.x + (this.dir > 0 ? 0 : this.w), this.y + this.h);
      const crashed = this.hitWall || this.x <= this.minX + 2 || this.x >= this.maxX - this.w - 2;
      if (crashed) {
        this.mode = "stunned"; this.modeT = 90; this.vx = 0; game.shake = 18; game.sound("stomp");
        game.popup(this.x + this.w / 2, this.y - 30, "¡Mareado! ¡Ahora!", GOLD);
      } else if (--this.modeT <= 0) { this.mode = "recover"; this.modeT = 40; }
    } else if (this.mode === "stunned") { this.vx = 0; if (--this.modeT <= 0) this.mode = "walk"; }
    this.jaw += (jawTo - this.jaw) * 0.3;
    physicsMove(this, level);
    this.x = Math.max(this.minX, Math.min(this.x, this.maxX - this.w));
  }
  hit(fromDir, dmg = 1) {
    if (this.invuln > 0) return false;
    this.hp -= dmg; this.flash = 10; this.invuln = 14;
    if (this.hp <= 0) { this.alive = false; return true; }
    if (this.mode === "wait" || this.mode === "walk" && Math.random() < 0.5) { this.actions++; this.mode = "rear"; this.modeT = 14; this.dir = -fromDir; }   // hit him head-on and he snaps right back
    return false;
  }
  draw(cam) { drawTRex(this, cam); }
}

const ROCK_SIZES = [13, 22, 34];   // small, medium and big asteroids
class Asteroid extends Enemy {   // a space rock: drifts and spins; shoot it and it splits; don't fly into it!
  constructor(cx, cy, size = 2, mul = 1, awake = false) {
    super();
    const r = ROCK_SIZES[size];
    this.init("O", r * 2, r * 2, [1, 3, 6][size], [50, 100, 200][size]);
    this.size = size; this.r = r; this.x = cx - r; this.y = cy - r; this.awake = awake; this.mul = mul;
    this.vx = -(0.5 + Math.random() * 1.6) * mul; this.vy = (Math.random() - 0.5) * 1.4;
    this.spin = (Math.random() - 0.5) * 0.06; this.ang = Math.random() * 6;
    this.shape = Array.from({ length: 11 }, () => 0.78 + Math.random() * 0.26);
  }
  rect() { const k = this.r * 0.7; return { x: Math.round(this.x + this.r - k), y: Math.round(this.y + this.r - k), w: Math.round(k * 2), h: Math.round(k * 2) }; }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (!this.awake) { if (this.x < game.camX + W + 60) this.awake = true; else return; }
    this.x += this.vx; this.y += this.vy; this.ang += this.spin;
    if (this.y < 46 && this.vy < 0 || this.y + this.h > 418 && this.vy > 0) this.vy = -this.vy;
    if (this.x + this.w < game.camX - 150) this.alive = false;
  }
  hit(fromDir, dmg = 1) { this.hp -= dmg; this.flash = 6; if (this.hp <= 0) { this.alive = false; return true; } return false; }
  draw(cam) { drawAsteroid(this, cam); }
}

class Alien extends Enemy {   // a little green alien in a saucer: hovers in front of you firing zaps, then zooms off
  constructor(tx, ty, mul = 1) {
    super();
    this.init("u", 50, 30, 2, 300);
    this.x = tx; this.y = ty; this.mul = mul; this.awake = false; this.hold = randInt(240, 340);
    this.shootT = randInt(40, 80); this.phase = Math.random() * 6;
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (!this.awake) { if (this.x < game.camX + W + 30) this.awake = true; else return; }
    if (this.hold > 0) {
      this.hold--;
      const tx = player.x + 400 + Math.sin(this.t * 0.03 + this.phase) * 90, ty = player.y + Math.sin(this.t * 0.045 + this.phase) * 110;
      this.x += Math.max(-4, Math.min(player.vx + 3, (tx - this.x) * 0.05 + player.vx));
      this.y += (ty - this.y) * 0.03;
      if (--this.shootT <= 0 && !player.dead) {
        game.enemyShot(this.x + 25, this.y + 22, player, 4.4 * this.mul, "zap", rgb(130, 255, 120), rgb(30, 160, 60)); game.sound("zap");
        this.shootT = Math.round(randInt(70, 110) / this.mul);
      }
    } else { this.x -= 5; if (this.x + this.w < game.camX - 100) this.alive = false; }
    this.y = Math.max(50, Math.min(380, this.y));
  }
  hit(fromDir, dmg = 1) { this.hp -= dmg; this.flash = 8; if (this.hp <= 0) { this.alive = false; return true; } return false; }
  draw(cam) { drawUFO(this.x - cam, this.y, this.t, Math.sin(this.t * 0.05) * 0.12, true, this.flash); drawCreatureHp(this, cam); }
}

const RIVAL_PAINTS = [[rgb(40, 110, 220), WHITE], [rgb(40, 160, 80), GOLD], [rgb(240, 200, 40), BLACK], [rgb(150, 60, 190), WHITE], [rgb(240, 120, 30), WHITE], [rgb(30, 30, 36), rgb(240, 60, 60)]];
class Rival extends Enemy {   // a rival racing car: they race too, and crashing into one hurts
  constructor(tx, ty, mul = 1) {
    super();
    this.init("Y", CAR_W, CAR_H, 99, 0);
    const col = Math.floor(tx / TILE);
    this.x = tx; this.y = ty + TILE - this.h; this.racer = col < 30; this.dir = 1;
    this.top = this.racer ? [8.9, 8.5, 8.1][Math.min(2, Math.floor(col / 8))] * (0.94 + mul * 0.05) : 4.4 + (col % 5) * 0.3;
    this.paint = RIVAL_PAINTS[col % RIVAL_PAINTS.length]; this.num = 2 + (col % 8);
  }
  hittable() { return false; }
  harmful() { return !this.racer; }   // the rival racers drive in the far lane; slow cars share yours
  update(level, player, game) {
    this.t++;
    if (game.levelTimer < RACE_GO) { this.vx = 0; physicsMove(this, level); return; }
    if (this.onGround) {
      this.vx += (this.top - this.vx) * 0.03;
      const ahead = this.x + this.w + 30;   // jump the gaps
      if (!level.solidAt(Math.floor(ahead / TILE), Math.floor((this.y + this.h + 4) / TILE)) || this.hitWall) this.vy = -13;
    }
    physicsMove(this, level);
    if (this.x > level.pxW - this.w) { this.x = level.pxW - this.w; this.vx = 0; }
    if (this.y > level.pxH + 100) this.alive = false;
  }
  draw(cam) {
    if (this.racer) { ctx.save(); ctx.translate(this.x - cam + 38, this.y + 36); ctx.scale(0.88, 0.88); drawCar(-38, -50, this.t, this.paint, false, this.x * 0.06, this.onGround ? 0 : -0.06, this.num); ctx.restore(); }
    else drawCar(this.x - cam, this.y, this.t, this.paint, false, this.x * 0.06, this.onGround ? 0 : -0.06, this.num);
  }
}

class Bear extends Enemy {   // a sleeping bear. Sneak up and whack him while he sleeps (a surprise attack hurts double!). Too much noise and he wakes up: then it's a fight — he swipes and charges
  constructor(tx, ty, mul = 1, S = 1) {
    super();
    this.S = S; this.init("L", Math.round(112 * S), Math.round(50 * S), 5, 400);
    this.x = tx; this.y = ty + TILE - this.h; this.home = this.x; this.mul = mul; this.dh = Math.round(20 * S);
    this.mode = "deep"; this.modeT = randInt(160, 300); this.alert = 0; this.dir = tx % 80 ? -1 : 1; this.shushed = false; this.slashBox = null; this.actions = 0;
  }
  asleep() { return this.mode === "deep" || this.mode === "quiet" || this.mode === "stir"; }
  harmful() { return this.mode === "charge" && this.stun === 0; }   // his charge hurts; his swipe is a slash
  hearing() { return this.mode === "stir" ? 3.5 : this.mode === "quiet" ? 1.6 : 1; }
  wake(game, px) {
    const cx = this.x + this.w / 2;
    this.mode = "wake"; this.modeT = 34; this.dir = px > cx ? 1 : -1; this.h += this.dh; this.y -= this.dh; this.vx = 0;
    game.sound("growl"); game.popup(cx, this.y - 40, "¡GRRR!", HEART); game.shake = Math.max(game.shake, 10);
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    this.slashBox = null;
    const S = this.S, cx = this.x + this.w / 2, px = player.x + player.w / 2, dx = px - cx, d = Math.abs(dx);
    const sameLevel = Math.abs(player.y + player.h - (this.y + this.h)) < 70 * S;
    if (this.asleep()) {
      const near = Math.max(0, 1 - d / 400);
      this.alert = Math.max(0, this.alert + game.noise * near * this.hearing() - 0.35);
      if (this.alert > 70 && !this.shushed) { this.shushed = true; game.popup(cx, this.y - 40, "¡Shhh!", GOLD); }
      if (this.alert < 40) this.shushed = false;
      if (this.mode === "deep" && this.t % 70 === 0 && d < 500) game.sound("snore");
      if (--this.modeT <= 0) {   // deep sleep -> snoring stops -> stirs -> back to sleep
        if (this.mode === "deep") { this.mode = "quiet"; this.modeT = 34; }
        else if (this.mode === "quiet") { this.mode = "stir"; this.modeT = randInt(80, 110); }
        else { this.mode = "deep"; this.modeT = Math.round(randInt(200, 330) / this.mul); }
      }
      if (this.alert >= 100 && !player.dead) this.wake(game, px);   // WAKE UP
    } else if (this.stun > 0) { this.stun--; this.vx *= 0.85; }
    else if (this.mode === "wake") { this.vx = 0; if (--this.modeT <= 0) { this.mode = "stalk"; this.modeT = 20; } }
    else if (this.mode === "stalk") {   // lumbers towards you
      this.dir = dx > 0 ? 1 : -1; this.vx = this.dir * 1.7 * this.mul;
      if (this.modeT > 0) this.modeT--;
      else if (d < 100 * S && sameLevel) { this.mode = "rear"; this.modeT = Math.round(24 / this.mul); this.vx = 0; this.actions++; }
      else if (d > 170 * S && d < 440 && sameLevel && Math.random() < 0.025) { this.mode = "crouch"; this.modeT = Math.round(30 / this.mul); this.vx = 0; this.actions++; game.sound("growl"); }
      else if (d > 800 && !this.boss) this.mode = "home";
    } else if (this.mode === "rear") { this.vx = 0; if (--this.modeT <= 0) { this.mode = "swipe"; this.modeT = 12; game.sound("swing"); } }   // up on his hind legs...
    else if (this.mode === "swipe") {   // ...and SWIPE
      const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 24 * S : r.x - 46 * S, y: r.y - 14 * S, w: 70 * S, h: r.h + 14 * S };
      if (--this.modeT <= 0) { this.mode = "tired"; this.modeT = Math.round(44 / this.mul); }
    } else if (this.mode === "crouch") { this.vx = 0; this.dir = dx > 0 ? 1 : -1; if (--this.modeT <= 0) { this.mode = "charge"; this.modeT = 80; game.sound("roar"); } }
    else if (this.mode === "charge") {   // head down, full speed
      this.vx = this.dir * 7 * Math.min(1.2, this.mul);
      if (this.t % 5 === 0) game.dust(this.x + (this.dir > 0 ? 0 : this.w), this.y + this.h);
      const wall = this.hitWall || this.boss && (this.x <= this.minX + 2 || this.x >= this.maxX - this.w - 2);
      if (wall) { this.mode = "tired"; this.modeT = 90; this.vx = 0; game.shake = 14; game.sound("stomp"); game.popup(this.x + this.w / 2, this.y - 30, "¡Mareado! ¡Ahora!", GOLD); }
      else if ((px - cx) * this.dir < -90 * S || --this.modeT <= 0) { this.mode = "skid"; this.modeT = 30; }
    } else if (this.mode === "skid") { this.vx *= 0.9; if (this.t % 4 === 0) game.dust(this.x + (this.dir > 0 ? this.w : 0), this.y + this.h); if (--this.modeT <= 0) { this.mode = "tired"; this.modeT = 40; } }
    else if (this.mode === "tired") {   // puffing and panting: hit him now!
      this.vx = 0;
      if (--this.modeT <= 0) {
        if (this.boss && this.actions % 3 === 0) { this.mode = "roar"; this.modeT = 64; game.sound("roar"); game.popup(cx, this.y - 30, "¡GRRROAAAR!", HEART); }
        else { this.mode = "stalk"; this.modeT = 20; }
      }
    } else if (this.mode === "roar") {   // Mamá Osa roars and rocks fall from the roof of the cave
      this.vx = 0; game.shake = Math.max(game.shake, 4);
      if (this.modeT % 10 === 0) {
        const rx = Math.max(this.minX + 20, Math.min(this.maxX - 20, px + randInt(-180, 180)));
        game.shots.push({ kind: "rock", enemy: true, x: rx, y: -30, vx: 0, vy: 1, t: 0, life: 240, col: rgb(110, 90, 80), dark: rgb(70, 56, 50) });
      }
      if (--this.modeT <= 0) { this.mode = "stalk"; this.modeT = 10; }
    } else if (this.mode === "home") {   // you got away: he wanders back to bed
      this.dir = this.home > this.x ? 1 : -1; this.vx = this.dir * 2;
      if (d < 300) { this.mode = "stalk"; this.modeT = 0; }
      else if (Math.abs(this.home - this.x) < 4) { this.x = this.home; this.vx = 0; this.h -= this.dh; this.y += this.dh; this.mode = "deep"; this.modeT = 300; this.alert = 40; }
    }
    physicsMove(this, level);
    if (!this.asleep() && this.onGround && this.vx * this.dir > 0 && ledgeAhead(this, level)) { this.vx = 0; if (this.mode === "charge") { this.mode = "skid"; this.modeT = 20; } }
  }
  hit(fromDir, dmg = 1) {
    if (this.invuln > 0) return false;
    if (this.asleep()) {   // a surprise attack: double damage!
      dmg *= 2; game.popup(this.x + this.w / 2, this.y - 60, "¡Ataque sorpresa!", GOLD); say("sorpresa", true);
      this.wake(game, this.x + this.w / 2 - fromDir * 100);
    }
    this.hp -= dmg; this.flash = 8;
    if (this.boss) this.invuln = 14; else { this.stun = 12; this.vx = fromDir * 3; }
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  draw(cam) { drawBear(this, cam); }
}

class SeaMine extends Enemy {   // a spiky sea mine, chained to the seabed ('W') or drifting up and down ('f')
  constructor(kind, tx, ty) {
    super();
    this.init(kind, 30, 30, 1, 100);
    this.x = tx + 5; this.y = ty + 5; this.baseY = this.y; this.phase = Math.random() * 6; this.anchorY = null;
  }
  hit() { this.hp = 0; this.alive = false; return true; }
  update(level) {
    this.t++;
    if (this.anchorY === null) {   // find the seabed below for the chain
      let gy = this.y + 30; while (gy < level.pxH && !level.solidAt(Math.floor((this.x + 15) / TILE), Math.floor(gy / TILE))) gy += 8;
      this.anchorY = gy;
    }
    this.y = this.baseY + (this.kind === "f" ? Math.sin(this.t * 0.025 + this.phase) * 56 : Math.sin(this.t * 0.04 + this.phase) * 4);
  }
  draw(cam) { drawSeaMine(this, cam); }

class VineHead extends Enemy {   // one of the Planta Madre's snapping heads, on a long vine
  constructor(core, ox, oy, delay) {
    super();
    this.init("v", 44, 36, 4, 600);
    Object.assign(this, { core, ox, oy, mode: "idle", modeT: delay, jaw: 0.3, ang: Math.PI, mul: core.mul, t: 0 });
    this.home(); this.hx = this.rx; this.hy = this.ry; this.sync();
  }
  home() {
    this.rx = this.core.x + this.core.w / 2 + this.ox + Math.sin(this.t * 0.04 + this.oy) * 8;
    this.ry = this.core.y + this.core.h * 0.35 + this.oy + Math.cos(this.t * 0.05 + this.ox) * 6;
  }
  sync() { this.x = this.hx - this.w / 2; this.y = this.hy - this.h / 2; }
  head() { return { x: this.hx - 22, y: this.hy - 18, w: 44, h: 36 }; }
  harmful() { return false; }   // only the jaws catch you
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    this.home();
    const px = player.x + player.w / 2, py = player.y + player.h / 2;
    if (this.stun > 0) { this.stun--; if (this.mode !== "hold" && this.mode !== "rest") { this.mode = "rest"; this.modeT = 50; } }
    let tx = this.rx, ty = this.ry, k = 0.12;
    if (this.mode === "idle") {
      this.jaw += (0.3 - this.jaw) * 0.1; this.ang = Math.atan2(py - this.hy, px - this.hx);
      if (this.modeT > 0) this.modeT--;
      else if (Math.hypot(px - this.rx, py - this.ry) < 330 && player.x > this.core.minX && !player.dead && !game.caught) { this.mode = "open"; this.modeT = Math.round(44 / this.mul); game.sound("rustle"); }
    } else if (this.mode === "open") {   // rear back, jaws wide
      this.jaw = Math.min(1, this.jaw + 0.05); this.ang = Math.atan2(py - this.hy, px - this.hx);
      tx = this.rx - Math.cos(this.ang) * 26; ty = this.ry - Math.sin(this.ang) * 26;
      if (--this.modeT <= 0) {
        const d = Math.min(230, Math.hypot(px - this.rx, py - this.ry) + 10);
        this.target = [this.rx + Math.cos(this.ang) * d, this.ry + Math.sin(this.ang) * d]; this.mode = "snap"; this.modeT = 14; game.sound("snap");
      }
    } else if (this.mode === "snap") {   // SNAP!
      [tx, ty] = this.target; k = 0.4; this.jaw = this.modeT > 6 ? 1 : 0;
      if (!game.caught && player.invuln === 0 && !player.dead && collide(this.head(), inflate(player.rect(), -4, -2))) game.catchBy(this);
      else if (--this.modeT <= 0) { this.mode = "rest"; this.modeT = 60; }
    } else if (this.mode === "rest") {   // missed! it lies there dazed for a moment: chop it!
      this.jaw = 0;
      if (this.modeT > 22) { tx = this.hx; ty = this.hy; }
      if (--this.modeT <= 0) { this.mode = "idle"; this.modeT = randInt(30, 70); }
    } else if (this.mode === "hold") { tx = this.hx; ty = this.hy; this.jaw = 0.12 + Math.abs(Math.sin(this.t * 0.4)) * 0.12; }
    this.hx += (tx - this.hx) * k; this.hy = Math.min(TILE * 11 - 18, this.hy + (ty - this.hy) * k);
    this.sync();
  }
  grip(p) { p.x = this.hx - p.w / 2 + Math.cos(this.ang) * 6; p.y = Math.min(this.hy - p.h / 2 + 10, TILE * 11 - p.h); }
  release() { this.mode = "rest"; this.modeT = 70; this.stun = 60; }
  hit(fromDir, dmg = 1) {
    this.hp -= dmg; this.flash = 8; this.stun = 40;
    if (this.hp <= 0) {
      this.alive = false;
      if (!this.core.heads.some(h => h.alive) && this.core.alive) { this.core.angry = true; game.popup(this.core.x + 40, this.core.y - 20, "¡Está furiosa!", HEART); say("furiosa", true); }

    }
    return false;
  }

}

class IronSpider extends Enemy {   // La Araña de Hierro: a giant mechanical spider. She stomps, pounces and fires her red eye-laser
  constructor(tx, ty, level, mul = 1) {
    super();
    this.init("%", 170, 96, 18, 6000);
    this.x = tx + TILE - this.w; this.y = ty + TILE - this.h; this.minX = level.arena[0]; this.maxX = level.arena[1]; this.mul = mul; this.level = level;
    this.mode = "wait"; this.modeT = 40; this.invuln = 0; this.actions = 0; this.rear = 0; this.slashBox = null; this.babies = false; this.air = false;
    this.title = "LA ARAÑA DE HIERRO"; this.voice = "arana"; this.intro = "¡La Araña de Hierro!";
  }
  harmful() { return this.mode === "pounce"; }   // only landing on you hurts; her stomp and laser hurt too
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.invuln) this.invuln--;
    this.slashBox = null;
    const anger = 1 + (1 - this.hp / this.maxHp) * 0.5;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dist = Math.abs(dx), face = () => { this.dir = dx > 0 ? 1 : -1; };
    const awake = player.x > this.minX - 60 && !player.dead;
    let rearTo = 0;
    if (this.mode === "wait") { this.vx = 0; face(); if (awake && --this.modeT <= 0) this.mode = "walk"; }
    else if (this.mode === "walk") {
      face(); this.vx = this.dir * 1.5 * this.mul * anger;
      if (this.t % 12 === 0) game.sound("clank");
      if (dist < 150) { this.actions++; this.mode = "rear"; this.modeT = Math.round(26 / anger); this.vx = 0; }
      else if (Math.random() < 0.014 * anger) { this.actions++; this.vx = 0; if (dist > 300) { this.mode = "crouch"; this.modeT = 24; } else { this.mode = "aim"; this.modeT = 46; } }
    } else if (this.mode === "rear") { this.vx = 0; rearTo = 1; if (--this.modeT <= 0) { this.mode = "stomp"; this.modeT = 12; } }
    else if (this.mode === "stomp") {   // the front legs come crashing down
      const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 40 : r.x - 60, y: r.y + 10, w: 100, h: r.h - 10 };
      if (this.modeT === 12) { game.shake = Math.max(game.shake, 10); game.sound("stomp"); }
      if (--this.modeT <= 0) { this.mode = "recover"; this.modeT = Math.round(52 / anger); }

    this.armed = true; this.dropX = null; this.groundY = 0; this.fetchT = 0; this.slashBox = null; this.throwCd = randInt(30, 80); this.swAng = -2.3; this.invuln = 0;
  }
  harmful() { return false; }   // bumping into him is fine: it's the sword that hurts
  catchSword() { this.armed = true; this.mode = "pickup"; this.modeT = 12; this.throwCd = Math.round(randInt(80, 130) / this.mul); }
  lost(x, game) {   // the sword was knocked out of the air (or hit a wall): he has to go and fetch it
    this.armed = false; this.groundY = this.y + this.h; this.fetchT = 0; this.mode = "walk";
    this.dropX = this.boss ? Math.max(this.minX + 30, Math.min(this.maxX - 30, x)) : x;
    game.popup(this.x + this.w / 2, this.y - 24, this.boss ? "¡Desarmado! ¡Ataca!" : "¡Desarmado!", GOLD);
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.invuln) this.invuln--;
    this.slashBox = null;
    const S = this.S, cx = this.x + this.w / 2, dx = player.x + player.w / 2 - cx, d = Math.abs(dx);
    const same = Math.abs(player.y + player.h - (this.y + this.h)) < 70, face = () => { this.dir = dx > 0 ? 1 : -1; };
    const awake = !player.dead && (this.boss ? player.x > this.minX - 40 : d < 640);
    const angry = this.boss && this.hp <= this.maxHp / 2;
    let target = -2.3;
    if (this.stun > 0) { this.stun--; this.vx *= 0.8; if (this.mode === "windup") this.mode = "walk"; }
    else if (this.mode === "walk") {
      if (this.armed) {
        if (awake) face();
        this.vx = awake ? this.dir * 0.9 * this.mul * (this.boss ? 1.3 : 1) : 0;
        if (this.throwCd > 0) this.throwCd--;
        if (awake && d < 90 * S && same) { this.mode = "windup"; this.modeT = Math.round((this.boss ? 22 : 26) / this.mul); this.vx = 0; game.sound("shing"); }
        else if (awake && d > 120 * S && d < (this.boss ? 520 : 340) && Math.abs(player.y - this.y) < 110 && this.throwCd <= 0) { this.mode = "aim"; this.modeT = Math.round(28 / this.mul); this.vx = 0; game.sound("shing"); }
        else if (this.boss && this.hp <= this.maxHp * 0.66 && Math.random() < 0.006) { this.mode = "spin"; this.modeT = 80; game.sound("swing"); game.popup(cx, this.y - 20, "¡Torbellino!", HEART); }
      } else {   // walks over to where his sword fell and picks it up
        const tx = this.dropX - this.w / 2; this.dir = tx > this.x ? 1 : -1; this.vx = this.dir * 1.5 * this.mul;
        if (Math.abs(tx - this.x) < 6 || ++this.fetchT > 300) { this.armed = true; this.dropX = null; this.mode = "pickup"; this.modeT = 24; this.vx = 0; this.throwCd = Math.round(randInt(60, 110) / this.mul); }
      }
    } else if (this.mode === "windup") { this.vx = 0; target = -1.6; if (--this.modeT <= 0) { this.mode = "chop"; this.modeT = 12; game.sound("swing"); } }   // sword raised high...
    else if (this.mode === "chop") {   // ...and down it comes
      target = 0.5; const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 6 : r.x - 74 * S, y: r.y + 4, w: 80 * S, h: r.h - 4 };
      if (this.modeT === 12) game.shake = Math.max(game.shake, this.boss ? 8 : 4);
      if (--this.modeT <= 0) { this.mode = "rest"; this.modeT = Math.round(40 / this.mul); }
    } else if (this.mode === "aim") {   // pulls the sword right back...

      if (--this.modeT <= 0) {   // ...and HURLS it
        const high = angry && Math.random() < 0.5;
        game.shots.push({ kind: "bsword", enemy: true, nochop: true, owner: this, dir: this.dir, dec: 0.16 * this.mul, len: this.boss ? 92 : 66, spin: 0,
          x: cx + this.dir * 20, y: this.y + this.h * 0.38 - (high ? 26 : 0), vx: this.dir * (this.boss ? 10.5 : 9.6) * this.mul, vy: 0, t: 0, life: 420, col: rgb(214, 220, 232), dark: GOLD });
        this.armed = false; this.mode = "wait"; game.sound("swing");

      target = this.t * 0.6; this.vx = this.dir * 5 * this.mul; const r = this.rect();

      if (--this.modeT <= 0 || this.x <= this.minX + 2 || this.x >= this.maxX - this.w - 2) { this.mode = "rest"; this.modeT = 60; this.vx = 0; this.swAng = 0.9; game.popup(cx, this.y - 20, "¡Mareado!", GOLD); }
    } else if (this.mode === "rest" || this.mode === "pickup") { this.vx = 0; target = this.mode === "rest" ? 0.9 : 1.3; if (--this.modeT <= 0) this.mode = "walk"; }

}

class EnemyFighter extends EnemyPlane {   // an enemy starfighter: swoops in firing red lasers; some loop round and chase you
  constructor(tx, ty, mul = 1, awake = false) { super(tx, ty, mul, awake); this.kind = "/"; }
  fire(game, player, spread) {
    const sx = this.x + (this.dir > 0 ? this.w : 0), sy = this.y + 15;
    const a = Math.atan2(player.y + 17 - sy, player.x + player.w / 2 - sx);
    for (const o of spread ? [-0.2, 0.2] : [0]) game.shots.push({ kind: "laser", red: true, enemy: true, x: sx, y: sy,
      vx: Math.cos(a + o) * 5.4 * this.mul, vy: Math.sin(a + o) * 5.4 * this.mul, t: 0, col: rgb(255, 60, 90), dark: rgb(150, 20, 40) });

class Mothership extends Airship {   // La Nave Nodriza: a giant enemy mothership guarding the way home — lasers, rings of energy and squadrons of fighters
  constructor(tx, ty, level, mul = 1) {
    super(tx, ty, level, mul);
    this.kind = "}"; this.w = 300; this.h = 120; this.maxX = level.pxW - this.w - 20; this.hp = this.maxHp = 44; this.score = 9000;
    this.title = "LA NAVE NODRIZA"; this.voice = "nodriza"; this.intro = "¡La Nave Nodriza!";
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (!this.awake) { if (player.x > this.x - W * 0.8) this.awake = true; else return; }
    const p2 = this.hp <= this.maxHp / 2;
    this.x += (Math.min(this.maxX, player.x + 450) - this.x) * 0.03;
    this.y = this.baseY + Math.sin(this.t * 0.018) * 90;
    if (player.dead) return;
    const gx = this.x + 30, gy = this.y + 70;   // the laser cannon under its nose
    if (--this.gunT <= 0) {
      const a = Math.atan2(player.y + 17 - gy, player.x + player.w / 2 - gx);
      for (const o of p2 ? [-0.22, 0, 0.22] : [-0.1, 0.1]) game.shots.push({ kind: "laser", red: true, enemy: true, x: gx, y: gy,

class Breakable extends Enemy {   // a bush ('?') or a clay pot (','): chop it and coins fall out

class KeyItem extends Enemy {   // a little golden key: grab it, then walk into a locked door to open it
  constructor(tx, ty) { super(); this.init("-", 24, 30, 1, 0); this.x = tx + 8; this.y = ty + 6; this.baseY = this.y; }

    }

class Chest extends Enemy {   // the treasure chest at the heart of the temple
  constructor(tx, ty) { super(); this.init("`", 50, 38, 1, 0); this.x = tx - 5; this.y = ty + TILE - this.h; this.opened = false; this.open = 0; }
  harmful() { return false; }
  hittable() { return false; }
  update(level, player, game) {
    this.t++;
    if (!this.opened && !player.dead && collide(inflate(this.rect(), 8, 0), player.rect())) {
      this.opened = true; game.coins += 30; game.sound("win"); say("tesoro", true);
      game.popup(this.x + 25, this.y - 50, "¡La Gema Antigua! +30", GOLD); game.burst(this.x + 25, this.y, [GOLD, WHITE, rgb(80, 220, 160)], 30, 5);
    }

class Boss extends Enemy {   // the Rey Canguro: big hops, shakes the ground, calls little kangaroos
  constructor(tx, ty, level, mul = 1) {
    super();
    this.init("B", 76, 100, 8, 3000);
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h;
    this.minX = level.arena[0]; this.maxX = level.arena[1]; this.mul = mul;
    this.wait = 90; this.hops = 0; this.invuln = 0; this.jumping = false;
    this.title = "REY CANGURO"; this.voice = "jefe"; this.intro = "¡El Rey Canguro!";
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.invuln) this.invuln--;
    const awake = player.x > this.minX - 120;
    if (this.stun > 0) { this.stun--; this.vx *= 0.9; }
    else if (this.onGround && awake) {
      this.vx = 0;
      if (--this.wait <= 0) {
        const anger = this.maxHp - this.hp;
        this.dir = player.x + player.w / 2 > this.x + this.w / 2 ? 1 : -1;
        this.vy = -(this.hops % 3 === 2 ? 14 : 10);
        this.vx = this.dir * (2.4 + anger * 0.12) * this.mul;
        this.wait = Math.max(28, randInt(45, 75) - anger * 3);
        this.hops++; this.jumping = true;
      }
    }
    physicsMove(this, level);
    if (this.x < this.minX) { this.x = this.minX; this.vx = Math.abs(this.vx); }
    if (this.x > this.maxX - this.w) { this.x = this.maxX - this.w; this.vx = -Math.abs(this.vx); }
    if (this.onGround && this.jumping) {
      this.jumping = false; game.shake = Math.max(game.shake, 10); game.sound("stomp");
      if (this.hops % 3 === 0 && level.enemies.length < 6) {
        level.enemies.push(new Kangaroo("t", this.x + this.w / 2 - 20 + this.dir * 50, this.y + this.h - TILE, this.mul));
        game.sound("boing");
      }
    }
  }
  hit(fromDir, dmg = 1) {
    if (this.invuln > 0) return false;
    this.hp -= dmg; this.flash = 10; this.invuln = 24; this.stun = 22; this.vx = fromDir * 5;
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  draw(cam) { drawKangaroo(this, cam); }
}

// ------------------------------------------------------------------ level
class Coin {
  constructor(x, y) { this.x = x; this.y = y; this.t = Math.random() * 100; }
  rect() { return { x: Math.round(this.x - 9), y: Math.round(this.y - 9 + Math.sin(this.t * 0.08) * 3), w: 18, h: 18 }; }
}
class Level {
  constructor(def) {
    const rows = def.map, width = Math.max(...rows.map(r => r.length)), mul = def.speed;
    this.name = def.name; this.hint = def.hint || ""; this.theme = THEMES[def.theme]; this.bike = null; this.tank = null; this.mode = def.mode || null; this.shield = !!def.shield; this.pickups = [];
    this.rows = rows.map(r => r.padEnd(width, "."));
    this.w = width; this.h = rows.length; this.pxW = this.w * TILE; this.pxH = this.h * TILE;
    this.tiles = new Map(); this.vines = []; this.spikes = []; this.coins = []; this.enemies = []; this.lifeups = []; this.carups = []; this.door = null; this.revealed = new Set();
    this.oils = []; this.boosts = []; this.clocks = []; this.leaves = [];
    this.grav = def.grav || 1; this.start = [TILE * 2, TILE * 9]; this.flag = null; this.boss = null; this.arena = [0, this.pxW];
    const later = [];
    this.rows.forEach((row, cy) => [...row].forEach((ch, cx) => {
      const x = cx * TILE, y = cy * TILE;
      if (SOLID.includes(ch)) this.tiles.set(cx + "," + cy, ch);
      else if (ch === "^") this.spikes.push({ x, y });
      else if (ch === "o") this.coins.push(new Coin(x + TILE / 2, y + TILE / 2));
      else if (ch === "P") this.start = [x + (TILE - KNIGHT_W) / 2, y + TILE - KNIGHT_H];
      else if (ch === "1") this.enemies.push(new AlienWalker(x, y, mul));
      else if (ch === "2") this.enemies.push(new AlienHopper("2", x, y, mul));
      else if (ch === "5") this.enemies.push(new CableSpider(x, y, mul));
      else if (ch === "6") this.enemies.push(new Dragonling(x, y, mul));
      else if (ch === "7") this.enemies.push(new Drake("7", x, y, mul));
      else if (ch === "9") this.enemies.push(new PirateGunner(x, y, mul));
      else if (ch === "¿") this.enemies.push(new PenguinFort(x, y, mul));
      else if (ch === "ß") this.enemies.push(new Bandit(x, y, mul));
      else if (ch === "Ø") later.push(["Ø", x, y]);
      else if (ch === "¡") this.enemies.push(new SnowmanThrower(x, y, mul));
      else if (ch === "¢") later.push(["¢", x, y]);
      else if (ch === "<") { this.enemies.push(new Pickup(x, y, mul)); this.rock = true; }
      else if (ch === "»") { later.push(["»", x, y]); this.rock = true; }
      else if (ch === "!") this.enemies.push(new Cannon(x, y, mul));
      else if (ch === "3" || ch === "+") this.enemies.push(new Helicopter(ch, x, y, mul));
      else if (ch === "i") this.vines.push({ ax: x + 20, ay: 0, len: y + TILE + 30, th: 0.08 * Math.sin(x * 0.01), om: 0 });
      else if (ch === "(") this.enemies.push(new SwordKnight(x, y, mul));
      else if (ch === "/") this.enemies.push(new EnemyFighter(x, y, mul));
      else if (ch === "?" || ch === ",") this.enemies.push(new Breakable(ch, x, y));
      else if (ch === "-") this.enemies.push(new KeyItem(x, y));
      else if (ch === "`") this.enemies.push(new Chest(x, y));
      else if (ch === "_") this.enemies.push(new AlienHopper("_", x, y, mul));
      else if ("%&$*@{}".includes(ch)) later.push([ch, x, y]);
      else if (ROO_STATS[ch]) this.enemies.push(new Kangaroo(ch, x, y, mul));
      else if (FLYER_STATS[ch]) this.enemies.push(new Flyer(ch, x, y, mul));
      else if (LUNGER_STATS[ch]) this.enemies.push(new Lunger(ch, x, y, mul));
      else if (ch === "m") this.enemies.push(new Mole(x, y, mul));
      else if (ch === "s") later.push(["s", x, y]);
      else if (ch === "M") this.bike = { x: x - 4, y: y + TILE - 34, w: 48, h: 34, taken: false };
      else if (ch === "K") this.tank = { x: x - 16, y: y + TILE - TANK_H, w: TANK_W, h: TANK_H, taken: false };
      else if (ch === "d") this.enemies.push(new Dancer(x, y, mul));
      else if (ch === "h") this.enemies.push(new Shadow(x, y, mul));
      else if (ch === "a") this.enemies.push(new Archer(x, y, mul));
      else if (ch === "E") this.enemies.push(new EnemyPlane(x, y, mul));
      else if (ch === "O") this.enemies.push(new Asteroid(x + TILE / 2, y + TILE / 2, Math.random() < 0.45 ? 2 : 1, mul));
      else if (ch === "u") this.enemies.push(new Alien(x, y, mul));
      else if (ch === "U") this.lifeups.push({ x: x + TILE / 2, y: y + TILE / 2 });
      else if (ch === "Ç") this.carups.push({ x: x + TILE / 2, y: y + TILE / 2 });
      else if (ch === "D") this.door = { x: x + 4, y: y + TILE - 64, w: 32, h: 64, to: def.door };
      else if (ch === "R") later.push(["R", x, y]);
      else if (ch === "Y") this.enemies.push(new Rival(x, y, mul));
      else if (ch === "W" || ch === "f") this.enemies.push(new SeaMine(ch, x, y));
      else if (ch === "S") this.enemies.push(new Snapper(x, y, mul));
      else if (ch === "I") this.enemies.push(new Dropper(x, y, mul));
      else if (ch === "p") this.enemies.push(new Spitter(x, y, mul));
      else if (ch === "e") this.enemies.push(new FlowerTrap(x, y, mul));
      else if (ch === "G") this.enemies.push(new Jelly(x, y));
      else if (ch === "0") later.push(["0", x, y]);
      else if (ch === "L") this.enemies.push(new Bear(x, y, mul));
      else if (ch === "~") this.oils.push({ x, y: y + TILE - 10, w: TILE * 1.5, h: 10 });
      else if (ch === ">") this.boosts.push({ x, y: y + TILE - 8, w: TILE, h: 8 });
      else if (ch === "A") this.clocks.push({ x: x + TILE / 2, y: y + TILE / 2 });
      else if (ch === ";") this.leaves.push({ x, y: y + TILE - 14, w: TILE, h: 14 });
      else if (ch === "V") { const c = this.cover || (this.cover = { x0: x, y0: y, x1: x, y1: y }); c.x0 = Math.min(c.x0, x); c.y0 = Math.min(c.y0, y); c.x1 = Math.max(c.x1, x); c.y1 = Math.max(c.y1, y); }
      else if (ch === "N") this.pickups.push({ x: x + TILE / 2, y: y + TILE / 2 });
      else if (ch === "X") later.push(["X", x, y]);
      else if (ch === "Z") later.push(["Z", x, y]);
      else if (ch === "z") this.enemies.push(new SkyMine(x, y));
      else if (ch === "B") later.push(["B", x, y]);
      else if (ch === "[") this.arena[0] = x;
      else if (ch === "]") this.arena[1] = x + TILE;
      else if (ch === "F") this.flag = { x: x + TILE / 2 - 3, y: y + TILE - TILE * 7, w: 6, h: TILE * 7 };

function drawMole(e, cam) {

      x: 260, y: 0, vx: 0, vy: 0, ang: 0, air: false, airT: 0, face: 1, nitro: 0, nitroCd: 0, wheel: 0, bump: 0, count: 160, done: false, foes: [], finished: [] };

  updateMRace() {

    const cam = () => { const want = Math.max(0, Math.min(T.len - W, T.x - 280)); this.camX += (want - this.camX) * 0.18; };
    if (this.levelTimer < 90) { T.y = gy(T.x); this.syncMT(); this.camX = 0; return; }

      if (e.kind === "a") e.drawT = 34 - Math.floor(e.t % 60 / 2);

  }
  updatePets() {
    const p = this.player, lvl = this.level;
    if (p.bubbleCd > 0) { p.bubbleCd--; if (p.bubbleCd === 0 && this.upg.bubble) { play("shing"); this.popup(p.x + p.w / 2, p.y - 20, "¡Burbuja lista!", rgb(150, 220, 255)); } }
    if (this.upg.magnet && !p.dead) for (const c of lvl.coins) {   // coins within reach fly to you
      const dx = p.x + p.w / 2 - c.x, dy = p.y + p.h / 2 - c.y, d = Math.hypot(dx, dy);
      if (d < 150 && d > 1) { c.x += dx / d * Math.min(d, 6); c.y += dy / d * Math.min(d, 6); }
    }
    this.updateOwl();
    if (!this.upg.dragon || p.dead) { this.dragon = null; return; }
    const D = this.dragon || (this.dragon = { x: p.x, y: p.y - 40, cd: 120, dir: 1, mouth: 0 });   // the baby dragon flies just behind your shoulder
    const hx = p.x + p.w / 2 - p.facing * 34, hy = p.y - 18 + Math.sin(this.t * 0.07) * 6;
    D.x += (hx - D.x) * 0.12; D.y += (hy - D.y) * 0.12; D.dir = p.facing;
    if (D.mouth > 0) D.mouth--;
    if (D.cd > 0) D.cd--;
    else {   // a puff of fire at the nearest enemy in front, every few seconds
      let best = null, bd = 300;
      for (const e of lvl.enemies) { if (!e.alive || !e.hittable() || e.kind === "z") continue; const ex = e.x + e.w / 2, ey = e.y + e.h / 2, d = Math.hypot(ex - D.x, ey - D.y); if (d < bd && (ex - D.x) * p.facing > -20) { bd = d; best = e; } }
      if (best) {
        const ex = best.x + best.w / 2, ey = best.y + best.h / 2, d = Math.hypot(ex - D.x, ey - D.y) || 1;
        this.shots.push({ kind: "dfire", x: D.x + p.facing * 12, y: D.y, vx: (ex - D.x) / d * 7, vy: (ey - D.y) / d * 7, t: 0, life: 60, hit: new Set(), dmg: 1 });

  updateOwl() {   // the explorer owl: perches on your shoulder, and flies to a secret door or hidden star when one is near
    const p = this.player, lvl = this.level;

    const O = this.owl || (this.owl = { x: p.x, y: p.y - 40, dir: 1, seen: new Set(), q: 0 });
    const px = p.x + p.w / 2, py = p.y;
    const goals = []; if (lvl.door && !this.noDoors) goals.push([lvl.door, lvl.door.x + lvl.door.w / 2, lvl.door.y - 30]);
    for (const st of lvl.stars || []) if (!st.got) goals.push([st, st.x, st.y - 34]);
    let best = null, bd = 300;
    for (const gl of goals) { const d = Math.hypot(gl[1] - px, gl[2] - py); if (d < bd) { bd = d; best = gl; } }
    let hx = px + p.facing * 30, hy = py - 30 + Math.sin(this.t * 0.06) * 4;
    if (best) {
      hx = best[1]; hy = best[2] + Math.sin(this.t * 0.1) * 6; O.q = 1;
      if (!O.seen.has(best[0])) { O.seen.add(best[0]); play("secret"); this.popup(O.x, O.y - 20, "¡Uh-uuh! ¡Algo por aquí!", rgb(230, 200, 140)); }
    } else O.q = 0;
    const dx = hx - O.x; O.x += dx * 0.08; O.y += (hy - O.y) * 0.08; if (Math.abs(dx) > 2) O.dir = Math.sign(dx);
  }
  updateBees() {   // the guardian bees circle the knight and dart at anything that comes close
    const p = this.player, lvl = this.level;
    if (!this.upg.bees || p.dead) return;
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    if (!this.bees) this.bees = [0, 1].map(k => ({ k, x: cx, y: cy, cd: 40 + k * 50, target: null, dir: 1 }));
    for (const b of this.bees) {
      const a = this.t * 0.08 + b.k * Math.PI, hx = cx + Math.cos(a) * (p.w / 2 + 26), hy = cy - 10 + Math.sin(a) * 22;
      if (b.cd > 0) b.cd--;
      if (b.target && (!b.target.alive || !b.target.hittable())) b.target = null;
      if (!b.target && b.cd === 0) {
        let best = 130;
        for (const e of lvl.enemies) {
          if (!e.alive || !e.hittable() || e.kind === "z") continue;
          const d = Math.hypot(e.x + e.w / 2 - cx, e.y + e.h / 2 - cy); if (d < best) { best = d; b.target = e; }
        }
      }
      if (b.target) {
        const tr = b.target.rect(), dx = tr.x + tr.w / 2 - b.x, dy = tr.y + tr.h / 2 - b.y, d = Math.hypot(dx, dy) || 1, v = Math.min(d, 8);
        b.x += dx / d * v; b.y += dy / d * v; b.dir = dx > 0 ? 1 : -1;
        if (collide({ x: b.x - 7, y: b.y - 7, w: 14, h: 14 }, tr)) { play("buzz"); this.strike(b.target, b.dir, new Set(), 1); b.target = null; b.cd = 200; }

  }
  loseLife() {
    const q2 = this.p2;
    if (q2 && !q2.out && !q2.dead && this.state === "play" && this.lives > 1) {   // two knights: the one still standing keeps going, the fallen one comes back next to them
      this.coSwap(); this.coDie(this.p2); return;
    }
    this.lives--; this.deaths++; this.state = "dying"; this.stateTimer = 110; this.flyingAxe = null;
    const p = this.player; p.dead = true; p.vy = -11; p.attackTimer = 0; p.invuln = 0;
    play("die"); if (this.lives > 0) say("desastre", true);
  }
  burst(x, y, colors, n, speed = 4) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * (speed - 1), life = randInt(20, 40);
      this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, color: pick(colors), life, maxLife: life, size: randInt(3, 6) });
    }
  }
  popup(x, y, text, color = GOLD) { this.popups.push({ x, y, text, color, life: 55 }); }
  throwFan(e, player) {   // a dancer throws a spinning fan at the knight
    const sx = e.x + e.w / 2, sy = e.y + 14, tx = player.x + player.w / 2, ty = player.y + player.h * 0.4;
    const dist = Math.max(40, Math.abs(tx - sx)), speed = 3.6 * e.mul, dir = tx > sx ? 1 : -1;
    const vy = Math.max(-3, Math.min(3, (ty - sy) / (dist / speed)));
    this.shots.push({ kind: "fan", enemy: true, x: sx, y: sy, vx: dir * speed, vy, t: 0, col: e.dress[0], dark: e.dress[1] });
    play("swing");
  }
  enemyShot(x, y, player, speed, kind, col = rgb(255, 210, 120), dark = rgb(200, 110, 40)) {
    const tx = player.x + player.w / 2, ty = player.y + player.h * 0.45, d = Math.hypot(tx - x, ty - y) || 1;
    this.shots.push({ kind, enemy: true, x, y, vx: (tx - x) / d * speed, vy: (ty - y) / d * speed, t: 0, col, dark });
  }
  dust(x, y) { this.burst(x, y, [rgb(196, 176, 140), rgb(160, 140, 110)], 3, 2); }
  splashAt(x) { this.burst(x, WATER_Y, [WHITE, rgb(160, 210, 250), rgb(90, 170, 230)], 14, 5); }

  step() {
    this.t++;
    if (this.resetAsk > 0) this.resetAsk--;
    if (this.resetDone > 0) this.resetDone--;
    if (this.state === "play") this.updatePlay();
    else if (this.state === "map") this.updateMap();
    else if (this.state === "dying") {
      const p = this.player; p.vy = Math.min(p.vy + GRAVITY * 0.8, MAX_FALL); p.y += p.vy;
      if (--this.stateTimer <= 0) {
        if (this.lives > 0) { this.resetLevel(); this.state = "play"; }
        else { this.state = "gameover"; play("gameover"); say("fin", true); }
      }
    } else if (this.state === "pole") this.updatePole();
    else if (this.state === "door") this.updateDoor();
    else if (this.state === "finale" || this.state === "credits") {
      this.stateTimer++;
      if (--this.musicT <= 0) { play("win"); this.musicT = 222; }   // the flamenco keeps playing
      if (this.state === "finale") this.updateFinale(); else this.updateCredits();
    } else if (this.state === "levelclear") {
      this.stateTimer++;

          pick([[GOLD, WHITE], [HEART, WHITE], [ARMOR_LIGHT, WHITE], [GRASS_LIGHT, WHITE]]), 30, 6);

    this.particles = this.particles.filter(q => q.life > 0);
    for (const q of this.popups) { q.y -= 0.8; q.life--; }
    this.popups = this.popups.filter(q => q.life > 0);
    if (this.shake > 0) this.shake--;
    inp.jumpPressed = inp.attack = false;
  }

  strike(e, fromDir, hitIds, base = 1) {   // an axe, knife or cannonball hits an enemy
    if (!e.alive || hitIds.has(e.id) || !e.hittable()) return;
    hitIds.add(e.id);
    const er = e.rect(), ex = er.x + er.w / 2, ey = er.y + er.h / 2;

  breakCrates(box) {

    }
  }

  updatePlay() {
    const p = this.player, lvl = this.level;
    this.levelTimer++; this.runFrames++;
    if (this.copilot) this.copilotMerge();
    if (this.xm) { XM[this.xm.kind].update(this, this.xm); return; }
    if (this.rk) { this.updateRocket(); return; }
    if (this.tv) {
      const k = this.tv.kind;
      if (k === "monster") this.updateMonster(); else if (k === "stunt") this.updateStunt(); else if (k === "derby") this.updateDerby();
      else if (k === "police" || k === "fire") this.updateRoad(); else if (k === "toy") this.updateToy(); else if (k === "mrace") this.updateMRace(); else if (k === "junk") this.updateJunk(); else this.updateTerrain();

    }

      }

      for (let cy = Math.floor(p.y / TILE); cy <= Math.floor((p.y + p.h - 1) / TILE); cy++) if (lvl.tile(fx, cy) === "|") {
        let y0 = cy; while (lvl.tile(fx, y0 - 1) === "|") y0--;
        for (let y = y0; lvl.tile(fx, y) === "|"; y++) { lvl.tiles.delete(fx + "," + y); this.burst(fx * TILE + 20, y * TILE + 20, [rgb(120, 126, 116), GOLD], 8, 3); }
        this.keys--; play("door"); this.popup(fx * TILE + 20, y0 * TILE - 10, "¡Abierto!", GOLD); break;
      }
    }
    if (p.justNitro) { play("nitro"); this.popup(p.x + p.w / 2, p.y - 20, "¡Turbo!", GOLD); }
    if (p.justUmb) { play("umbrella"); this.popup(p.x + p.w / 2, p.y - 60, p.umbrella ? "☂ ¡Abierto!" : "Cerrado", WHITE); }
    if (this.storm) this.updateStorm();
    if (this.shark) this.updateShark();
    if (p.ship && (p.justFired || p.justMG)) {   // the ironclad's guns aim themselves at the nearest helicopter (or mine)
      const gun = (ox, oy, sp) => {
        let best = null, bd = 1e9;
        for (const e of lvl.enemies) {
          if (!e.alive || !e.hittable() || e.awake === false || e.y > WATER_Y) continue;

      }
    }
    if (p.sub && p.justFired) {   // fire a torpedo

      for (const o of lvl.oils) if (p.onGround && p.spinT === 0 && collide(p.rect(), o)) { p.spinT = 40; p.vx *= 0.45; play("skid"); this.popup(p.x + p.w / 2, p.y - 20, "¡Aceite!", WHITE); }
      for (const b of lvl.boosts) if (p.onGround && collide(p.rect(), b) && p.nitroT < 30) { p.nitroT = 45; play("nitro"); this.popup(p.x + p.w / 2, p.y - 20, "¡Turbo!", GOLD); }
      for (const c of [...lvl.clocks]) if (collide(p.rect(), { x: c.x - 22, y: c.y - 22, w: 44, h: 44 })) {
        lvl.clocks.splice(lvl.clocks.indexOf(c), 1); this.raceT += 240; play("oneup"); this.popup(c.x, c.y - 20, "+4 s", GOLD); this.burst(c.x, c.y, [GOLD, WHITE], 12, 4);

      if (p.onGround && Math.abs(p.vx) > 0.5 && lvl.leaves.some(l => collide(p.rect(), l))) { n += 7; if (this.t % 6 === 0) play("click"); }
      this.noise = n;
    }
    if (p.justJumped) play("jump");
    if (this.upg.paint && Math.abs(p.vx) > 2 && !p.dead && this.t % 2 === 0) this.particles.push({ x: p.x + p.w / 2 - p.facing * 10, y: p.y + p.h - 18 + randInt(-12, 12), vx: -p.facing * 0.5, vy: -0.2, color: `hsl(${(this.t * 8) % 360}, 90%, 60%)`, life: 26, maxLife: 26, size: 6 });   // the rainbow trail
    if (p.skates && p.onGround && Math.abs(p.vx) > 5 && this.t % 3 === 0) this.particles.push({ x: p.x + p.w / 2 - Math.sign(p.vx) * 14, y: p.y + p.h - 2, vx: -p.vx * 0.15, vy: -0.3, color: rgb(255, 230, 160), life: 12, maxLife: 12, size: 3 });   // sparks from the skate wheels
    if (p.jetOn) {   // jetpack exhaust: smoke puffs and a whoosh
      if (this.t % 2 === 0) this.particles.push({ x: p.x + p.w / 2 - p.facing * 26 + (Math.random() - 0.5) * 8, y: p.y + 40, vx: (Math.random() - 0.5) * 1.2, vy: 2 + Math.random() * 2, color: Math.random() < 0.5 ? rgb(255, 170, 60) : rgb(200, 200, 200), life: 18, maxLife: 18, size: 5 });
      if (this.t % 10 === 0) play("hiss");
      if (!this.jetTold) { this.jetTold = true; this.popup(p.x + p.w / 2, p.y - 20, "¡Mochila cohete!", GOLD); }
    }
    if (p.justSwung) {
      play("swing");
      if (this.upg.boomerang && !this.flyingAxe)
        this.flyingAxe = new FlyingAxe(p.x + p.w / 2 + p.facing * 30, p.y + 14, p.facing);
      if (p.snowball) {   // throw a snowball in an arc
        this.shots.push({ kind: "snowball", x: p.x + p.w / 2 + p.facing * 18, y: p.y + 14, vx: p.facing * 10 + p.vx * 0.3, vy: -2.5, sgrav: 0.2, life: 110, t: 0, hit: new Set() });
      }
