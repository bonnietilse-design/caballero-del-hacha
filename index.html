const inflate = (r, dx, dy) => ({ x: r.x - Math.floor(dx / 2), y: r.y - Math.floor(dy / 2), w: r.w + dx, h: r.h + dy });
function seeded(a) {   // small repeatable random number generator
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

function synth(rate, dur, f1, f2 = null, wave = "square", vol = 0.4, tremolo = 0, attack = 0.004, curve = 2) {
  if (f2 === null) f2 = f1;
  const n = Math.floor(rate * dur), out = new Float32Array(n), an = Math.max(1, Math.floor(attack * rate));
  const rnd = seeded(5);
  let phase = 0;
  for (let i = 0; i < n; i++) {
    const t = i / n;
    phase += (f1 + (f2 - f1) * t) / rate;
    const p = phase % 1;
    let v;
    if (wave === "square") v = p < 0.5 ? 1 : -1;
    else if (wave === "tri") v = 4 * Math.abs(p - 0.5) - 1;
    else if (wave === "sine") v = Math.sin(2 * Math.PI * p);
    else v = rnd() * 2 - 1;
    let env = Math.min(1, i / an) * Math.pow(1 - t, curve);
    if (tremolo) env *= 0.55 + 0.45 * Math.sin(2 * Math.PI * tremolo * i / rate);
    out[i] = v * env * vol;
  }
  return out;
}
function concat(...parts) {
  const out = new Float32Array(parts.reduce((s, p) => s + p.length, 0));
  let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function mixAll(...parts) {
  const out = new Float32Array(Math.max(...parts.map(p => p.length)));
  for (const p of parts) for (let i = 0; i < p.length; i++) out[i] += p[i];
  return out;
}
function lowpass(a, amount) {
  const out = new Float32Array(a.length); let y = 0;
  for (let i = 0; i < a.length; i++) { y += amount * (a[i] - y); out[i] = y; }
  return out;
}
const silence = (rate, d) => new Float32Array(Math.floor(rate * d));
function whoosh(rate, dur = 0.22, vol = 0.9) {
  const rnd = seeded(9), n = Math.floor(rate * dur), out = new Float32Array(n); let y = 0;
  for (let i = 0; i < n; i++) {
    const t = i / n;
    y += (0.03 + 0.35 * Math.sin(Math.PI * t)) * (rnd() * 2 - 1 - y);
    out[i] = y * vol * Math.pow(Math.sin(Math.PI * t), 1.5);
  }
  return out;
}
function pluck(rate, freq, dur, vol, rnd, damp = 0.996) {   // Karplus-Strong guitar string
  const size = Math.max(2, Math.floor(rate / freq)), buf = new Float32Array(size);
  for (let i = 0; i < size; i++) buf[i] = rnd() * 2 - 1;
  const n = Math.floor(rate * dur), out = new Float32Array(n); let idx = 0;
  for (let i = 0; i < n; i++) {
    const nxt = idx + 1 < size ? idx + 1 : 0, a = buf[idx];
    out[i] = a * vol; buf[idx] = damp * 0.5 * (a + buf[nxt]); idx = nxt;
  }
  const fade = Math.max(1, Math.floor(n / 8));
  for (let i = 0; i < fade; i++) out[n - fade + i] *= 1 - i / fade;
  return out;
}
function flamenco(rate) {   // Andalusian cadence Am-G-F-E, rasgueado and palmas
  const rnd = seeded(11), out = new Float32Array(Math.floor(rate * 3.6));
  const am = [110, 164.8, 220, 261.6, 329.6], g = [98, 123.5, 146.8, 196, 246.9, 392];
  const f = [87.3, 130.8, 174.6, 220, 261.6, 349.2], e = [82.4, 123.5, 164.8, 207.7, 246.9, 329.6];
  const add = (s, start) => { const o = Math.floor(start * rate);
    for (let i = 0; i < s.length && o + i < out.length; i++) out[o + i] += s[i]; };
  const strum = (chord, start, dur, down = true) =>
    (down ? chord : [...chord].reverse()).forEach((fr, k) => add(pluck(rate, fr, dur, 0.22, rnd), start + k * 0.012));
  const clap = start => { const n = Math.floor(0.05 * rate), s = new Float32Array(n); let prev = 0;

class Shark extends Enemy {   // swims in the water under a gap (only its fin shows) and leaps out when the knight comes near
  constructor(tx, ty, level, mul = 1) {
    super();
    this.init("s", 56, 26, 1, 200);
    let a = Math.floor(tx / TILE), b = a;
    while (a > 0 && !level.solidAt(a - 1, 11)) a--;
    while (b < level.w - 1 && !level.solidAt(b + 1, 11)) b++;
    this.minX = a * TILE - 8; this.maxX = (b + 1) * TILE + 8;
    this.x = tx; this.y = WATER_Y; this.mul = mul; this.speed = 1.2 * mul; this.leapV = 12.5 * Math.sqrt(mul);
    this.mode = "swim"; this.modeT = randInt(40, 120); this.dir = 1;
  }
  harmful() { return this.mode === "leap"; }
  hittable() { return this.mode === "leap"; }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;

      this.x += this.dir * this.speed; this.y = WATER_Y;
      if (this.x < this.minX) { this.x = this.minX; this.dir = 1; }
      if (this.x > this.maxX - this.w) { this.x = this.maxX - this.w; this.dir = -1; }
      const dx = player.x + player.w / 2 - (this.x + this.w / 2);
      if (--this.modeT <= 0 && Math.abs(dx) < 220 && !player.dead) {
        this.mode = "leap"; this.vy = -this.leapV - Math.random() * 1.5; this.dir = dx > 0 ? 1 : -1; this.vx = this.dir * 1.4 * this.mul;
        game.sound("splash"); game.splashAt(this.x + this.w / 2);

      this.x = Math.max(this.minX, Math.min(this.x, this.maxX - this.w));
      if (this.y >= WATER_Y && this.vy > 0) {
        this.mode = "swim"; this.y = WATER_Y; this.modeT = Math.round(randInt(80, 140) / this.mul);
        game.sound("splash"); game.splashAt(this.x + this.w / 2);
      }
    }
  }
  hit(fromDir, dmg = 1) {
    this.hp -= dmg; this.flash = 8; this.vx = fromDir * 4;

    return false;
  }

}

class Boss extends Enemy {   // the Rey Canguro: big hops, shakes the ground, calls little kangaroos
  constructor(tx, ty, level, mul = 1) {
    super();
    this.init("B", 76, 100, 8, 3000);
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h;
    this.minX = level.arena[0]; this.maxX = level.arena[1]; this.mul = mul;
    this.wait = 90; this.hops = 0; this.invuln = 0; this.jumping = false;
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.invuln) this.invuln--;
    const awake = player.x > this.minX - 120;
    if (this.stun > 0) { this.stun--; this.vx *= 0.9; }
    else if (this.onGround && awake) {
      this.vx = 0;
      if (--this.wait <= 0) {
        const anger = this.maxHp - this.hp;
        this.dir = player.x + player.w / 2 > this.x + this.w / 2 ? 1 : -1;
        this.vy = -(this.hops % 3 === 2 ? 14 : 10);
        this.vx = this.dir * (2.4 + anger * 0.12) * this.mul;
        this.wait = Math.max(28, randInt(45, 75) - anger * 3);
        this.hops++; this.jumping = true;
      }
    }
    physicsMove(this, level);
    if (this.x < this.minX) { this.x = this.minX; this.vx = Math.abs(this.vx); }
    if (this.x > this.maxX - this.w) { this.x = this.maxX - this.w; this.vx = -Math.abs(this.vx); }
    if (this.onGround && this.jumping) {
      this.jumping = false; game.shake = Math.max(game.shake, 10); game.sound("stomp");
      if (this.hops % 3 === 0 && level.enemies.length < 6) {
        level.enemies.push(new Kangaroo("t", this.x + this.w / 2 - 20 + this.dir * 50, this.y + this.h - TILE, this.mul));
        game.sound("boing");
      }
    }
  }
  hit(fromDir, dmg = 1) {
    if (this.invuln > 0) return false;
    this.hp -= dmg; this.flash = 10; this.invuln = 24; this.stun = 22; this.vx = fromDir * 5;
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  draw(cam) { drawKangaroo(this, cam); }
}

// ------------------------------------------------------------------ level
class Coin {
  constructor(x, y) { this.x = x; this.y = y; this.t = Math.random() * 100; }
  rect() { return { x: Math.round(this.x - 9), y: Math.round(this.y - 9 + Math.sin(this.t * 0.08) * 3), w: 18, h: 18 }; }
}
class Level {
  constructor(def) {
    const rows = def.map, width = Math.max(...rows.map(r => r.length)), mul = def.speed;
    this.name = def.name; this.hint = def.hint || ""; this.theme = THEMES[def.theme]; this.bike = null;
    this.rows = rows.map(r => r.padEnd(width, "."));
    this.w = width; this.h = rows.length; this.pxW = this.w * TILE; this.pxH = this.h * TILE;
    this.tiles = new Map(); this.spikes = []; this.coins = []; this.enemies = [];
    this.start = [TILE * 2, TILE * 9]; this.flag = null; this.boss = null; this.arena = [0, this.pxW];
    const later = [];
    this.rows.forEach((row, cy) => [...row].forEach((ch, cx) => {
      const x = cx * TILE, y = cy * TILE;
      if (SOLID.includes(ch)) this.tiles.set(cx + "," + cy, ch);
      else if (ch === "^") this.spikes.push({ x, y });
      else if (ch === "o") this.coins.push(new Coin(x + TILE / 2, y + TILE / 2));
      else if (ch === "P") this.start = [x + (TILE - KNIGHT_W) / 2, y + TILE - KNIGHT_H];
      else if (ROO_STATS[ch]) this.enemies.push(new Kangaroo(ch, x, y, mul));
      else if (FLYER_STATS[ch]) this.enemies.push(new Flyer(ch, x, y, mul));
      else if (LUNGER_STATS[ch]) this.enemies.push(new Lunger(ch, x, y, mul));
      else if (ch === "m") this.enemies.push(new Mole(x, y, mul));
      else if (ch === "s") later.push(["s", x, y]);
      else if (ch === "M") this.bike = { x: x - 4, y: y + TILE - 34, w: 48, h: 34, taken: false };
      else if (ch === "B") later.push(["B", x, y]);
      else if (ch === "[") this.arena[0] = x;
      else if (ch === "]") this.arena[1] = x + TILE;
      else if (ch === "F") this.flag = { x: x + TILE / 2 - 3, y: y + TILE - TILE * 7, w: 6, h: TILE * 7 };
    }));
    for (const [k, x, y] of later) {   // these need the finished map
      if (k === "s") this.enemies.push(new Shark(x, y, this, mul));
      else { this.boss = new Boss(x, y, this, mul); this.enemies.push(this.boss); }
    }
  }
  flagOpen() { return this.flag && (!this.boss || !this.boss.alive); }
  tile(cx, cy) { return this.tiles.get(cx + "," + cy); }
  solidAt(cx, cy) { return this.tiles.has(cx + "," + cy); }
  tilesNear(r) {
    const out = [];
    const x0 = Math.max(Math.floor(r.x / TILE) - 1, 0), x1 = Math.min(Math.floor((r.x + r.w) / TILE) + 1, this.w - 1);
    const y0 = Math.max(Math.floor(r.y / TILE) - 1, 0), y1 = Math.min(Math.floor((r.y + r.h) / TILE) + 1, this.h - 1);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++)
      if (this.solidAt(cx, cy)) out.push({ cx, cy, x: cx * TILE, y: cy * TILE, w: TILE, h: TILE });
    return out;
  }
}

// ------------------------------------------------------------------ drawing helpers
const canvas = document.getElementById("c");

const FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';

function makeTiles(theme) {
  const rnd = seeded(7);
  const mk = draw => { const c = document.createElement("canvas"); c.width = c.height = TILE; draw(c.getContext("2d")); return c; };
  const [d0, d1, d2] = theme.dirt, [t0, t1, t2] = theme.top;
  const ln = (g, col, x1, y1, x2, y2, lw = 2) => { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
  const dirt = g => {
    g.fillStyle = d0; g.fillRect(0, 0, TILE, TILE);
    if (theme.bricks) {   // castle walls: stone bricks
      ln(g, d1, 0, 20, TILE, 20); ln(g, d1, 0, 39, TILE, 39); ln(g, d1, 20, 0, 20, 20); ln(g, d1, 6, 20, 6, 40); ln(g, d1, 32, 20, 32, 40);
      ln(g, d2, 2, 2, 17, 2); ln(g, d2, 23, 2, 38, 2); ln(g, d2, 9, 22, 29, 22);
      return;
    }
    g.fillStyle = d1; for (let i = 0; i < 10; i++) g.fillRect(Math.floor(rnd() * (TILE - 3)), Math.floor(rnd() * (TILE - 3)), 3, 3);
    g.fillStyle = d2; for (let i = 0; i < 4; i++) g.fillRect(Math.floor(rnd() * (TILE - 2)), Math.floor(rnd() * (TILE - 2)), 2, 2);
  };
  const plain = mk(dirt);
  const top = mk(g => {
    dirt(g);
    if (theme.bricks) {   // castle floor: pale slabs on top
      g.fillStyle = t1; g.fillRect(0, 0, TILE, 12); g.fillStyle = t0; g.fillRect(0, 0, TILE, 9);
      ln(g, t2, 0, 1, TILE, 1); ln(g, t1, 20, 0, 20, 9);
      return;
    }
    if (theme.flat) {   // sand or rock: a smooth top layer with grit
      g.fillStyle = t1; g.fillRect(0, 0, TILE, 12); g.fillStyle = t0; g.fillRect(0, 0, TILE, 9);
      g.fillStyle = t2; for (let i = 0; i < 8; i++) g.fillRect(Math.floor(rnd() * (TILE - 2)), Math.floor(rnd() * 8), 2, 2);
      return;
    }
    g.fillStyle = t1; g.fillRect(0, 0, TILE, 13);
    g.fillStyle = t0; g.fillRect(0, 0, TILE, 10);
    for (let x = 3; x < TILE; x += 7) {
      ln(g, t2, x, 2, x + 2, 6);
      g.fillStyle = t1; g.beginPath(); g.arc(x + 2, 13, 3, 0, Math.PI * 2); g.fill();
    }
  });
  const stone = mk(g => {
    if (theme.plat === "wood") {   // wooden planks
      g.fillStyle = WOOD; g.fillRect(0, 0, TILE, TILE);
      for (const y of [13, 26]) ln(g, WOOD_DARK, 0, y, TILE, y);
      ln(g, WOOD_DARK, 20, 0, 20, 13); ln(g, WOOD_DARK, 8, 13, 8, 26); ln(g, WOOD_DARK, 30, 26, 30, 40);
      g.fillStyle = WOOD_DARK; for (const [x, y] of [[4, 5], [36, 5], [4, 33], [36, 33]]) g.fillRect(x, y, 2, 2);
      g.strokeStyle = WOOD_DARK; g.lineWidth = 2; g.strokeRect(1, 1, TILE - 2, TILE - 2);
      return;
    }
    if (theme.plat === "rust") {   // rusty metal sheet with rivets
      g.fillStyle = rgb(150, 84, 48); g.fillRect(0, 0, TILE, TILE);
      g.fillStyle = rgb(110, 56, 30); for (let i = 0; i < 6; i++) g.fillRect(Math.floor(rnd() * 32), Math.floor(rnd() * 32), 8, 5);
      g.fillStyle = rgb(196, 120, 70); g.fillRect(0, 0, TILE, 3);
      g.fillStyle = rgb(70, 40, 24); for (const [x, y] of [[4, 6], [34, 6], [4, 34], [34, 34]]) g.fillRect(x, y, 3, 3);
      g.strokeStyle = rgb(70, 40, 24); g.lineWidth = 2; g.strokeRect(1, 1, TILE - 2, TILE - 2);
      return;
    }
    g.fillStyle = STONE; g.fillRect(0, 0, TILE, TILE);
    const half = TILE / 2;
    ln(g, STONE_DARK, 0, half, TILE, half); ln(g, STONE_DARK, half, 0, half, half); ln(g, STONE_DARK, TILE / 4, half, TILE / 4, TILE);
    ln(g, STONE_LIGHT, 3, 3, half - 4, 3); ln(g, STONE_LIGHT, half + 3, 3, TILE - 4, 3);
    g.strokeStyle = STONE_DARK; g.strokeRect(1, 1, TILE - 2, TILE - 2);
  });
  const crate = mk(g => {
    g.fillStyle = WOOD; g.fillRect(0, 0, TILE, TILE);
    for (const y of [13, 26]) ln(g, WOOD_DARK, 0, y, TILE, y);
    ln(g, WOOD_DARK, 4, 4, TILE - 5, TILE - 5, 4);
    g.lineWidth = 4; g.strokeRect(2, 2, TILE - 4, TILE - 4);
  });
  return { grass: top, dirt: plain, "=": stone, C: crate };
}

function angleAt(prog) {   // axe angle in degrees: 0 = up, positive = towards the front
  const idle = -30;
  if (prog < 0.25) return lerp(idle, -80, prog / 0.25);
  if (prog < 0.6) return lerp(-80, 150, easeOut((prog - 0.25) / 0.35));
  return lerp(150, idle, (prog - 0.6) / 0.4);
}
function axeAngle(p) {
  if (p.attackTimer === 0) return -30 + (p.onGround && Math.abs(p.vx) > 0.5 ? Math.sin(p.anim * 1.4) * 4 : 0);
  return angleAt(p.attackFrame() / p.atkTotal);
}

function drawAxe(hand, d, k = 1, gold = false) {
  const n = [-d[1], d[0]], len = AXE_LEN * k, head = AXE_HEAD * k;
  const pt = (c, a, b) => [c[0] + d[0] * a + n[0] * b, c[1] + d[1] * a + n[1] * b];
  const [hx, hy] = hand;
  L(HANDLE_DARK, hx - d[0] * 13, hy - d[1] * 13, hx + d[0] * (len + 1), hy + d[1] * (len + 1), 7);
  L(HANDLE, hx - d[0] * 12, hy - d[1] * 12, hx + d[0] * len, hy + d[1] * len, 4);
  for (const kk of [18, 24, 30]) { const a = pt(hand, kk, -3), b = pt(hand, kk, 3); L(HANDLE_DARK, a[0], a[1], b[0], b[1], 2); }
  const c = [hx + d[0] * head, hy + d[1] * head];
  if (gold) { ctx.globalAlpha = 0.35 + 0.15 * Math.sin(Date.now() / 120); C(GOLD, c[0], c[1], 30); ctx.globalAlpha = 1; }
  const blade = [[6, 3], [17, 21], [6, 26], [-6, 26], [-17, 21], [-6, 3]];
  for (const s of [1, -1]) {   // two blades -> double axe
    const pts = blade.map(([a, b]) => pt(c, a, b * s));
    P(gold ? GOLD_BLADE : BLADE, pts); PS(gold ? GOLD_BLADE_DARK : BLADE_DARK, pts, 2);
    const e1 = pt(c, 12, 21 * s), e2 = pt(c, -12, 21 * s); L(WHITE, e1[0], e1[1], e2[0], e2[1], 2);
  }
  P(BLADE_DARK, [pt(c, 5, -4), pt(c, 15, 0), pt(c, 5, 4)]);
  C(gold ? GOLD_DARK : BLADE_DARK, c[0], c[1], 5);
}
function drawMiniAxe(x, y, angle, gold) {   // the spinning flying axe
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(0.62, 0.62);
  drawAxe([0, 26], [0, -1], 0.55, gold);
  ctx.restore();
}

function drawKnight(p, cam, upg, t) {
  const moving = p.onGround && Math.abs(p.vx) > 0.5, step = moving ? Math.sin(p.anim * 1.4) * 4 : 0;
  flipAt(Math.round(p.x) - cam, Math.round(p.y), p.w, p.facing);
  if (p.bike) ctx.translate(7, 0);   // the knight sits in the middle of the wider bike
  const sh = [24, 19], k = p.reach, rad = axeAngle(p) * Math.PI / 180, d = [Math.sin(rad), -Math.cos(rad)];
  // when swinging the arm follows the axe; otherwise he holds it upright in front, fist at his belt
  const hand = p.attackTimer ? [sh[0] + d[0] * ARM_LEN, sh[1] + d[1] * ARM_LEN] : [30, 31 + step * 0.3];
  const flap = Math.sin(t * 0.15) * 3 + (moving ? 6 : 0) + (p.onGround ? 0 : 5);

  // flowing cape behind everything
  P(CAPE_DARK, [[5, 15], [19, 15], [12, 50], [-4 - flap, 56], [-14 - flap, 47]]);
  P(CAPE, [[7, 16], [17, 16], [9, 46], [-3 - flap, 51], [-10 - flap, 43]]);

  if (p.swingActive()) {   // swing trail
    const prog = p.attackFrame() / p.atkTotal, reach = ARM_LEN + AXE_HEAD * k;
    for (let i = 1; i < 7; i++) {

      ctx.globalAlpha = Math.max(0, 160 - i * 24) / 255;
      C(upg.sharp ? GOLD : WHITE, sh[0] + Math.sin(a) * reach, sh[1] - Math.cos(a) * reach, 16 - i * 2);
    }

  }

  E(SKIN_DARK, -10, 15, 14, 16); E(SKIN, -9, 16, 12, 14); C(SKIN_LIGHT, -5, 20, 2);
  R(ARMOR_DARK, -8 + sw, 29, 10, 9, 3); C(STEEL_DARK, -3 + sw, 41, 5);

  if (p.bike) {   // the motorbike, then the knight's legs bent onto the footpegs
    ctx.save(); ctx.translate(-7, 0); drawBike(p.x / 11, Math.abs(p.vx) > 6); ctx.restore();
    L(STEEL_DARK, 12, 36, 24, 38, 9); C(ARMOR, 24, 38, 5); L(STEEL_DARK, 24, 38, 26, 47, 8); R(BOOT, 21, 45, 13, 5, 2);
  } else {        // long legs: thigh, knee guard, shin, boot
    const legs = p.onGround ? [[7 + step, 35], [16 - step, 35]] : [[4, 32], [18, 35]];
    for (const [lx, ly] of legs) {
      R(STEEL_DARK, lx, ly, 9, 17, 3); R(ARMOR, lx - 1, ly + 7, 11, 5, 2); R(BOOT, lx - 1, ly + 16, 13, 5, 2);
    }

// ------------------------------------------------------------------ game
const inp = { left: false, right: false, jumpHeld: false, jumpPressed: false, attack: false };
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;

class Game {
  constructor() {
    this.t = 0; this.state = "title"; this.stateTimer = 0; this.paused = false;
    this.lives = START_LIVES; this.score = 0; this.coins = 0; this.levelIndex = 0; this.upg = {};
    this.shopSel = 0; this.shopMsg = ""; this.shopMsgT = 0; this.shopMsgCol = WHITE;
    this.tileSets = {};
    const rnd = seeded(3);
    this.clouds = Array.from({ length: 7 }, () => [rnd() * (W + 300), 40 + rnd() * 130, 0.7 + rnd() * 0.6]);
    this.resetLevel();
  }
  sound(name) { play(name); }
  tiles() {
    const key = LEVELS[this.levelIndex].theme;
    if (!this.tileSets[key]) this.tileSets[key] = makeTiles(THEMES[key]);
    return this.tileSets[key];
  }
  newGame(levelIndex = 0) {   // from the title: fresh start; after game over: carry on in the same level
    this.paused = false; this.levelIndex = levelIndex;
    if (levelIndex === 0) { this.upg = {}; this.coins = 0; }
    this.lives = START_LIVES; this.score = 0;
    this.resetLevel(); this.state = "play"; say("vamos", true);
  }
  openShop() { this.state = "shop"; this.shopSel = 0; this.shopMsgT = 0; say("tienda", true); }
  nextLevel() { this.levelIndex++; this.resetLevel(); this.state = "play"; say("vamos", true); }
  buy(i) {
    const item = SHOP[i];
    if (this.upg[item.id]) { this.shopMessage("¡Ya lo tienes!", WHITE); return; }
    if (this.coins < item.price) {
      this.shopMessage(`¡No tienes bastante oro! Te faltan ${item.price - this.coins} monedas.`, rgb(255, 140, 120));
      play("nope"); say("nooro", true); return;
    }
    this.coins -= item.price; this.upg[item.id] = true;
    this.shopMessage(`¡${item.name} comprado!`, GRASS_LIGHT);
    const c = shopLayout().cards[i];
    this.burst(c.x + c.w / 2, c.y + 56, [GOLD, WHITE, rgb(255, 150, 60)], 26, 6);
    play("anvil"); say("gracias", true);
  }
  shopMessage(msg, col) { this.shopMsg = msg; this.shopMsgCol = col; this.shopMsgT = 150; }
  shopTap(x, y) {
    const lay = shopLayout();
    const i = lay.cards.findIndex(c => inside(x, y, c));
    if (i >= 0) { this.shopSel = i; this.buy(i); }
    else if (inside(x, y, lay.button)) this.nextLevel();
  }
  resetLevel() {
    this.level = new Level(LEVELS[this.levelIndex]);
    this.player = new Player(...this.level.start, this.upg);
    this.particles = []; this.popups = []; this.camX = 0; this.shake = 0; this.levelTimer = 0;
    this.bossAnnounced = false; this.flyingAxe = null;
  }
  loseLife() {
    this.lives--; this.state = "dying"; this.stateTimer = 110; this.flyingAxe = null;
    const p = this.player; p.dead = true; p.vy = -11; p.attackTimer = 0; p.invuln = 0;
    play("die"); if (this.lives > 0) say("desastre", true);
  }
  burst(x, y, colors, n, speed = 4) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * (speed - 1), life = randInt(20, 40);
      this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, color: pick(colors), life, maxLife: life, size: randInt(3, 6) });
    }
  }
  popup(x, y, text, color = GOLD) { this.popups.push({ x, y, text, color, life: 55 }); }
  dust(x, y) { this.burst(x, y, [rgb(196, 176, 140), rgb(160, 140, 110)], 3, 2); }
  splashAt(x) { this.burst(x, WATER_Y, [WHITE, rgb(160, 210, 250), rgb(90, 170, 230)], 14, 5); }

  step() {
    this.t++;
    if (this.state === "play") this.updatePlay();
    else if (this.state === "dying") {
      const p = this.player; p.vy = Math.min(p.vy + GRAVITY * 0.8, MAX_FALL); p.y += p.vy;
      if (--this.stateTimer <= 0) {
        if (this.lives > 0) { this.resetLevel(); this.state = "play"; }
        else { this.state = "gameover"; play("gameover"); say("fin", true); }
      }
    } else if (this.state === "win" || this.state === "levelclear") {
      this.stateTimer++;
      if (this.stateTimer % (this.state === "win" ? 18 : 30) === 0)
        this.burst(this.camX + 100 + Math.random() * (W - 200), 60 + Math.random() * 160,
          pick([[GOLD, WHITE], [HEART, WHITE], [ARMOR_LIGHT, WHITE], [GRASS_LIGHT, WHITE]]), 30, 6);
    } else if (this.state === "shop") {
      if (this.shopMsgT > 0) this.shopMsgT--;
    }
    for (const c of this.level.coins) c.t++;
    for (const q of this.particles) { q.vy += 0.25; q.x += q.vx; q.y += q.vy; q.life--; }
    this.particles = this.particles.filter(q => q.life > 0);
    for (const q of this.popups) { q.y -= 0.8; q.life--; }
    this.popups = this.popups.filter(q => q.life > 0);
    if (this.shake > 0) this.shake--;
    inp.jumpPressed = inp.attack = false;
  }

  strike(e, fromDir, hitIds) {   // an axe (held or flying) hits an enemy
    if (!e.alive || hitIds.has(e.id) || !e.hittable()) return;
    hitIds.add(e.id);
    const er = e.rect(), ex = er.x + er.w / 2, ey = er.y + er.h / 2;
    this.burst(ex, ey, this.upg.sharp ? [GOLD, WHITE] : [WHITE, rgb(255, 230, 120)], 8);
    this.shake = Math.max(this.shake, 5); play("hit");
    if (e.hit(fromDir, this.upg.sharp ? 2 : 1)) this.defeated(e, ex, ey, er);
  }
  breakCrates(box) {
    const lvl = this.level;
    for (const t of lvl.tilesNear(box)) {
      if (lvl.tile(t.cx, t.cy) !== "C" || !collide(box, t)) continue;
      lvl.tiles.delete(t.cx + "," + t.cy);
      this.burst(t.x + 20, t.y + 20, [WOOD, WOOD_DARK], 14);
      lvl.coins.push(new Coin(t.x + 20, t.y + 20));
      this.score += 10; this.shake = Math.max(this.shake, 3);
      this.popup(t.x + 20, t.y, "¡Crac!", WHITE); play("crate");
    }
  }

  updatePlay() {
    const p = this.player, lvl = this.level;
    this.levelTimer++;
    p.update(inp, lvl);
    if (p.justJumped) play("jump");
    if (p.justSwung) {
      play("swing");
      if (this.upg.boomerang && !this.flyingAxe)
        this.flyingAxe = new FlyingAxe(p.x + p.w / 2 + p.facing * 30, p.y + 14, p.facing);
    }
    const box = p.attackBox();   // the held axe hits enemies and crates
    if (box) { for (const e of lvl.enemies) if (collide(box, e.rect())) this.strike(e, p.facing, p.hitIds); this.breakCrates(box); }
    const fa = this.flyingAxe;   // the flying axe too
    if (fa) {
      fa.update(p);
      const r = fa.rect(), dir = fa.t < 30 ? Math.sign(fa.vx) : (p.x > fa.x ? 1 : -1);
      for (const e of lvl.enemies) if (collide(r, e.rect())) this.strike(e, dir, fa.hitIds);
      this.breakCrates(r);
      if (!fa.alive) this.flyingAxe = null;
    }
    for (const e of lvl.enemies) e.update(lvl, p, this);
    lvl.enemies = lvl.enemies.filter(e => e.alive);

    const bk = lvl.bike;   // hop on the motorbike!
    if (bk && !bk.taken && !p.bike && collide(p.rect(), bk)) {
      bk.taken = true; p.mountBike(); play("vroom"); say("moto", true);
      this.popup(p.x + p.w / 2, p.y - 20, "¡Una moto!", GOLD); this.burst(p.x + p.w / 2, p.y + p.h, [rgb(196, 176, 140), WHITE], 16, 4);
    }
    if (p.bike) {
      if (p.onGround && Math.abs(p.vx) > 4 && this.t % 3 === 0) this.dust(p.x + (p.vx > 0 ? 0 : p.w), p.y + p.h);
      if (this.t % 24 === 0) p.rideHits.clear();
    }

    if (lvl.boss && lvl.boss.alive && !this.bossAnnounced && p.x > lvl.arena[0] - 200) {
      this.bossAnnounced = true; say("jefe", true); this.popup(p.x + p.w / 2, p.y - 30, "¡El Rey Canguro!", HEART);
    }

    const pr = inflate(p.rect(), -6, -4);   // touching an enemy or spikes hurts, even from above
    const ouch = srcX => {
      if (!p.hurt(srcX)) return false;
      this.shake = 8; this.burst(pr.x + pr.w / 2, pr.y + pr.h / 2, [HEART, WHITE], 10);
      this.popup(pr.x + pr.w / 2, pr.y - 10, "¡Jolín!", HEART);
      play("hurt"); say("jolin", true);
      return true;
    };
    for (const e of lvl.enemies) {
      if (!e.harmful() || !collide(pr, e.rect())) continue;
      const dx = e.x + e.w / 2 - (p.x + p.w / 2);
      if (p.bike && Math.abs(p.vx) > 5 && Math.sign(dx) === Math.sign(p.vx) && !FLYER_STATS[e.kind] && e.kind !== "B") {
        this.strike(e, Math.sign(p.vx), p.rideHits); continue;   // rammed by the motorbike!
      }
      ouch(e.x + e.w / 2);
    }
    for (const s of lvl.spikes) if (collide(pr, { x: s.x + 4, y: s.y + 20, w: TILE - 8, h: 20 }) && ouch(s.x + TILE / 2)) p.vy = -10;
    if (lvl.theme.water && p.y + p.h > WATER_Y + 20) {   // fell in the sea
      this.splashAt(p.x + p.w / 2); play("splash"); this.popup(p.x + p.w / 2, WATER_Y - 40, "¡Glu, glu!", WHITE);
      say("glu", true); this.loseLife(); return;
    }

    for (const c of [...lvl.coins]) {
      if (!collide(pr, c.rect())) continue;
      lvl.coins.splice(lvl.coins.indexOf(c), 1);
      this.coins++; this.score += 50; this.burst(c.x, c.y, [GOLD, WHITE], 6, 3); play("coin");
      if (this.coins % 5 === 0) say("oro");
    }
    if (lvl.flagOpen() && collide(p.rect(), inflate(lvl.flag, 20, 0))) {
      const bonus = 1000 + 250 * p.hearts;
      this.score += bonus; this.popup(p.x + p.w / 2, p.y - 10, `¡Olé! +${bonus}`);
      this.stateTimer = 0; this.flyingAxe = null;
      if (this.levelIndex < LEVELS.length - 1) { this.state = "levelclear"; play("clear"); say("nivel", true); }
      else { this.state = "win"; play("win"); say("ole", true); }
      return;
    }
    if (p.hearts <= 0 || p.y > lvl.pxH + 60) { this.loseLife(); return; }
    const target = p.x + p.w / 2 - W * 0.42 + (p.bike ? p.vx * 18 : 0);   // look further ahead at bike speed
    this.camX += (target - this.camX) * 0.12;
    this.camX = Math.max(0, Math.min(this.camX, lvl.pxW - W));
  }

  defeated(e, ex, ey, er) {
    this.score += e.score;
    this.burst(ex, ey, e.colors(), e.kind === "B" ? 60 : 20, e.kind === "B" ? 9 : 5);
    if (e.kind === "B") {
      this.popup(ex, er.y - 20, `¡Victoria! +${e.score}`); this.shake = 24;
      play("boing_big"); say("victoria", true);
      const f = this.level.flag; if (f) this.burst(f.x, f.y + 40, [GOLD, WHITE, ARMOR_LIGHT], 40, 6);
      return;
    }
    const WORDS = {   // what pops up, which sound, which voice line
      T: ["¡K.O.!", "boing_big", "rey"], c: ["¡Hasta luego, cocodrilo!", "snap", "coco"], m: ["¡Toma, topo!", "pop", "topo"],
      s: ["¡Adiós, tiburón!", "splash", "tiburon"], n: ["¡Adiós, serpiente!", "hiss", "serpiente"], k: [null, "click", "toma"],
      w: [null, "squeak", "toma"], b: [null, "squeak", "toma"], g: [null, "screech", "toma"], v: [null, "screech", "toma"],
    };
    const [word, snd, line] = WORDS[e.kind] || [null, "boing", pick(["toma", "adios"])];
    this.popup(ex, er.y - 10, `${word || pick(["¡Toma!", "¡Zas!", "¡Adiós!"])} +${e.score}`);
    play(snd); say(line, word !== null);
  }

  draw() {
    if (this.state === "shop") {
      if (this.shake) ctx.translate(randInt(-this.shake, this.shake), randInt(-this.shake, this.shake));
      drawShop(this);
      for (const q of this.particles) R(q.color, q.x - 2, q.y - 2, 4, 4);
      return;
    }
    const cam = Math.floor(this.camX), lvl = this.level, theme = lvl.theme, tiles = this.tiles();
    if (this.shake) ctx.translate(randInt(-this.shake, this.shake), randInt(-this.shake, this.shake));
    drawBackground(theme, cam);
    if (theme.water) drawWater(this.t);
    for (let cx = Math.floor(cam / TILE); cx <= Math.floor((cam + W) / TILE) + 1; cx++) for (let cy = 0; cy < lvl.h; cy++) {
      const ch = lvl.tile(cx, cy); if (!ch) continue;
      const img = ch === "#" ? tiles[lvl.solidAt(cx, cy - 1) ? "dirt" : "grass"] : tiles[ch];
      ctx.drawImage(img, cx * TILE - cam, cy * TILE);
    }
    for (const s of lvl.spikes) if (s.x > cam - TILE && s.x < cam + W) drawSpike(s, cam, theme);
    const bk = lvl.bike;
    if (bk && !bk.taken) {   // the parked motorbike, waiting for the knight
      ctx.save(); ctx.translate(bk.x + 2 - cam, bk.y + bk.h - 56); drawBike(0, false); ctx.restore();
      if (Math.floor(this.t / 20) % 2 === 0) T("¡Súbete!", 18, bk.x + bk.w / 2 - cam, bk.y - 40, GOLD);
    }
    const fl = lvl.flag;
    if (fl && lvl.flagOpen()) {
      const x = fl.x + 3 - cam, wave = Math.sin(this.t * 0.1) * 4;
      L(STONE_DARK, x, fl.y, x, fl.y + fl.h, 5); C(GOLD, x, fl.y, 7);
      const banner = [[x + 2, fl.y + 8], [x + 46, fl.y + 22 + wave], [x + 2, fl.y + 36]];
      P(ARMOR, banner); PS(ARMOR_DARK, banner, 2);
    }
    for (const c of lvl.coins) drawCoin(c, cam);
    for (const e of lvl.enemies) if (e.x + e.w > cam - 60 && e.x < cam + W + 60) e.draw(cam);
    const p = this.player;
    if (!(p.invuln > 0 && Math.floor(p.invuln / 4) % 2 === 0)) drawKnight(p, cam, this.upg, this.t);
    if (this.flyingAxe) drawMiniAxe(this.flyingAxe.x - cam, this.flyingAxe.y, this.flyingAxe.t * 0.45, this.upg.sharp);
    for (const q of this.particles) {
      const s = Math.max(1, Math.floor(q.size * q.life / q.maxLife + 1));
      R(q.color, Math.floor(q.x - cam - s / 2), Math.floor(q.y - s / 2), s, s);
    }
    if (theme.dark) {   // the mine is dark: only the knight's surroundings and the lanterns are lit
      const lx = p.x + p.w / 2 - cam, ly = p.y + p.h / 2;
      const g = ctx.createRadialGradient(lx, ly, 70, lx, ly, 430);
      g.addColorStop(0, "rgba(8,5,3,0)"); g.addColorStop(1, "rgba(8,5,3,0.86)");
      ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
      for (const [x, y] of this.mineLights || []) {   // soft lantern glow
        const lg = ctx.createRadialGradient(x, y, 2, x, y, 70);
        lg.addColorStop(0, "rgba(255,200,110,0.55)"); lg.addColorStop(1, "rgba(255,200,110,0)");
        ctx.fillStyle = lg; ctx.fillRect(x - 70, y - 70, 140, 140); C(rgb(255, 224, 150), x, y, 5);
      }
    }
    for (const q of this.popups) T(q.text, 20, q.x - cam, q.y, q.color);

    if (this.state !== "title") {
      for (let i = 0; i < p.maxHearts; i++) drawHeart(16 + i * 24, 14, i < p.hearts);
      T(`VIDAS ${this.lives}`, 20, 16, 38, WHITE, "left", "top");
      T(`NIVEL ${this.levelIndex + 1}`, 20, 16, 62, WHITE, "left", "top");
      SHOP.filter(it => this.upg[it.id]).forEach((it, i) => emoji(it.icon, 18, 26 + i * 24, 98));
      T(`MONEDAS ${this.coins}`, 20, W / 2, 14, WHITE, "center", "top");
      T(`PUNTOS ${String(this.score).padStart(6, "0")}`, 20, W - 120, 14, WHITE, "right", "top");
      const b = lvl.boss;
      if (b && b.alive && this.bossAnnounced) {   // boss health bar
        T("REY CANGURO", 18, W / 2, 46, GOLD, "center", "top");
        R(BLACK, W / 2 - 152, 70, 304, 16, 4); R(HEART_EMPTY, W / 2 - 150, 72, 300, 12, 3);
        R(HEART, W / 2 - 150, 72, 300 * b.hp / b.maxHp, 12, 3);
      }
    }
    if (this.state === "play" && this.levelTimer < 150) {   // level title card
      ctx.globalAlpha = Math.min(1, (150 - this.levelTimer) / 40);
      T(`NIVEL ${this.levelIndex + 1}`, 52, W / 2, 170, GOLD);
      T(lvl.name, 34, W / 2, 222, WHITE);
      if (lvl.hint) T(lvl.hint, 22, W / 2, 262, GOLD);
      ctx.globalAlpha = 1;
    }
    const blink = Math.floor(this.t / 30) % 2 === 0;
    const shade = () => { ctx.fillStyle = "rgba(10,15,40,0.55)"; ctx.fillRect(-20, -20, W + 40, H + 40); };
    const tap = (touchMsg, keyMsg, y) => { if (blink) T(isTouch ? touchMsg : keyMsg, 30, W / 2, y, GOLD); };
    if (this.state === "title") {
      shade();
      T("EL CABALLERO DEL HACHA", 58, W / 2, 104, ARMOR_LIGHT);
      T("¡Abre camino a hachazos por seis niveles!", 28, W / 2, 168, WHITE);
      if (isTouch) {
        T("◀ ▶ mover      SALTA saltar      🪓 hachazo", 22, W / 2, 232, WHITE);
      } else {
        T("Mover: Flechas / A D      Saltar: Espacio / W", 22, W / 2, 226, WHITE);
        T("Hachazo: X / J      Pausa: P      Sonido: M", 22, W / 2, 258, WHITE);
      }
      T("¡Ojo! Saltar sobre los enemigos duele.", 22, W / 2, 292, WHITE);
      T("Gasta tus monedas en la tienda del herrero.", 22, W / 2, 324, WHITE);
      tap("Toca la pantalla para empezar", "Pulsa ENTER para empezar", 396);
    } else if (this.state === "dying" && this.lives > 0) {
      T("¡Jolín!", 72, W / 2, H / 2 - 40, HEART);
    } else if (this.state === "gameover") {
      shade();
      T("FIN DEL JUEGO", 72, W / 2, 160, HEART);
      T(`Puntos: ${this.score}`, 30, W / 2, 236, WHITE);
      tap(`Toca para seguir en el nivel ${this.levelIndex + 1}`, `Pulsa ENTER para seguir en el nivel ${this.levelIndex + 1}`, 330);
    } else if (this.state === "levelclear" && this.stateTimer > 30) {
      shade();
      T("¡NIVEL SUPERADO!", 70, W / 2, 140, GOLD);
      T(`Puntos: ${this.score}      Monedas: ${this.coins}`, 30, W / 2, 220, WHITE);
      T(`Siguiente: ${LEVELS[this.levelIndex + 1].name}`, 30, W / 2, 268, WHITE);
      if (this.stateTimer > 60) tap("Toca para ir a la tienda", "Pulsa ENTER para ir a la tienda", 350);
    } else if (this.state === "win" && this.stateTimer > 40) {
      shade();
      T("¡OLÉ!", 80, W / 2, 130, GOLD);
      T("¡Has vencido al Rey Canguro, caballero!", 30, W / 2, 200, WHITE);
      T(`Puntos: ${this.score}      Monedas: ${this.coins}`, 30, W / 2, 250, WHITE);
      tap("Toca para jugar otra vez", "Pulsa ENTER para jugar otra vez", 340);
    }
    if (this.paused) {
      shade();
      T("PAUSA", 80, W / 2, 200, GOLD);
      T(isTouch ? "Toca la pantalla para seguir" : "Pulsa P para seguir", 30, W / 2, 290, WHITE);
    }
  }
}

// ------------------------------------------------------------------ screen, input, loop
const game = new Game();
window.__game = game;
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * scale * dpr);
  canvas.height = Math.floor(H * scale * dpr);
}
window.addEventListener("resize", resize);
resize();
if (isTouch) document.body.classList.add("is-touch");

let fsTried = false;
function unlock() {   // first touch: allow sound, go fullscreen where the phone supports it
  initAudio();
  if (isTouch && !fsTried) {
    fsTried = true;
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  }
}
function tapStart() {
  if (game.paused) { setPaused(false); return true; }
  const s = game.state;
  if (s === "title" || (s === "win" && game.stateTimer > 40)) { game.newGame(0); return true; }
  if (s === "gameover") { game.newGame(game.levelIndex); return true; }
  if (s === "levelclear") { if (game.stateTimer > 60) game.openShop(); return true; }
  return s === "win" || s === "shop";
}
const keys = { left: false, right: false, jump: false };
const touch = { left: false, right: false, jump: false };
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "jump", ArrowUp: "jump", KeyW: "jump" };
window.addEventListener("keydown", e => {
  unlock();
  if (game.state === "shop") {   // keyboard shopping
    const n = SHOP.length;
    if (e.code === "ArrowLeft" || e.code === "KeyA") game.shopSel = (game.shopSel + n) % (n + 1);
    else if (e.code === "ArrowRight" || e.code === "KeyD") game.shopSel = (game.shopSel + 1) % (n + 1);
    else if (["Enter", "NumpadEnter", "Space", "KeyX", "KeyJ"].includes(e.code) && !e.repeat) {
      if (game.shopSel < n) game.buy(game.shopSel); else game.nextLevel();
    }
    if (e.code === "KeyM") toggleSound();
    e.preventDefault();
    return;
  }
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (k === "jump" && !e.repeat) inp.jumpPressed = true; keys[k] = true; }
  if (["KeyX", "KeyJ", "ControlLeft"].includes(e.code) && !e.repeat) inp.attack = true;
  if (e.code === "KeyM") toggleSound();
  if (e.code === "KeyP" || e.code === "Escape") setPaused(!game.paused);
  if (e.code === "Enter" || e.code === "NumpadEnter") tapStart();
});
window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener("blur", () => { keys.left = keys.right = keys.jump = false; });
window.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  e.preventDefault(); unlock();
  if (game.state === "shop") {
    const r = canvas.getBoundingClientRect();
    game.shopTap((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  } else tapStart();
});

const dpad = document.getElementById("dpad");
let dpadId = null;
function dpadSet(e) {
  const r = dpad.getBoundingClientRect(), left = e.clientX < r.left + r.width / 2;
  touch.left = left; touch.right = !left; dpad.dataset.dir = left ? "l" : "r";
}
dpad.addEventListener("pointerdown", e => {
  e.preventDefault(); unlock(); dpadId = e.pointerId;
  try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
  dpadSet(e);
});
dpad.addEventListener("pointermove", e => { if (e.pointerId === dpadId) dpadSet(e); });
const dpadEnd = e => { if (e.pointerId === dpadId) { dpadId = null; touch.left = touch.right = false; dpad.dataset.dir = ""; } };
dpad.addEventListener("pointerup", dpadEnd);
dpad.addEventListener("pointercancel", dpadEnd);

function holdButton(el, down, up) {
  el.addEventListener("pointerdown", e => {
    e.preventDefault(); unlock();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add("on"); down();
  });
  const end = () => { el.classList.remove("on"); if (up) up(); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
holdButton(document.getElementById("bJump"), () => { if (!tapStart()) { inp.jumpPressed = true; touch.jump = true; } }, () => { touch.jump = false; });
holdButton(document.getElementById("bAxe"), () => { if (!tapStart()) inp.attack = true; });

const bSound = document.getElementById("bSound");
function toggleSound() {
  soundOn = !soundOn;
  bSound.textContent = soundOn ? "🔊" : "🔇";
  if (!soundOn && hasSpeech) speechSynthesis.cancel();
  if (master) master.gain.value = soundOn ? 0.8 : 0;
}
bSound.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); unlock(); toggleSound(); });

const bPause = document.getElementById("bPause");
function setPaused(on) {
  if (on && game.state !== "play") return;   // only pause during play
  game.paused = on;
  bPause.innerHTML = on ? "&#9654;" : "&#10074;&#10074;";
  if (on && hasSpeech) speechSynthesis.cancel();
  if (actx) { if (on) actx.suspend(); else actx.resume(); }
}
bPause.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); unlock(); setPaused(!game.paused); });
document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  if (game.paused) acc = 0;
  while (acc >= STEP_MS) {
    inp.left = keys.left || touch.left;
    inp.right = keys.right || touch.right;
    inp.jumpHeld = keys.jump || touch.jump;
    game.step();
    acc -= STEP_MS;
  }
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  game.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
