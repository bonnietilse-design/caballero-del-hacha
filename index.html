  this.cuFor = 2; this.cuNext = next; this.cuSaved = { ...LOOK }; lookSwapped = true; Object.assign(LOOK, LOOK2); applyLook();
  this.state = "custom"; this.cuSel = 0; this.cuT = 0; this.cuP = null; this.particles = []; play("click");
};
Game.prototype.cuDone2 = function () {
  Object.assign(LOOK2, LOOK); try { localStorage.setItem("caballero_look2", JSON.stringify(LOOK2)); } catch (_) {}
  Object.assign(LOOK, this.cuSaved); this.cuFor = 0; applyLook(); lookSwapped = false; play("anvil");
  if (this.cuNext === "begin") this.beginGame(true); else this.openMap(this.mapSel);
};
Game.prototype.cuP2Input = function () {   // player 2 on the other device: ◀ ▶ change, SALTA next row, 🪓 done
  const n = LOOK_ROWS.length, l = inp2.left, r = inp2.right;
  if (this.cuSel < n) { if ((l && !this.cuL2) || inp2.leftTap) this.cuChange(this.cuSel, -1); else if ((r && !this.cuR2) || inp2.rightTap) this.cuChange(this.cuSel, 1); }
  this.cuL2 = l; this.cuR2 = r;
  if (inp2.jumpPressed) { this.cuSel = (this.cuSel + 1) % (n + 1); play("click"); }
  if (inp2.attack) this.cuDone2();
};
Game.prototype.copilotMerge = function () {   // in a one-vehicle level, player 2's buttons work the action (or, in pinball and the concert, everything)
  if (inp2.attack) { inp.attack = true; this.copilotFlash = 12; }
  if (P2_MERGE_ALL.has(LEVELS[this.levelIndex].mode)) { inp.left = inp.left || inp2.left; inp.right = inp.right || inp2.right; inp.jumpHeld = inp.jumpHeld || inp2.jumpHeld; if (inp2.jumpPressed) inp.jumpPressed = true; }
};

Game.prototype.coDie = function (q) {   // player-2's knight fell: they lose a life and come back next to the other knight, who keeps going
  if (this.state !== "play") return;
  if (this.lives <= 1) { this.loseLife(); return; }
  this.lives--; this.deaths++; play("die");
  this.p2Down(this.swapped ? "¡El jugador 1 vuelve enseguida!" : "¡El jugador 2 vuelve enseguida!");
};
Game.prototype.coSwap = function () {   // player 1 fell but player 2 is fine: the knights swap places in the game's bookkeeping, so player 2 carries on as the main knight
  const a = this.player; this.player = this.p2; this.p2 = a;
  const l1 = { ...LOOK }; Object.assign(LOOK, LOOK2); Object.assign(LOOK2, l1); this.swapped = !this.swapped; lookSwapped = this.swapped; applyLook();
};
Game.prototype.unswap = function () { if (!this.swapped) return; const l1 = { ...LOOK }; Object.assign(LOOK, LOOK2); Object.assign(LOOK2, l1); this.swapped = false; lookSwapped = false; applyLook(); };

// ---- split screen: in the vehicle levels each player gets their own copy of the level, their own vehicle and their own half of the screen
const SPLIT = { g2: null, on: false, li: -1, A: null, B: null };
const SPLIT_COLS = new Set(["pinball", "concert", "derby", "rocket", "climb", "ski"]);   // tall or top-down levels: side by side; the rest one above the other
const SPLIT_IN = new Set(["play", "dying", "pole", "door"]);
function splitKindOf(g) {
  if (!g.twoP) return null;
  const md = LEVELS[g.levelIndex] && LEVELS[g.levelIndex].mode;
  if (!md || P2_FULL.has(md) || P2_NATIVE.has(md)) return null;
  return SPLIT_COLS.has(md) ? "cols" : "rows";
}
function asP2(fn) {   // run something as player 2: their game, their buttons, their colours, no doubled voices
  const g1 = game, saveInp = { ...inp }, saveAxe = axeHeld, saveLook = { ...LOOK };
  game = SPLIT.g2; SAY_MUTE = true;
  inp.left = inp2.left; inp.right = inp2.right; inp.jumpHeld = inp2.jumpHeld; inp.jumpPressed = inp2.jumpPressed; inp.attack = inp2.attack; axeHeld = !!(keys2.attack || net2.ah);
  lookSwapped = true; Object.assign(LOOK, LOOK2); applyLook();
  try { return fn(); }
  finally { game = g1; SAY_MUTE = false; Object.assign(inp, saveInp); axeHeld = saveAxe; Object.assign(LOOK, saveLook); applyLook(); lookSwapped = false; }
}
function splitStep() {
  const g1 = game, kind = SPLIT_IN.has(g1.state) ? splitKindOf(g1) : null;
  if (!kind) { SPLIT.on = false; return; }
  if (!SPLIT.on || SPLIT.li !== g1.levelIndex) {   // player 2's own copy of this level
    if (!SPLIT.g2) { SPLIT.g2 = new Game(); }
    const g2 = SPLIT.g2;
    asP2(() => { g2.twoP = false; g2.upg = {}; g2.owned = {}; g2.done = g1.done; g2.secrets = g1.secrets; g2.levelIndex = g1.levelIndex; g2.lives = 99; g2.coins = 0; g2.score = 0; g2.p2 = null; g2.copilot = false; g2.resetLevel(); g2.state = "play"; g2.stateTimer = 0; g2.levelTimer = g1.levelTimer; });
    SPLIT.on = true; SPLIT.li = g1.levelIndex; SPLIT.d1 = g1.deaths; SPLIT.d2 = g2.deaths;
  }
  const g2 = SPLIT.g2;
  asP2(() => g2.step());
  if (g2.deaths !== SPLIT.d2) { SPLIT.d2 = g2.deaths; g2.lives = 99; if (g1.lives <= 1 && g1.state === "play") g1.loseLife(); else g1.lives = Math.max(0, g1.lives - 1); }   // player 2 fell: a shared life, and only their half starts again
  inp2.jumpPressed = inp2.attack = false;
  if (g2.coins) { g1.coins += g2.coins; g2.coins = 0; }
  if (g2.score !== g2.lastScore) { if (g2.lastScore !== undefined && g2.score > g2.lastScore) g1.score += g2.score - g2.lastScore; g2.lastScore = g2.score; }
  if (g2.lives < 50) g2.lives = 99;
  if (g2.state === "gameover") asP2(() => { g2.lives = 99; g2.resetLevel(); g2.state = "play"; });
  if (g2.state === "levelclear" || g2.state === "finale") {   // player 2 finished first: the level is done for both
    SPLIT.on = false; g2.state = "map";
    if (g1.state === "play") { g1.popup(g1.player.x + g1.player.w / 2, g1.player.y - 30, "¡El jugador 2 lo consiguió!", rgb(140, 230, 160)); g1.finishLevel(); }
  }
}
function splitOff() { const c = document.createElement("canvas"); return { c, x: c.getContext("2d"), s: 0 }; }
function splitFocus(g, axis) {   // where on the screen this player's vehicle is, so the half shows it
  const T = g.tv, p = g.player;
  if (axis === "y") { if (T && isFinite(T.y)) return T.y - (T.camY || 0) - 60; return isFinite(p.y) ? p.y - (g.camY || 0) : 300; }
  const md = LEVELS[g.levelIndex].mode;
  if (md === "pinball" || md === "concert") return 480;
  if (md === "rocket") return p.x + p.w / 2;
  if (T && isFinite(T.x) && isFinite(T.cam)) return T.x - T.cam;
  return isFinite(p.x) ? p.x + p.w / 2 - g.camX : 480;
}
function splitDraw() {
  const g1 = game, g2 = SPLIT.g2, kind = splitKindOf(g1), s0 = scale * dpr, s = Math.min(s0, 1.25), main = ctx;
  for (const k of ["A", "B"]) { const o = SPLIT[k] || (SPLIT[k] = splitOff()); if (o.s !== s) { o.s = s; o.c.width = Math.ceil(W * s); o.c.height = Math.ceil(H * s); } }
  const A = SPLIT.A, B = SPLIT.B;
  ctx = A.x; ctx.setTransform(s, 0, 0, s, 0, 0); g1.draw();
  asP2(() => { ctx = B.x; ctx.setTransform(s, 0, 0, s, 0, 0); g2.draw(); });
  ctx = main; ctx.setTransform(s0, 0, 0, s0, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const hud = (o, dx, dy) => { ctx.globalAlpha = 0.95; ctx.drawImage(o.c, 0, 0, W * s, 110 * s, dx, dy, W / 2, 55); ctx.globalAlpha = 1; };
  if (kind === "rows") {
    const band = g => Math.max(0, Math.min(H / 2, splitFocus(g, "y") - 150));
    const b1 = band(g1), b2 = band(g2);
    ctx.drawImage(A.c, 0, b1 * s, W * s, (H / 2) * s, 0, 0, W, H / 2);
    ctx.drawImage(B.c, 0, b2 * s, W * s, (H / 2) * s, 0, H / 2, W, H / 2);
    if (b1 > 50) hud(A, 0, 0); if (b2 > 50) hud(B, 0, H / 2);
    R(BLACK, 0, H / 2 - 2, W, 4);
    T("J1", 20, W - 14, H / 2 - 18, ARMOR_LIGHT, "right", "middle"); T("J2", 20, W - 14, H - 18, rgb(140, 230, 160), "right", "middle");
  } else {
    const col = g => Math.max(0, Math.min(W / 2, splitFocus(g, "x") - W / 4));
    const c1 = col(g1), c2 = col(g2);
    ctx.drawImage(A.c, c1 * s, 0, (W / 2) * s, H * s, 0, 0, W / 2, H);
    ctx.drawImage(B.c, c2 * s, 0, (W / 2) * s, H * s, W / 2, 0, W / 2, H);
    hud(A, 0, 0); hud(B, W / 2, 0);
    R(BLACK, W / 2 - 2, 0, 4, H);
    T("J1", 20, 14, H - 18, ARMOR_LIGHT, "left", "middle"); T("J2", 20, W / 2 + 14, H - 18, rgb(140, 230, 160), "left", "middle");
  }
}

const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "jump", ArrowUp: "jump", KeyW: "jump" };
window.addEventListener("keydown", e => {
  unlock();
  if (game.state === "garage") {   // keyboard garage
    const n = GARAGE_ROWS.length;
    if (e.code === "ArrowUp" || e.code === "KeyW") game.gaSel = (game.gaSel + n) % (n + 1);
    else if (e.code === "ArrowDown" || e.code === "KeyS") game.gaSel = (game.gaSel + 1) % (n + 1);
    else if ((e.code === "ArrowLeft" || e.code === "KeyA") && game.gaSel < n) game.gaChange(game.gaSel, -1);
    else if ((e.code === "ArrowRight" || e.code === "KeyD") && game.gaSel < n) game.gaChange(game.gaSel, 1);
    else if (e.code === "KeyB" && !e.repeat) play("horn_" + GARAGE.horn);
    else if (e.code === "KeyN" && !e.repeat) { GARAGE.num = GARAGE.num % 99 + 1; saveGarage(); play("click"); }
    else if (["Space", "KeyX", "KeyJ"].includes(e.code) && !e.repeat) { if (game.gaSel < n) game.gaChange(game.gaSel, 1); else game.garageGo(); }
    else if (["Enter", "NumpadEnter"].includes(e.code) && !e.repeat) game.garageGo();
    else if ((e.code === "Escape" || e.code === "KeyQ") && !e.repeat) game.openMap(game.garageFor);
    if (e.code === "KeyM") toggleSound();
    e.preventDefault();
    return;
  }
  if (game.state === "custom") {   // keyboard dressing room
    const n = LOOK_ROWS.length;
    if (e.code === "ArrowUp" || e.code === "KeyW") game.cuSel = (game.cuSel + n) % (n + 1);
    else if (e.code === "ArrowDown" || e.code === "KeyS") game.cuSel = (game.cuSel + 1) % (n + 1);
    else if ((e.code === "ArrowLeft" || e.code === "KeyA") && game.cuSel < n) game.cuChange(game.cuSel, -1);
    else if ((e.code === "ArrowRight" || e.code === "KeyD") && game.cuSel < n) game.cuChange(game.cuSel, 1);
    else if (e.code === "KeyR" && !e.repeat) game.cuRandom();
    else if (["Space", "KeyX", "KeyJ"].includes(e.code) && !e.repeat) { if (game.cuSel < n) game.cuChange(game.cuSel, 1); else game.beginGame(); }
    else if (["Enter", "NumpadEnter"].includes(e.code) && !e.repeat) game.beginGame();
    if (e.code === "KeyM") toggleSound();
    e.preventDefault();
    return;
  }
  if (game.state === "shop") {   // keyboard shopping
    const n = SHOP.length;
    if (e.code === "ArrowLeft" || e.code === "KeyA") game.shopSel = (game.shopSel + n) % (n + 1);
    else if (e.code === "ArrowRight" || e.code === "KeyD") game.shopSel = (game.shopSel + 1) % (n + 1);
    else if (e.code === "ArrowDown" || e.code === "KeyS") game.shopSel = game.shopSel >= n ? 0 : game.shopSel + PER_ROW >= n ? n : game.shopSel + PER_ROW;
    else if (e.code === "ArrowUp" || e.code === "KeyW") game.shopSel = game.shopSel >= n ? Math.floor((n - 1) / PER_ROW) * PER_ROW : Math.max(0, game.shopSel - PER_ROW);
    else if (["Enter", "NumpadEnter", "Space", "KeyX", "KeyJ"].includes(e.code) && !e.repeat) {
      if (game.shopSel < n) game.buy(game.shopSel); else game.openMap(game.levelIndex, true);
    }
    if (e.code === "KeyM") toggleSound();
    e.preventDefault();
    return;
  }
  if (NET.role === "guest" && NET.video) {   // playing on someone else's game: just send the buttons
    const kk = KEYMAP[e.code]; if (kk) { keys[kk] = true; if (kk === "jump" && !e.repeat) NET.lastJp++; if (kk === "left" && !e.repeat) NET.lastL = (NET.lastL || 0) + 1; if (kk === "right" && !e.repeat) NET.lastR = (NET.lastR || 0) + 1; }
    if (["KeyX", "KeyJ", "KeyZ", "KeyK", "KeyL", "KeyF", "ControlLeft", "ShiftRight"].includes(e.code)) { NET.ah = true; if (!e.repeat) NET.lastAt++; }
    e.preventDefault(); return;
  }
  if (game.state === "map" && game.twoP && ["KeyF", "KeyG"].includes(e.code) && !e.repeat) { game.openCustomP2("map"); e.preventDefault(); return; }
  if (e.code === "Digit2" && !e.repeat && (game.state === "title" || game.state === "map") && game.twoP !== "net") {
    game.twoP = game.twoP ? false : "local"; try { localStorage.setItem("caballero_2p", game.twoP ? "1" : "0"); } catch (_) {} play("click");
  }
  if (game.twoP === "local" && game.state === "play" && !game.paused) {   // same keyboard: the left side of the keyboard is player 2
    const k2 = P2_KEYS[e.code];
    if (k2) { e.preventDefault(); if (k2 === "attack") { if (!e.repeat) inp2.attack = true; keys2.attack = true; } else { if (k2 === "jump" && !e.repeat) inp2.jumpPressed = true; keys2[k2] = true; } return; }
    if (P1_ATTACK_2P.includes(e.code)) { e.preventDefault(); if (!e.repeat) inp.attack = true; axeHeld = true; return; }
  }
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (k === "jump" && !e.repeat) inp.jumpPressed = true; keys[k] = true; }
  if (["KeyX", "KeyJ", "KeyZ", "KeyK", "ControlLeft"].includes(e.code)) { if (!e.repeat) inp.attack = true; axeHeld = true; }
  if (e.code === "KeyM") toggleSound();
  if (e.code === "KeyB" && game.state === "title" && !e.repeat) game.titleReset();
  if (e.code === "KeyP" || e.code === "Escape") setPaused(!game.paused);
  if (e.code === "KeyQ" && game.paused) game.quitToMap();
  if (e.code === "Enter" || e.code === "NumpadEnter") tapStart();
});
window.addEventListener("keyup", e => { if (NET.role === "guest" && ["KeyX", "KeyJ", "KeyZ", "KeyK", "KeyL", "KeyF", "ControlLeft", "ShiftRight"].includes(e.code)) NET.ah = false; const k2 = P2_KEYS[e.code]; if (k2) keys2[k2] = false; if (P1_ATTACK_2P.includes(e.code)) axeHeld = false; const k = KEYMAP[e.code]; if (k) keys[k] = false; if (["KeyX", "KeyJ", "KeyZ", "KeyK", "ControlLeft"].includes(e.code)) axeHeld = false; });
window.addEventListener("blur", () => { keys.left = keys.right = keys.jump = false; axeHeld = false; });
window.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  e.preventDefault(); unlock();
  const r = canvas.getBoundingClientRect(), tx = (e.clientX - r.left) / r.width * W, ty = (e.clientY - r.top) / r.height * H;
  if (game.state === "shop") game.shopTap(tx, ty);
  else if (game.state === "custom") game.cuTap(tx, ty);
  else if (game.state === "garage") game.gaTap(tx, ty);
  else if (game.state === "title" && inside(tx, ty, RESET_BTN)) game.titleReset();
  else if (game.state === "map") game.mapTap(tx, ty);
  else if (game.paused && inside(tx, ty, QUIT_BTN)) game.quitToMap();
  else tapStart();
});

const dpad = document.getElementById("dpad");
let dpadId = null;
function dpadSet(e) {
  const r = dpad.getBoundingClientRect(), left = e.clientX < r.left + r.width / 2;
  touch.left = left; touch.right = !left; dpad.dataset.dir = left ? "l" : "r";
}
dpad.addEventListener("pointerdown", e => {
  e.preventDefault(); unlock(); dpadId = e.pointerId;
  try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
  dpadSet(e);
});
dpad.addEventListener("pointermove", e => { if (e.pointerId === dpadId) dpadSet(e); });
const dpadEnd = e => { if (e.pointerId === dpadId) { dpadId = null; touch.left = touch.right = false; dpad.dataset.dir = ""; } };
dpad.addEventListener("pointerup", dpadEnd);
dpad.addEventListener("pointercancel", dpadEnd);

function holdButton(el, down, up) {
  el.addEventListener("pointerdown", e => {
    e.preventDefault(); unlock();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add("on"); down();
  });
  const end = () => { el.classList.remove("on"); if (up) up(); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
holdButton(document.getElementById("bJump"), () => { if (NET.role === "guest" && NET.video) { NET.lastJp++; touch.jump = true; return; } if (!tapStart()) { inp.jumpPressed = true; touch.jump = true; } }, () => { touch.jump = false; });
holdButton(document.getElementById("bAxe"), () => { if (NET.role === "guest" && NET.video) { NET.lastAt++; NET.ah = true; return; } if (!tapStart()) { inp.attack = true; axeHeld = true; } }, () => { axeHeld = false; NET.ah = false; });

const bSound = document.getElementById("bSound");
function toggleSound() {
  soundOn = !soundOn;
  bSound.textContent = soundOn ? "🔊" : "🔇";
  if (!soundOn && hasSpeech) speechSynthesis.cancel();
  if (master) master.gain.value = soundOn ? 0.8 : 0;
}
bSound.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); unlock(); toggleSound(); });

const bPause = document.getElementById("bPause");
function setPaused(on) {
  if (on && game.state !== "play") return;   // only pause during play
  game.paused = on;
  bPause.innerHTML = on ? "&#9654;" : "&#10074;&#10074;";
  if (on && hasSpeech) speechSynthesis.cancel();
  if (actx) { if (on) actx.suspend(); else actx.resume(); }
}
bPause.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); unlock(); setPaused(!game.paused); });
document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

let last = performance.now(), acc = 0;
let slowFrames = 0;
function frame(now) {
  if (NET.btn) NET.btn.style.display = game.state === "title" || game.state === "map" || NET.role ? "" : "none";
  if (NET.role === "guest" && NET.video) { netGuestSend(); last = now; requestAnimationFrame(frame); return; }   // this device only shows the host's game
  const dt = now - last;
  if (SHADE && game.state === "play" && !game.paused) { slowFrames = dt > 26 ? slowFrames + 1 : Math.max(0, slowFrames - 2); if (slowFrames > 150) SHADE = false; }
  acc += Math.min(100, now - last); last = now;
  if (game.paused) acc = 0;
  while (acc >= STEP_MS) {
    inp.left = keys.left || touch.left;
    inp.right = keys.right || touch.right;
    inp.jumpHeld = keys.jump || touch.jump;
    if (NET.role === "host") netHostRead();
    inp2.left = keys2.left || net2.left; inp2.right = keys2.right || net2.right; inp2.jumpHeld = keys2.jump || net2.jump;
    if (game.swapped) for (const k of ["left", "right", "jumpHeld", "jumpPressed", "attack"]) { const v = inp[k]; inp[k] = inp2[k]; inp2[k] = v; }
    game.step(); splitStep();
    inp2.jumpPressed = inp2.attack = false;   // player 2's taps last until both halves have had their turn
    acc -= STEP_MS;
  }
  updateEngine(); updateRock();
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  if (SPLIT.on && SPLIT.g2) splitDraw(); else game.draw();
  if (NET.streamCopy) NET.streamCopy();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
