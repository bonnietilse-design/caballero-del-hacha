<title>El Caballero del Hacha</title>

<style>
  :root { --ctl: min(19vh, 84px); }
  html, body {
    margin: 0; height: 100%; background: #0f0f19; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  .ctl { display: none; }
  body.is-touch .ctl { display: flex; }
  #dpad {
    position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom));
    width: calc(var(--ctl) * 2.1); height: var(--ctl); border-radius: calc(var(--ctl) / 2);
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.38); touch-action: none;
  }
  #dpad span {
    flex: 1; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.9);
    font-size: calc(var(--ctl) * .42); border-radius: calc(var(--ctl) / 2); pointer-events: none;
  }
  #dpad[data-dir="l"] span:first-child, #dpad[data-dir="r"] span:last-child { background: rgba(255,255,255,.3); }
  #btns {
    position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom));
    gap: 14px; align-items: flex-end;
  }
  .btn {
    width: var(--ctl); height: var(--ctl); border-radius: 50%; border: 2px solid rgba(255,255,255,.42);
    background: rgba(255,255,255,.16); color: #fff; font: 700 calc(var(--ctl) * .2) "Trebuchet MS", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; touch-action: none; padding: 0;
  }
  #bAxe {
    width: calc(var(--ctl) * 1.15); height: calc(var(--ctl) * 1.15); background: rgba(230,60,60,.38);
    font-size: calc(var(--ctl) * .5); margin-bottom: calc(var(--ctl) * .35);
  }
  .btn.on { background: rgba(255,255,255,.42); }
  .top {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.28); color: #fff; font-size: 20px; padding: 0; touch-action: none; cursor: pointer;
  }
  #bSound { right: calc(8px + env(safe-area-inset-right)); }
  #bPause { right: calc(60px + env(safe-area-inset-right)); font-size: 18px; }
  #rotate {
    display: none; position: fixed; left: 0; right: 0; top: calc(16vh + 56vw + 14px);
    color: rgba(255,255,255,.65); text-align: center; font-size: 15px; pointer-events: none;
  }
  @media (orientation: portrait) {
    body.is-touch #wrap { align-items: flex-start; padding-top: 16vh; }
    body.is-touch #rotate { display: block; }
  }
</style>
</head>

const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const collide = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const inside = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const inflate = (r, dx, dy) => ({ x: r.x - Math.floor(dx / 2), y: r.y - Math.floor(dy / 2), w: r.w + dx, h: r.h + dy });
function seeded(a) {   // small repeatable random number generator
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

function synth(rate, dur, f1, f2 = null, wave = "square", vol = 0.4, tremolo = 0, attack = 0.004, curve = 2) {
  if (f2 === null) f2 = f1;
  const n = Math.floor(rate * dur), out = new Float32Array(n), an = Math.max(1, Math.floor(attack * rate));
  const rnd = seeded(5);
  let phase = 0;
  for (let i = 0; i < n; i++) {
    const t = i / n;
    phase += (f1 + (f2 - f1) * t) / rate;
    const p = phase % 1;
    let v;
    if (wave === "square") v = p < 0.5 ? 1 : -1;
    else if (wave === "tri") v = 4 * Math.abs(p - 0.5) - 1;
    else if (wave === "sine") v = Math.sin(2 * Math.PI * p);
    else v = rnd() * 2 - 1;
    let env = Math.min(1, i / an) * Math.pow(1 - t, curve);
    if (tremolo) env *= 0.55 + 0.45 * Math.sin(2 * Math.PI * tremolo * i / rate);
    out[i] = v * env * vol;
  }
  return out;
}
function concat(...parts) {
  const out = new Float32Array(parts.reduce((s, p) => s + p.length, 0));
  let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function mixAll(...parts) {
  const out = new Float32Array(Math.max(...parts.map(p => p.length)));
  for (const p of parts) for (let i = 0; i < p.length; i++) out[i] += p[i];
  return out;
}
function lowpass(a, amount) {
  const out = new Float32Array(a.length); let y = 0;
  for (let i = 0; i < a.length; i++) { y += amount * (a[i] - y); out[i] = y; }

    this.vx += move * 0.22 + (move ? 0 : (1.2 - this.vx) * 0.02); this.vx = Math.max(-2.2, Math.min(5.4, this.vx));
    this.vy += inp.jumpHeld ? -0.3 : 0.15; this.vy = Math.max(-3.2, Math.min(2.8, this.vy * 0.97));
    this.vy -= GRAVITY; this.maxFall = 4; physicsMove(this, level);   // (physicsMove adds the gravity back on)
    if (this.y < 24) { this.y = 24; this.vy = Math.max(0, this.vy); }
    if (this.x < 0) { this.x = 0; this.vx = 0; }
    this.x = Math.min(this.x, level.pxW - this.w);
    this.facing = 1; this.anim += 0.2 + Math.abs(this.vx) * 0.12;
    if (inp.attack && this.torpCd === 0) { this.torpCd = this.torpGap; this.justFired = true; }
  }
  rect() { return { x: Math.round(this.x), y: Math.round(this.y), w: this.w, h: this.h }; }
  mountBike() { const cx = this.x + this.w / 2; this.bike = true; this.w = BIKE_W; this.x = cx - this.w / 2; }
  mountTank() {   // the tank is armoured: two extra hearts while you drive it
    const cx = this.x + this.w / 2, bottom = this.y + this.h;
    this.tank = true; this.w = TANK_W; this.h = TANK_H; this.x = cx - this.w / 2; this.y = bottom - this.h;
    this.maxHearts += 2; this.hearts += 2;
  }
  attackFrame() { return this.attackTimer ? this.atkTotal - this.attackTimer : 0; }
  swingActive() { const f = this.attackFrame(); return f >= this.act0 && f <= this.act1; }
  lanceLen() { return 86 * this.reach + (this.swingActive() ? Math.sin(this.attackFrame() / this.atkTotal * Math.PI) * 34 : 0); }
  attackBox() {   // the area the (long!) axe hurts this frame, or null
    if (this.tank || this.plane || this.car || this.rocket) return null;
    if (this.horse) {   // the lance: thrust it with the button, or just charge at full gallop
      if (!this.swingActive() && (Math.abs(this.vx) < 3.8 || Math.sign(this.vx) !== this.facing)) return null;
      const r = this.rect(), w = Math.round(32 + this.lanceLen() - (r.w - 8));
      return { x: this.facing > 0 ? r.x + r.w - 8 : r.x + 8 - w, y: r.y + 6, w, h: r.h - 6 };
    }
    if (!this.swingActive()) return null;
    const r = this.rect(), k = this.reach, w = Math.round(92 * k), cx = r.x + Math.floor(r.w / 2);
    return { x: this.facing > 0 ? cx : cx - w, y: r.y - Math.round(44 * k), w, h: Math.round(56 + 56 * k) };
  }
  hurt(srcX) {
    if (this.invuln > 0 || this.dead) return false;
    this.hearts--; this.invuln = INVULN_FRAMES; this.knockback = 12;
    this.vx = srcX > this.x + this.w / 2 ? -6 : 6; this.vy = -6;
    return true;
  }
  update(inp, level) {
    if (this.plane) return this.updatePlane(inp, level);
    if (this.sub) return this.updateSub(inp, level);
    this.justJumped = this.justSwung = this.justFired = this.justGrenade = this.justNitro = this.justUmb = false;
    if (this.invuln > 0) this.invuln--;
    if (this.cooldown > 0) this.cooldown--;
    if (this.recoil > 0) this.recoil -= 0.5;
    if (this.storm) {   // in the storm the attack button opens and closes the umbrella
      if (inp.attack) { this.umbrella = !this.umbrella; this.justUmb = true; }
    } else if (this.car) {   // in the race car the attack button fires the turbo
      if (this.nitroCd > 0) this.nitroCd--;
      if (this.nitroT > 0) this.nitroT--;
      if (inp.attack && this.nitroCd === 0) { this.nitroT = 55; this.nitroCd = this.nitroGap; this.justNitro = true; }
    } else if (this.tank) {   // in the tank the attack button fires the cannon
      if (inp.attack && this.cooldown === 0) { this.justFired = true; this.cooldown = this.fireCd; this.recoil = 7; }
    } else if (inp.attack && this.attackTimer > this.atkTotal - 12 && !this.horse) {   // a quick second tap: throw a grenade
      this.justGrenade = true;
    } else if (inp.attack && this.attackTimer === 0 && this.cooldown === 0) {
      this.attackTimer = this.atkTotal; this.hitIds.clear(); this.justSwung = true;
    }
    if (this.attackTimer > 0) { this.attackTimer--; if (this.attackTimer === 0) this.cooldown = this.atkCooldown; }

    let move = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (this.knockback > 0) { this.knockback--; move = 0; }
    if (this.spinT > 0) { this.spinT--; move = 0; }   // spinning out on oil
    if (this.wallLock > 0) { this.wallLock--; move = 0; }   // just kicked off a wall
    const bike = this.bike || this.car, horse = this.horse, ninja = this.ninja;   // vehicles and the ninja move differently
    let accel = (this.onGround ? RUN_ACCEL : RUN_ACCEL * AIR_CONTROL) * (this.nitroT ? 1.2 : bike ? 0.65 : this.tank ? 0.4 : horse ? 0.6 : 1);
    if ((bike || horse) && this.onGround && move && Math.sign(this.vx) === -move) accel = 0.9;   // brakes
    const top = (this.car ? (this.nitroT ? 13.5 : 10) : bike ? 8.5 : this.tank ? 3.4 : horse ? 7.2 : ninja ? 5.6 : this.sneak ? 3.2 : MAX_RUN) * (!bike && !horse && this.attackTimer && this.onGround ? 0.6 : 1) * (this.umbrella ? 0.8 : 1);
    if (this.nitroT && this.onGround) this.vx = Math.max(this.vx, Math.min(13.5, this.vx + 0.6));
    if (move) {
      this.vx = Math.max(-top, Math.min(top, this.vx + move * accel));
      if (this.attackTimer === 0) this.facing = move;
    } else if (this.onGround && this.knockback === 0) {
      this.vx *= bike || horse ? 0.97 : RUN_FRICTION; if (Math.abs(this.vx) < 0.1) this.vx = 0;
    }

    this.coyote = this.onGround ? COYOTE_FRAMES : Math.max(0, this.coyote - 1);
    this.jumpBuffer = inp.jumpPressed ? JUMP_BUFFER_FRAMES : Math.max(0, this.jumpBuffer - 1);
    if (this.jumpBuffer && this.coyote) {
      this.vy = -(this.car ? 13.4 : bike ? 14 : this.tank ? 11 : horse ? 13.8 : ninja ? 14.4 : JUMP_SPEED); this.jumpBuffer = this.coyote = 0; this.onGround = false; this.justJumped = true;
    }
    if (ninja && !this.onGround && this.jumpBuffer && this.wallT > 0) {   // ninja wall jump: kick off the wall
      this.vy = -12.8; this.vx = -this.wallDir * 3.6; this.facing = -this.wallDir;
      this.wallLock = 7; this.wallT = 0; this.jumpBuffer = 0; this.justJumped = true;
    }
    if (!inp.jumpHeld && this.vy < -JUMP_CUT) this.vy = -JUMP_CUT;
    this.maxFall = ninja && this.wallT > 0 && move === this.wallDir ? 2.4 : this.umbrella ? 2.6 : MAX_FALL;   // slide slowly down walls; float down under the umbrella

    physicsMove(this, level);
    if (ninja) {
      if (this.hitWall && !this.onGround) { this.wallT = 8; this.wallDir = move || this.facing; }
      else if (this.wallT > 0 && !this.hitWall) this.wallT--;
      if (this.onGround) this.wallT = 0;
    }
    if (this.x < 0) { this.x = 0; this.vx = 0; }
    this.x = Math.min(this.x, level.pxW - this.w);
    this.anim += this.onGround && Math.abs(this.vx) > 0.5 ? Math.abs(this.vx) * 0.25 : 0.05;
  }
}

class FlyingAxe {   // the "Hacha voladora" upgrade: thrown axe that comes back like a boomerang
  constructor(x, y, dir) { this.x = x; this.y = y; this.vx = dir * 9.5; this.t = 0; this.hitIds = new Set(); this.alive = true; }
  rect() { return { x: this.x - 15, y: this.y - 15, w: 30, h: 30 }; }
  update(p) {
    this.t++;
    if (this.t < 30) { this.x += this.vx; this.vx *= 0.985; }
    else {
      const dx = p.x + p.w / 2 - this.x, dy = p.y + p.h / 2 - this.y, d = Math.hypot(dx, dy);
      if (d < 26 || this.t > 240) { this.alive = false; return; }
      this.x += dx / d * 10; this.y += dy / d * 10;
      if (this.t === 30) this.hitIds.clear();   // can hit things again on the way back
    }
  }
}

// ------------------------------------------------------------------ enemies
let nextId = 1;
class Enemy {   // shared bits for every enemy
  init(kind, w, h, hp, score) {
    Object.assign(this, { kind, w, h, hp, maxHp: hp, score, id: nextId++, vx: 0, vy: 0, dir: -1,
      onGround: false, hitWall: false, flash: 0, stun: 0, alive: true, t: Math.random() * 100 });
  }
  rect() { return { x: Math.round(this.x), y: Math.round(this.y), w: this.w, h: this.h }; }
  colors() { return ENEMY_COLORS[this.kind]; }
  hit(fromDir, dmg = 1) {
    this.hp -= dmg; this.flash = 8; this.stun = 16; this.vx = fromDir * 6.5; this.vy = -4; this.dir = -fromDir;
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  harmful() { return this.stun === 0; }
  hittable() { return true; }
}

const ROO_STATS = {   // size, hit points, hop strength, pause between hops, points
  t: { w: 30, h: 42, hp: 1, hopVy: 7.0, hopVx: 2.2, wait: [25, 55], score: 100 },
  T: { w: 38, h: 56, hp: 3, hopVy: 6.5, hopVx: 1.6, wait: [50, 80], score: 500 },
  j: { w: 26, h: 36, hp: 1, hopVy: 12.0, hopVx: 2.8, wait: [35, 60], score: 150 },
};
class Kangaroo extends Enemy {   // hops along, turning round at walls and ledges
  constructor(kind, tx, ty, mul = 1) {
    super();
    const s = ROO_STATS[kind];
    this.init(kind, s.w, s.h, s.hp, s.score);
    this.hopVy = s.hopVy; this.hopVx = s.hopVx * mul;
    this.waitRange = [Math.round(s.wait[0] / mul), Math.round(s.wait[1] / mul)];
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h; this.wait = randInt(10, 60);
  }
  pathBlocked(level) {   // would the next hop hit a wall or go off a ledge?
    const r = this.rect(), dist = this.hopVx * 2 * this.hopVy / GRAVITY;
    const front = this.dir > 0 ? r.x + r.w : r.x;
    const near = Math.floor((front + this.dir * 4) / TILE), land = Math.floor((front + this.dir * dist) / TILE);
    const below = Math.floor((r.y + r.h + 2) / TILE);
    if (level.solidAt(near, Math.floor((r.y + r.h - 4) / TILE))) return true;
    return !(level.solidAt(near, below) && level.solidAt(land, below));
  }
  update(level) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.stun > 0) { this.stun--; this.vx *= 0.9; }
    else if (this.onGround) {
      this.vx = 0;
      if (--this.wait <= 0) {
        if (this.pathBlocked(level)) { this.dir *= -1; this.wait = 12; }
        else { this.vy = -this.hopVy; this.vx = this.dir * this.hopVx; this.wait = randInt(...this.waitRange); }
      }
    }
    physicsMove(this, level);
    if (this.hitWall && this.stun === 0) this.dir *= -1;
    if (this.y > level.pxH + 100) this.alive = false;
  }
  draw(cam) { drawKangaroo(this, cam); }
}

const FLYER_STATS = {   // wasp, bat, seagull, vulture: all fly to and fro, then dive at the knight
  w: { w: 26, h: 20, hp: 1, speed: 1.3, dive: 3.2, score: 150, sound: "buzz" },
  b: { w: 28, h: 18, hp: 1, speed: 1.6, dive: 3.5, score: 150, sound: "squeak" },
  g: { w: 34, h: 18, hp: 1, speed: 1.5, dive: 3.4, score: 150, sound: "screech" },
  v: { w: 40, h: 26, hp: 2, speed: 1.2, dive: 3.8, score: 300, sound: "screech" },
  q: { w: 56, h: 30, hp: 2, speed: 1.7, dive: 4.2, score: 300, sound: "screech" },   // pterodactyl
};
class Flyer extends Enemy {
  constructor(kind, tx, ty, mul = 1) {
    super();
    const s = FLYER_STATS[kind];
    this.init(kind, s.w, s.h, s.hp, s.score); this.cry = s.sound;
    this.x = tx + 7; this.y = ty + 10; this.homeX = this.x; this.homeY = this.y;
    this.speed = s.speed * mul; this.diveSpeed = s.dive * mul; this.mode = "patrol"; this.modeT = randInt(30, 90);
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.stun > 0) { this.stun--; this.x += this.vx; this.y += this.vy; this.vx *= 0.88; this.vy *= 0.88; return; }
    const px = player.x + player.w / 2, py = player.y + player.h / 2, cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    if (this.mode === "patrol") {
      this.x += this.dir * this.speed;
      if (Math.abs(this.x - this.homeX) > 120) this.dir = this.x < this.homeX ? 1 : -1;
      this.y = lerp(this.y, this.homeY + Math.sin(this.t * 0.06) * 14, 0.2);
      if (--this.modeT <= 0 && Math.abs(px - cx) < 230 && py > cy && !player.dead) {
        const d = Math.hypot(px - cx, py - cy) || 1;
        this.vx = (px - cx) / d * this.diveSpeed; this.vy = (py - cy) / d * this.diveSpeed;
        this.dir = this.vx > 0 ? 1 : -1; this.mode = "dive"; this.modeT = 70; game.sound(this.cry);
      }
    } else if (this.mode === "dive") {
      this.x += this.vx; this.y += this.vy;
      if (--this.modeT <= 0 || level.solidAt(Math.floor(cx / TILE), Math.floor((cy + 12) / TILE))) this.mode = "return";
    } else {
      const dx = this.homeX - this.x, dy = this.homeY - this.y, d = Math.hypot(dx, dy);
      if (d < 4) { this.mode = "patrol"; this.modeT = randInt(80, 140); }
      else { this.x += dx / d * 2; this.y += dy / d * 2; this.dir = dx > 0 ? 1 : -1; }
    }
  }
  hit(fromDir, dmg = 1) {
    this.hp -= dmg; this.flash = 8; this.stun = 14; this.vx = fromDir * 6; this.vy = -2; this.mode = "return";
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  draw(cam) { if (this.kind === "w") drawWasp(this, cam); else if (this.kind === "q") drawPtero(this, cam); else drawBird(this, cam); }
}

const LUNGER_STATS = {   // creep along, give a warning (open jaws, raised head or tail), then lunge
  c: { w: 70, h: 22, hp: 2, score: 300, speed: 0.5, lunge: 5.5, sight: 190, warn: 30, time: 22, sound: "hiss" },   // saltwater crocodile
  n: { w: 58, h: 18, hp: 1, score: 200, speed: 0.5, lunge: 6.5, sight: 150, warn: 26, time: 12, sound: "hiss" },   // taipan snake
  k: { w: 44, h: 26, hp: 1, score: 150, speed: 0.8, lunge: 6.0, sight: 170, warn: 26, time: 16, sound: "click" },  // scorpion
  J: { w: 70, h: 72, hp: 3, score: 500, speed: 1.2, lunge: 7.0, sight: 360, warn: 28, time: 80, sound: "neigh" },  // enemy cavalry
  r: { w: 50, h: 40, hp: 2, score: 300, speed: 1.2, lunge: 6.8, sight: 230, warn: 24, time: 22, sound: "screech" },   // raptor
  y: { w: 84, h: 52, hp: 3, score: 600, speed: 0.6, lunge: 6.0, sight: 280, warn: 44, time: 44, sound: "stomp" },    // triceratops
};
class Lunger extends Enemy {
  constructor(kind, tx, ty, mul = 1) {
    super();
    const s = LUNGER_STATS[kind]; this.s = s;
    this.init(kind, s.w, s.h, s.hp, s.score);
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h;
    this.speed = s.speed * mul; this.lungeSpeed = s.lunge * mul; this.mode = "walk"; this.modeT = 0; this.jaw = 0;
    if (kind === "y") this.blocks = fromDir => this.mode !== "rest" && this.stun === 0 && fromDir === -this.dir;   // horns and frill stop blows from the front
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.stun > 0) { this.stun--; this.vx *= 0.85; }
    else if (this.mode === "walk") {
      this.vx = this.dir * this.speed;
      const dx = player.x + player.w / 2 - (this.x + this.w / 2);
      if (this.onGround && !player.dead && Math.abs(dx) < this.s.sight && Math.abs(player.y + player.h - (this.y + this.h)) < 40) {
        this.mode = "open"; this.modeT = this.s.warn; this.dir = dx > 0 ? 1 : -1; this.vx = 0; game.sound(this.s.sound);
      }
    } else if (this.mode === "open") { this.vx = 0; if (--this.modeT <= 0) { this.mode = "lunge"; this.modeT = this.s.time; } }
    else if (this.mode === "lunge") {
      this.vx = this.dir * this.lungeSpeed;
      if (--this.modeT <= 0) { this.mode = "rest"; this.modeT = 60; game.sound("snap"); }
    } else { this.vx = 0; if (--this.modeT <= 0) this.mode = "walk"; }
    const target = this.mode === "open" || this.mode === "lunge" ? 1 : 0;   // jaws open while it threatens and lunges
    this.jaw += (target - this.jaw) * 0.3;
    physicsMove(this, level);
    const blocked = this.hitWall || (this.onGround && ledgeAhead(this, level));
    if (this.stun === 0 && blocked) {
      if (this.mode === "lunge") { this.mode = "rest"; this.modeT = 60; game.sound("snap"); }
      else if (this.mode === "walk") this.dir *= -1;
    }
    if (this.y > level.pxH + 100) this.alive = false;
  }
  hit(fromDir, dmg = 1) { this.mode = "rest"; this.modeT = 50; return super.hit(fromDir, dmg); }
  draw(cam) {
    const fn = { c: drawCroc, n: drawTaipan, J: drawCavalry, r: drawRaptor, y: drawTrike }[this.kind] || drawScorpion; fn(this, cam);
  }
}

class Mole extends Enemy {   // digs towards the knight underground (watch the moving mound!) and pops up beside him
  constructor(tx, ty, mul = 1) {
    super();
    this.init("m", 30, 32, 1, 200);
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h;
    this.speed = 1.1 * mul; this.mode = "dig"; this.modeT = randInt(0, 60); this.up = 0;
  }
  harmful() { return this.up > 0.7 && this.stun === 0; }
  hittable() { return this.up > 0.4; }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dy = player.y + player.h - (this.y + this.h);
    if (this.stun > 0) { this.stun--; this.vx = 0; }
    else if (this.mode === "dig") {
      this.up = Math.max(0, this.up - 0.1);
      if (this.modeT > 0) { this.modeT--; this.vx = this.dir * this.speed; }   // digging away after popping up
      else if (Math.abs(dx) < 300 && Math.abs(dy) < 50 && !player.dead && player.onGround) {
        this.dir = dx > 0 ? 1 : -1; this.vx = this.dir * this.speed;
        if (Math.abs(dx) < 90) { this.mode = "pop"; this.vx = 0; game.sound("pop"); game.dust(this.x + this.w / 2, this.y + this.h); }
      } else this.vx = this.dir * this.speed * 0.4;
    } else if (this.mode === "pop") {
      this.vx = 0; this.up = Math.min(1, this.up + 0.08);
      if (this.up >= 1) { this.mode = "up"; this.modeT = 75; }
    } else if (this.mode === "up") {
      this.vx = 0; this.dir = dx > 0 ? 1 : -1;
      if (--this.modeT <= 0) { this.mode = "dig"; this.dir = dx > 0 ? -1 : 1; this.modeT = 70; }
    }
    physicsMove(this, level);
    if (this.vx && (this.hitWall || (this.onGround && ledgeAhead(this, level)))) { this.dir *= -1; this.vx = 0; }
    if (this.y > level.pxH + 100) this.alive = false;
  }
  hit(fromDir, dmg = 1) {
    if (!this.hittable()) return false;
    const dead = super.hit(fromDir, dmg); this.vy = 0; this.vx = 0; this.mode = "dig"; this.dir = fromDir; this.modeT = 70;
    return dead;
  }
  draw(cam) { drawMole(this, cam); }
}

class Dancer extends Enemy {   // fierce flamenco dancer: stamps towards you, throws spinning fans, twirls into you
  constructor(tx, ty, mul = 1) {
    super();
    this.init("d", 30, 54, 2, 400);
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h;
    this.mul = mul; this.speed = 0.9 * mul; this.mode = "dance"; this.modeT = randInt(30, 90);
    this.throwCd = randInt(70, 150); this.armUp = 0; this.dress = pick(DRESSES);
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.armUp > 0) this.armUp--;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dist = Math.abs(dx);
    const sameFloor = Math.abs(player.y + player.h - (this.y + this.h)) < 80;
    if (this.stun > 0) { this.stun--; this.vx *= 0.9; }
    else if (this.mode === "twirl") {   // spins across the floor at you
      this.vx = this.dir * 4.2 * this.mul;
      if (--this.modeT <= 0) { this.mode = "dance"; this.modeT = 70; }
    } else if (dist < 440 && !player.dead) {
      this.dir = dx > 0 ? 1 : -1;
      this.vx = dist > 210 ? this.dir * this.speed : 0;
      if (--this.throwCd <= 0 && dist < 360) { game.throwFan(this, player); this.throwCd = Math.round(randInt(140, 210) / this.mul); this.armUp = 16; }
      if (dist < 170 && sameFloor && --this.modeT <= 0) { this.mode = "twirl"; this.modeT = 40; game.sound("castanets"); }
    } else this.vx = 0;
    physicsMove(this, level);
    if (this.vx && (this.hitWall || (this.onGround && ledgeAhead(this, level)))) {
      this.vx = 0; if (this.mode === "twirl") { this.mode = "dance"; this.modeT = 70; }
    }
    if (this.y > level.pxH + 100) this.alive = false;
  }
  hit(fromDir, dmg = 1) { this.mode = "dance"; this.modeT = 70; return super.hit(fromDir, dmg); }
  draw(cam) { drawDancer(this, cam); }
}

class Shark extends Enemy {   // swims in the water under a gap (only its fin shows) and leaps out when the knight comes near

    while (a > 0 && !level.solidAt(a - 1, 11)) a--;
    while (b < level.w - 1 && !level.solidAt(b + 1, 11)) b++;
    this.minX = a * TILE - 8; this.maxX = (b + 1) * TILE + 8;
    this.x = tx; this.y = WATER_Y; this.mul = mul; this.speed = 1.2 * mul; this.leapV = 12.5 * Math.sqrt(mul);
    this.mode = "swim"; this.modeT = randInt(40, 120); this.dir = 1;
  }

  hittable() { return this.mode === "leap"; }

    this.t++;

      this.x += this.dir * this.speed; this.y = WATER_Y;
      if (this.x < this.minX) { this.x = this.minX; this.dir = 1; }
      if (this.x > this.maxX - this.w) { this.x = this.maxX - this.w; this.dir = -1; }
      const dx = player.x + player.w / 2 - (this.x + this.w / 2);
      if (--this.modeT <= 0 && Math.abs(dx) < 220 && !player.dead) {

      }
    } else {
      this.vy += 0.42; this.x += this.vx; this.y += this.vy;
      this.x = Math.max(this.minX, Math.min(this.x, this.maxX - this.w));
      if (this.y >= WATER_Y && this.vy > 0) {
        this.mode = "swim"; this.y = WATER_Y; this.modeT = Math.round(randInt(80, 140) / this.mul);
        game.sound("splash"); game.splashAt(this.x + this.w / 2);
      }
    }

    this.hp -= dmg; this.flash = 8; this.vx = fromDir * 4;

class Shadow extends Enemy {   // shadow ninja: throws shuriken, slashes, blocks, and vanishes in smoke to strike from behind
  constructor(tx, ty, mul = 1) {
    super();
    this.init("h", 26, 48, 2, 350);
    this.x = tx + 7; this.y = ty + TILE - this.h; this.mul = mul; this.speed = 1.5 * mul;
    this.throwT = randInt(50, 110); this.jumpT = randInt(40, 100); this.throwAnim = 0;
    this.blinkT = randInt(140, 240); this.slashT = 0; this.slashCd = 0; this.slashBox = null; this.smoke = 0; this.guardT = 0;
  }
  blocks(fromDir) {   // now and then he catches your blow on his blade
    if (this.slashT || this.stun || fromDir !== -this.dir || Math.random() > 0.25) return false;
    this.guardT = 16; return true;
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.throwAnim) this.throwAnim--;
    if (this.guardT) this.guardT--;
    if (this.smoke) this.smoke--;
    if (this.slashCd) this.slashCd--;
    this.slashBox = null;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dy = player.y + player.h - (this.y + this.h), dist = Math.abs(dx);
    const sees = dist < 360 && Math.abs(dy) < 150 && !player.dead;
    if (this.stun > 0) { this.stun--; this.vx *= 0.9; this.slashT = 0; }
    else if (this.slashT > 0) {   // sword slash: a wind-up (watch for the "!"), then the blade sweeps
      this.slashT--; if (this.onGround) this.vx = 0;
      if (this.slashT === 8) game.sound("swing");
      if (this.slashT <= 8 && this.slashT > 2) { const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 6 : r.x - 40, y: r.y + 2, w: 46, h: 42 }; }
    } else if (sees) {
      this.dir = dx > 0 ? 1 : -1;
      if (this.onGround) this.vx = dist > 120 ? this.dir * this.speed : 0;
      if (--this.throwT <= 0) {   // one shuriken, or two in a spread
        game.enemyShot(this.x + this.w / 2, this.y + 18, player, 4.6 * this.mul, "eshuriken", rgb(70, 70, 84), BLACK);
        if (Math.random() < 0.5) { const o = game.shots[game.shots.length - 1]; game.shots.push({ ...o, vy: o.vy - 1.3 }); o.vy += 0.6; }
        this.throwT = Math.round(randInt(90, 130) / this.mul); this.throwAnim = 12;
      }
      if (this.onGround && dist < 64 && Math.abs(dy) < 40 && this.slashCd === 0) { this.slashT = 20; this.slashCd = 70; }
      else if (this.onGround && player.onGround && dist > 110 && --this.blinkT <= 0) this.blink(level, player, game);
      else if (this.onGround && dist < 150 && dist > 64 && --this.jumpT <= 0) { this.vy = -10.5; this.vx = this.dir * 3; this.jumpT = randInt(80, 130); game.sound("swing"); }
    } else if (this.onGround) this.vx = this.dir * this.speed * 0.6;
    physicsMove(this, level);
    if (this.onGround && this.stun === 0 && (this.hitWall || ledgeAhead(this, level))) { if (!sees) this.dir *= -1; this.vx = 0; }
    if (this.y > level.pxH + 100) this.alive = false;
  }
  blink(level, player, game) {   // poof! vanish in smoke and reappear behind the knight, sword ready
    this.blinkT = Math.round(randInt(200, 300) / this.mul);
    const nx = player.x + player.w / 2 - player.facing * 58 - this.w / 2, ny = player.y + player.h - this.h;
    const floor = Math.floor((player.y + player.h + 4) / TILE);
    if (!level.solidAt(Math.floor((nx + this.w / 2) / TILE), floor) || blockedAt(this, level, nx, ny) || nx < 0 || nx > level.pxW - this.w) return;

    this.x = nx; this.y = ny; this.vx = this.vy = 0; this.dir = player.facing; this.smoke = 20;

  }
  draw(cam) { drawShadow(this, cam); }
}

class Archer extends Enemy {   // archer at the tourney: stands his ground and looses arrows in a high arc

  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dist = Math.abs(dx);
    if (this.stun > 0) { this.stun--; this.vx *= 0.85; this.drawT = 0; }
    else {
      this.vx = 0;
      if (dist < 640 && !player.dead) {
        this.dir = dx > 0 ? 1 : -1;
        if (this.drawT > 0) { if (--this.drawT === 0) this.shoot(player, game); }
        else if (--this.shootT <= 0) { this.drawT = 34; this.shootT = Math.round(randInt(100, 150) / this.mul); }
      }

    if (this.y > level.pxH + 100) this.alive = false;
  }
  shoot(player, game) {   // aim where the rider will be when the arrow comes down

    const tx = player.x + player.w / 2 + player.vx * T * 0.85, ty = player.y + player.h * 0.4;
    const vx = Math.max(-9, Math.min(9, (tx - sx) / T)), vy = (ty - sy - 0.5 * g * T * T) / T;
    game.shots.push({ kind: "arrow", enemy: true, x: sx, y: sy, vx, vy, t: 0, life: 200, col: rgb(150, 110, 60), dark: WOOD_DARK });

class EnemyPlane extends Enemy {   // enemy biplane: flies at the knight shooting; red aces swing round and chase him
  constructor(tx, ty, mul = 1, awake = false) {
    super();
    this.init("E", 64, 30, 3, 250);
    this.x = tx; this.y = ty; this.baseY = ty; this.mul = mul; this.awake = awake; this.dir = -1;
    this.speed = (2.2 + Math.random() * 1.0) * mul; this.shootT = randInt(40, 100); this.phase = Math.random() * 6;
    this.ace = Math.random() < 0.3; this.spread = !this.ace && Math.random() < 0.45;
    this.paint = this.ace ? ACE_PLANE : pick(ENEMY_PLANES); this.chasing = false; this.chaseT = 0; this.peel = false;
  }
  fire(game, player, spread) {
    const sx = this.x + (this.dir > 0 ? this.w : 0), sy = this.y + 18;
    const a = Math.atan2(player.y + 17 - sy, player.x + player.w / 2 - sx);
    for (const o of spread ? [-0.22, 0, 0.22] : [0]) game.shots.push({ kind: "ebullet", enemy: true, x: sx, y: sy,
      vx: Math.cos(a + o) * 5.4 * this.mul, vy: Math.sin(a + o) * 5.4 * this.mul, t: 0, col: rgb(255, 210, 120), dark: rgb(200, 110, 40) });
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (!this.awake) { if (this.x < game.camX + W + 30) this.awake = true; else return; }
    if (this.chasing) {   // the ace sits on the knight's tail
      if (this.peel) { this.y -= 3; this.x += player.vx + 2; if (this.y < -60) this.alive = false; return; }
      this.x += Math.max(player.vx - 0.5, Math.min(player.vx + 2.5, (player.x - 160 - this.x) * 0.08 + player.vx));
      this.y += Math.max(-2.4, Math.min(2.4, (player.y - this.y) * 0.04));
      if (--this.shootT <= 0 && !player.dead) { this.fire(game, player, false); this.shootT = Math.round(randInt(60, 90) / this.mul); }
      if (++this.chaseT > 420) this.peel = true;
      return;
    }
    this.x -= this.speed; this.y = this.baseY + Math.sin(this.t * 0.04 + this.phase) * 34;
    if (this.x > player.x + 120 && --this.shootT <= 0 && !player.dead) {
      this.fire(game, player, this.spread); this.shootT = Math.round(randInt(80, 130) / this.mul);
    }
    if (this.ace && this.x < player.x - 40 && !player.dead) {   // loop round and give chase
      this.chasing = true; this.dir = 1; this.shootT = 50; game.sound("screech"); game.popup(this.x + 30, this.y - 10, "¡Un as!", HEART);
    }
    if (this.x + this.w < game.camX - 120) this.alive = false;   // flew past: gone
  }
  hit(fromDir, dmg = 1) { this.hp -= dmg; this.flash = 8; if (this.hp <= 0) { this.alive = false; return true; } return false; }
  draw(cam) {
    drawPlane(this.x - cam, this.y, this.dir, this.flash ? [WHITE, WHITE, WHITE] : this.paint, false, this.t,
      this.chasing ? (this.peel ? -0.4 : 0) : Math.cos(this.t * 0.04 + this.phase) * 0.12);
    drawCreatureHp(this, cam);
  }
}

class SkyMine extends Enemy {   // spiked mine hanging from a little balloon: shoot it or steer round it

class Airship extends Enemy {   // El Dirigible: an armoured airship guarding the finish line

      }
      this.ringT = 150; game.sound("boom");
    }
    if (--this.spawnT <= 0 && level.enemies.length < 6) {   // launches fighter planes
      for (const dy of [-50, 60]) level.enemies.push(new EnemyPlane(this.x + 20, Math.max(50, this.y + 30 + dy), this.mul, true));
      this.spawnT = p2 ? 260 : 360; game.sound("screech");

class BlackKnight extends Enemy {   // the final duel: shield up while he walks, sword slashes, and leaps that send shockwaves
  constructor(tx, ty, level, mul = 1) {
    super();
    this.init("X", 56, 96, 17, 5000);
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h;
    this.minX = level.arena[0]; this.maxX = level.arena[1]; this.mul = mul;
    this.mode = "wait"; this.modeT = 60; this.actions = 0; this.invuln = 0; this.slashBox = null; this.leapT = 0; this.waveT = 0;
    this.combo = 0; this.chain = false; this.summoned = false;
    this.title = "EL CABALLERO NEGRO"; this.voice = "negro"; this.intro = "¡El Caballero Negro!";
  }
  guarding() { return this.mode === "walk" || this.mode === "wait"; }
  blocks(fromDir) { return this.guarding() && fromDir === -this.dir; }   // his shield stops blows from the front
  harmful() { return this.mode === "leap" || this.mode === "dash"; }   // his sword, leap, charge and the shockwaves hurt
  phase2() { return this.hp <= this.maxHp / 2; }
  startLeap(dx, game) {
    this.mode = "leap"; this.vy = -13; this.vx = Math.sign(dx) * Math.min(6, Math.abs(dx) / 42 + 1) * this.mul; this.leapT = this.t;
    game.sound("swing");
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.invuln) this.invuln--;
    this.slashBox = null;
    const anger = 1 + (this.maxHp - this.hp) / this.maxHp * 0.6;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dist = Math.abs(dx);
    const awake = player.x > this.minX - 140 && !player.dead, face = () => { this.dir = dx > 0 ? 1 : -1; };
    const p2 = this.phase2();
    if (p2 && !this.summoned) {   // half beaten: he calls his shadow ninjas
      this.summoned = true; game.shake = Math.max(game.shake, 12); game.sound("clang"); say("sombras", true);
      game.popup(this.x + this.w / 2, this.y - 40, "¡Sombras, a mí!", HEART);
      for (const sx of [this.minX + 30, this.maxX - 70]) level.enemies.push(new Shadow(sx, this.y + this.h - TILE, this.mul));
    }
    if (this.mode === "wait") { this.vx = 0; if (awake) { face(); if (--this.modeT <= 0) this.mode = "walk"; } }
    else if (this.mode === "walk") {
      face(); this.vx = this.dir * 1.3 * this.mul * anger;
      if (dist < 110) {
        this.actions++;
        if (this.actions % 3 === 0) this.startLeap(dx, game);
        else { this.mode = "windup"; this.modeT = Math.round((p2 ? 24 : 30) / anger); this.vx = 0; this.combo = p2 ? 2 : 1; }
      } else if (dist > 200 && this.onGround && Math.random() < (p2 ? 0.025 : 0.01)) {   // lowers his sword and charges
        this.mode = "aim"; this.modeT = p2 ? 24 : 32; this.vx = 0; game.sound("clang"); game.popup(this.x + this.w / 2, this.y - 30, "¡Cuidado!", HEART);
      } else if (dist > 320 && this.onGround) { this.actions++; this.startLeap(dx, game); }
    } else if (this.mode === "windup") { this.vx = 0; if (--this.modeT <= 0) { this.mode = "slash"; this.modeT = 12; game.sound("swing"); } }
    else if (this.mode === "slash") {
      this.vx = this.dir * 2;
      const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 10 : r.x - 82, y: r.y + 10, w: 92, h: 80 };
      if (--this.modeT <= 0) {
        if (--this.combo > 0) { face(); this.mode = "windup"; this.modeT = 16; }   // a second slash straight after
        else { this.mode = "recover"; this.modeT = Math.round(34 / anger); }
      }
    } else if (this.mode === "aim") { this.vx = 0; face(); if (--this.modeT <= 0) { this.mode = "dash"; this.modeT = 45; game.sound("swing"); } }
    else if (this.mode === "dash") {
      this.vx = this.dir * 8.5 * this.mul;
      const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 10 : r.x - 60, y: r.y + 10, w: 70, h: 80 };
      if (--this.modeT <= 0 || this.x <= this.minX + 2 || this.x >= this.maxX - this.w - 2) { this.mode = "recover"; this.modeT = 40; }
    } else if (this.mode === "recover") { this.vx = 0; if (--this.modeT <= 0) this.mode = "walk"; }
    else if (this.mode === "stunned") {
      this.vx = 0;
      if (--this.modeT <= 0) { if (this.chain) this.startLeap(dx, game); else this.mode = "walk"; }
    }
    physicsMove(this, level);
    this.x = Math.max(this.minX, Math.min(this.x, this.maxX - this.w));
    if (this.mode === "leap" && this.onGround && this.t - this.leapT > 5) {   // lands: the ground shakes and shockwaves roll out
      this.mode = "stunned"; this.vx = 0;
      if (p2 && !this.chain) { this.chain = true; this.modeT = 30; }   // angry: he leaps again straight away
      else { this.chain = false; this.modeT = Math.round(56 / anger); }
      game.shake = Math.max(game.shake, 14); game.sound("stomp"); this.waveT = 16;   // a moment of rumbling first
      game.popup(this.x + this.w / 2, this.y - 30, "¡Salta!", GOLD);
    }
    if (this.waveT > 0) {
      if (this.waveT % 4 === 0) game.dust(this.x + this.w / 2 + randInt(-40, 40), this.y + this.h);
      if (--this.waveT === 0) for (const d of [-1, 1]) game.shots.push({ kind: "wave", enemy: true, nochop: true, life: 110, x: this.x + this.w / 2 + d * 30, y: this.y + this.h - 16,
        vx: d * (this.phase2() ? 7.5 : 6.5) * this.mul, vy: 0, t: 0, col: rgb(255, 120, 60), dark: rgb(180, 40, 40) });
    }
  }
  hit(fromDir, dmg = 1) {
    if (this.invuln > 0) return false;
    this.hp -= dmg; this.flash = 10; this.invuln = 14;
    if (this.mode === "walk" && !this.phase2()) { this.mode = "recover"; this.modeT = 24; }   // a blow from behind staggers him (until he's angry)
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  draw(cam) { drawBlackKnight(this, cam); }
}

      face(); this.vx = this.dir * 1.25 * this.mul * anger;
      if (this.onGround && this.t % 32 === 0) { game.sound("stomp"); game.shake = Math.max(game.shake, 3); }
      const level_ = Math.abs(player.y + player.h - (this.y + this.h)) < 90;
      if (dist < 150 && level_) { this.actions++; this.mode = "rear"; this.modeT = Math.round(22 / anger); this.vx = 0; }
      else if ((dist > 260 || this.hitWall) && this.onGround && Math.random() < 0.014 * anger) this.startRoar(game);
    } else if (this.mode === "rear") { this.vx = 0; jawTo = 1; if (--this.modeT <= 0) { this.mode = "bite"; this.modeT = 12; game.sound("snap"); } }
    else if (this.mode === "bite") {   // CHOMP: his head lunges forward
      jawTo = this.modeT > 6 ? 1 : 0; this.vx = this.dir * 5;
      const r = this.rect(); this.slashBox = { x: this.dir > 0 ? r.x + r.w - 34 : r.x - 46, y: r.y - 4, w: 80, h: 64 };
      if (--this.modeT <= 0) { this.mode = "recover"; this.modeT = Math.round(42 / anger); }
    } else if (this.mode === "recover") {
      this.vx = 0;
      if (--this.modeT <= 0) { if (this.actions % 3 === 0) this.startRoar(game); else this.mode = "walk"; }
    } else if (this.mode === "roar") {   // the ground shakes and rocks come tumbling down
      this.vx = 0; jawTo = 1; game.shake = Math.max(game.shake, 4);
      if (this.modeT % 9 === 0 && this.rocks > 0) {
        this.rocks--;
        const rx = Math.max(this.minX + 20, Math.min(this.maxX - 20, player.x + player.w / 2 + randInt(-170, 170)));
        game.shots.push({ kind: "rock", enemy: true, x: rx, y: -30, vx: 0, vy: 1, t: 0, life: 240, col: rgb(130, 96, 70), dark: rgb(80, 58, 42) });
      }
      if (--this.modeT <= 0) { this.mode = "aim"; this.modeT = 22; face(); game.popup(this.x + this.w / 2, this.y - 30, "¡Que viene!", HEART); }
    } else if (this.mode === "aim") { this.vx = 0; if (--this.modeT <= 0) { this.mode = "charge"; this.modeT = 100; game.sound("roar"); } }
    else if (this.mode === "charge") {   // head down, full speed, until he crashes into something
      this.vx = this.dir * Math.min(8.5, 6.2 * this.mul * anger);
      if (this.t % 4 === 0) game.dust(this.x + (this.dir > 0 ? 0 : this.w), this.y + this.h);
      const crashed = this.hitWall || this.x <= this.minX + 2 || this.x >= this.maxX - this.w - 2;
      if (crashed) {
        this.mode = "stunned"; this.modeT = 90; this.vx = 0; game.shake = 18; game.sound("stomp");
        game.popup(this.x + this.w / 2, this.y - 30, "¡Mareado! ¡Ahora!", GOLD);
      } else if (--this.modeT <= 0) { this.mode = "recover"; this.modeT = 40; }
    } else if (this.mode === "stunned") { this.vx = 0; if (--this.modeT <= 0) this.mode = "walk"; }
    this.jaw += (jawTo - this.jaw) * 0.3;
    physicsMove(this, level);
    this.x = Math.max(this.minX, Math.min(this.x, this.maxX - this.w));
  }
  hit(fromDir, dmg = 1) {
    if (this.invuln > 0) return false;
    this.hp -= dmg; this.flash = 10; this.invuln = 14;
    if (this.hp <= 0) { this.alive = false; return true; }
    if (this.mode === "wait" || this.mode === "walk" && Math.random() < 0.5) { this.actions++; this.mode = "rear"; this.modeT = 14; this.dir = -fromDir; }   // hit him head-on and he snaps right back
    return false;
  }
  draw(cam) { drawTRex(this, cam); }
}

const ROCK_SIZES = [13, 22, 34];   // small, medium and big asteroids
class Asteroid extends Enemy {   // a space rock: drifts and spins; shoot it and it splits; don't fly into it!
  constructor(cx, cy, size = 2, mul = 1, awake = false) {
    super();
    const r = ROCK_SIZES[size];
    this.init("O", r * 2, r * 2, [1, 3, 6][size], [50, 100, 200][size]);
    this.size = size; this.r = r; this.x = cx - r; this.y = cy - r; this.awake = awake; this.mul = mul;
    this.vx = -(0.5 + Math.random() * 1.6) * mul; this.vy = (Math.random() - 0.5) * 1.4;
    this.spin = (Math.random() - 0.5) * 0.06; this.ang = Math.random() * 6;
    this.shape = Array.from({ length: 11 }, () => 0.78 + Math.random() * 0.26);
  }
  rect() { const k = this.r * 0.7; return { x: Math.round(this.x + this.r - k), y: Math.round(this.y + this.r - k), w: Math.round(k * 2), h: Math.round(k * 2) }; }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (!this.awake) { if (this.x < game.camX + W + 60) this.awake = true; else return; }
    this.x += this.vx; this.y += this.vy; this.ang += this.spin;
    if (this.y < 46 && this.vy < 0 || this.y + this.h > 418 && this.vy > 0) this.vy = -this.vy;
    if (this.x + this.w < game.camX - 150) this.alive = false;
  }
  hit(fromDir, dmg = 1) { this.hp -= dmg; this.flash = 6; if (this.hp <= 0) { this.alive = false; return true; } return false; }
  draw(cam) { drawAsteroid(this, cam); }
}

class Alien extends Enemy {   // a little green alien in a saucer: hovers in front of you firing zaps, then zooms off
  constructor(tx, ty, mul = 1) {
    super();
    this.init("u", 50, 30, 2, 300);
    this.x = tx; this.y = ty; this.mul = mul; this.awake = false; this.hold = randInt(240, 340);
    this.shootT = randInt(40, 80); this.phase = Math.random() * 6;
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (!this.awake) { if (this.x < game.camX + W + 30) this.awake = true; else return; }
    if (this.hold > 0) {
      this.hold--;
      const tx = player.x + 400 + Math.sin(this.t * 0.03 + this.phase) * 90, ty = player.y + Math.sin(this.t * 0.045 + this.phase) * 110;
      this.x += Math.max(-4, Math.min(player.vx + 3, (tx - this.x) * 0.05 + player.vx));
      this.y += (ty - this.y) * 0.03;
      if (--this.shootT <= 0 && !player.dead) {
        game.enemyShot(this.x + 25, this.y + 22, player, 4.4 * this.mul, "zap", rgb(130, 255, 120), rgb(30, 160, 60)); game.sound("zap");
        this.shootT = Math.round(randInt(70, 110) / this.mul);

    this.y = Math.max(50, Math.min(380, this.y));
  }
  hit(fromDir, dmg = 1) { this.hp -= dmg; this.flash = 8; if (this.hp <= 0) { this.alive = false; return true; } return false; }

const RIVAL_PAINTS = [[rgb(40, 110, 220), WHITE], [rgb(40, 160, 80), GOLD], [rgb(240, 200, 40), BLACK], [rgb(150, 60, 190), WHITE], [rgb(240, 120, 30), WHITE], [rgb(30, 30, 36), rgb(240, 60, 60)]];
class Rival extends Enemy {   // a rival racing car: they race too, and crashing into one hurts
  constructor(tx, ty, mul = 1) {
    super();
    this.init("Y", CAR_W, CAR_H, 99, 0);
    const col = Math.floor(tx / TILE);
    this.x = tx; this.y = ty + TILE - this.h; this.racer = col < 30; this.dir = 1;
    this.top = this.racer ? [8.9, 8.5, 8.1][Math.min(2, Math.floor(col / 8))] * (0.94 + mul * 0.05) : 4.4 + (col % 5) * 0.3;
    this.paint = RIVAL_PAINTS[col % RIVAL_PAINTS.length]; this.num = 2 + (col % 8);
  }
  hittable() { return false; }
  harmful() { return !this.racer; }   // the rival racers drive in the far lane; slow cars share yours
  update(level, player, game) {
    this.t++;
    if (game.levelTimer < RACE_GO) { this.vx = 0; physicsMove(this, level); return; }
    if (this.onGround) {
      this.vx += (this.top - this.vx) * 0.03;
      const ahead = this.x + this.w + 30;   // jump the gaps
      if (!level.solidAt(Math.floor(ahead / TILE), Math.floor((this.y + this.h + 4) / TILE)) || this.hitWall) this.vy = -13;
    }
    physicsMove(this, level);
    if (this.x > level.pxW - this.w) { this.x = level.pxW - this.w; this.vx = 0; }
    if (this.y > level.pxH + 100) this.alive = false;
  }
  draw(cam) {
    if (this.racer) { ctx.save(); ctx.translate(this.x - cam + 38, this.y + 36); ctx.scale(0.88, 0.88); drawCar(-38, -50, this.t, this.paint, false, this.x * 0.06, this.onGround ? 0 : -0.06, this.num); ctx.restore(); }
    else drawCar(this.x - cam, this.y, this.t, this.paint, false, this.x * 0.06, this.onGround ? 0 : -0.06, this.num);
  }
}

class Bear extends Enemy {   // a sleeping bear. Deep asleep he hardly hears you; when he stirs, freeze! Too much noise and he wakes up... hungry
  constructor(tx, ty, mul = 1) {
    super();
    this.init("L", 112, 50, 99, 0);
    this.x = tx; this.y = ty + TILE - this.h; this.home = this.x; this.mul = mul;
    this.mode = "deep"; this.modeT = randInt(160, 300); this.alert = 0; this.dir = tx % 80 ? -1 : 1; this.shushed = false;
  }
  hittable() { return false; }
  harmful() { return false; }
  hearing() { return this.mode === "stir" ? 3.5 : this.mode === "quiet" ? 1.6 : 1; }
  update(level, player, game) {
    this.t++;
    const cx = this.x + this.w / 2, px = player.x + player.w / 2, d = Math.abs(px - cx);
    if (this.mode === "deep" || this.mode === "quiet" || this.mode === "stir") {
      const near = Math.max(0, 1 - d / 400);
      this.alert = Math.max(0, this.alert + game.noise * near * this.hearing() - 0.35);
      if (this.alert > 70 && !this.shushed) { this.shushed = true; game.popup(cx, this.y - 40, "¡Shhh!", GOLD); }
      if (this.alert < 40) this.shushed = false;
      if (this.mode === "deep" && this.t % 70 === 0 && d < 500) game.sound("snore");
      if (--this.modeT <= 0) {   // deep sleep -> snoring stops -> stirs -> back to sleep
        if (this.mode === "deep") { this.mode = "quiet"; this.modeT = 34; }
        else if (this.mode === "quiet") { this.mode = "stir"; this.modeT = randInt(80, 110); }
        else { this.mode = "deep"; this.modeT = Math.round(randInt(200, 330) / this.mul); }
      }
      if (this.alert >= 100 && !player.dead) {   // WAKE UP
        this.mode = "wake"; this.modeT = 34; this.dir = px > cx ? 1 : -1; this.h = 70; this.y -= 20;
        game.sound("growl"); game.popup(cx, this.y - 40, "¡GRRR!", HEART); game.shake = 10;
      }
    } else if (this.mode === "wake") { this.vx = 0; if (--this.modeT <= 0) this.mode = "charge"; }
    else if (this.mode === "charge") {   // he runs you down
      this.dir = px > cx ? 1 : -1; this.vx = this.dir * 7.2;
      if (this.t % 5 === 0) game.dust(this.x + (this.dir > 0 ? 0 : this.w), this.y + this.h);
      if (!player.dead && collide(inflate(this.rect(), -10, 0), player.rect())) { this.mode = "eat"; this.modeT = 60; this.vx = 0; game.eatenBy(this); }
      else if (Math.abs(this.x - this.home) > 700 || player.dead) { this.mode = "home"; }
    } else if (this.mode === "eat") { this.vx = 0; if (--this.modeT <= 0) this.mode = "home"; }
    else if (this.mode === "home") {   // wander back to bed
      this.dir = this.home > this.x ? 1 : -1; this.vx = this.dir * 2;
      if (Math.abs(this.home - this.x) < 4) { this.x = this.home; this.vx = 0; this.h = 50; this.y += 20; this.mode = "deep"; this.modeT = 300; this.alert = 40; }
    }
    physicsMove(this, level);
  }
  draw(cam) { drawBear(this, cam); }
}

class SeaMine extends Enemy {   // a spiky sea mine, chained to the seabed ('W') or drifting up and down ('f')
  constructor(kind, tx, ty) {
    super();
    this.init(kind, 30, 30, 1, 100);
    this.x = tx + 5; this.y = ty + 5; this.baseY = this.y; this.phase = Math.random() * 6; this.anchorY = null;
  }
  hit() { this.hp = 0; this.alive = false; return true; }
  update(level) {
    this.t++;
    if (this.anchorY === null) {   // find the seabed below for the chain
      let gy = this.y + 30; while (gy < level.pxH && !level.solidAt(Math.floor((this.x + 15) / TILE), Math.floor(gy / TILE))) gy += 8;
      this.anchorY = gy;
    }
    this.y = this.baseY + (this.kind === "f" ? Math.sin(this.t * 0.025 + this.phase) * 56 : Math.sin(this.t * 0.04 + this.phase) * 4);
  }
  draw(cam) { drawSeaMine(this, cam); }
}

class Snapper extends Enemy {   // a giant flytrap: it opens wide, then snaps at you. If it catches you, struggle free!
  constructor(tx, ty, mul = 1) {
    super();
    this.init("S", 40, 66, 3, 400);
    this.x = tx; this.y = ty + TILE - this.h; this.mul = mul; this.mode = "idle"; this.modeT = randInt(20, 60); this.ext = 0; this.jaw = 0.3;
  }
  head() { const hx = this.x + this.w / 2 + this.dir * (6 + this.ext), hy = this.y + 16 - Math.max(0, this.ext) * 0.12; return { x: hx - 22, y: hy - 18, w: 44, h: 36 }; }
  harmful() { return false; }   // the stem is harmless: it's the jaws that catch you
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2), dy = player.y + player.h - (this.y + this.h);
    if (this.stun > 0) { this.stun--; if (this.mode !== "hold") { this.mode = "rest"; this.modeT = Math.max(this.modeT, 20); } }
    if (this.mode === "idle") {
      this.jaw += (0.3 - this.jaw) * 0.1; this.ext *= 0.9;
      if (this.modeT > 0) this.modeT--;
      else if (Math.abs(dx) < 175 && Math.abs(dy) < 110 && !player.dead && !game.caught) { this.dir = dx > 0 ? 1 : -1; this.mode = "open"; this.modeT = Math.round(36 / this.mul); game.sound("rustle"); }
    } else if (this.mode === "open") {   // jaws wide open, rearing back
      this.jaw = Math.min(1, this.jaw + 0.06); this.ext = Math.max(-14, this.ext - 1);
      if (--this.modeT <= 0) { this.mode = "snap"; this.modeT = 10; this.target = Math.min(112, Math.max(40, Math.abs(dx) - 10)); game.sound("snap"); }
    } else if (this.mode === "snap") {   // SNAP!
      this.ext += (this.target - this.ext) * 0.45; this.jaw = this.modeT > 4 ? 1 : 0;
      if (!game.caught && player.invuln === 0 && !player.dead && collide(this.head(), inflate(player.rect(), -4, -2))) game.catchBy(this);
      else if (--this.modeT <= 0) { this.mode = "rest"; this.modeT = 70; }
    } else if (this.mode === "rest") { this.jaw = 0; this.ext *= 0.94; if (--this.modeT <= 0) { this.mode = "idle"; this.modeT = 40; } }
    else if (this.mode === "hold") this.jaw = 0.12 + Math.abs(Math.sin(this.t * 0.4)) * 0.12;   // chewing
  }
  hit(fromDir, dmg = 1) {
    this.hp -= dmg; this.flash = 8; this.stun = 40;
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  draw(cam) { drawSnapper(this, cam); }
}

class Dropper extends Enemy {   // a pod plant hanging from the canopy: it drops on you like a trap, then slowly climbs back up
  constructor(tx, ty, mul = 1) {
    super();
    this.init("I", 44, 46, 2, 300);
    this.x = tx - 2; this.homeY = ty; this.y = ty; this.mode = "hang"; this.modeT = 0; this.mul = mul;
  }
  harmful() { return false; }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    const pdx = player.x + player.w / 2 + player.vx * 40 - (this.x + this.w / 2);   // where the knight will be when it lands
    if (this.mode === "hang") {
      this.y = this.homeY + Math.sin(this.t * 0.05) * 3;
      if (Math.abs(pdx) < 40 && player.y > this.y + 40 && !game.caught && !player.dead) { this.mode = "shiver"; this.modeT = Math.round(20 / this.mul); game.sound("rustle"); }
    } else if (this.mode === "shiver") { if (--this.modeT <= 0) { this.mode = "drop"; this.vy = 2; } }
    else if (this.mode === "drop") {
      this.vy = Math.min(16, this.vy + 1.2); this.y += this.vy;
      if (!game.caught && player.invuln === 0 && !player.dead && collide(this.rect(), inflate(player.rect(), -4, -2))) game.catchBy(this);
      const cy = Math.floor((this.y + this.h) / TILE);
      if (this.mode === "drop" && (level.solidAt(Math.floor((this.x + this.w / 2) / TILE), cy) || this.y > level.pxH)) {
        this.y = cy * TILE - this.h; this.mode = "down"; this.modeT = 80; game.sound("stomp"); game.shake = Math.max(game.shake, 4);
      }
    } else if (this.mode === "down") { if (--this.modeT <= 0) this.mode = "rise"; }
    else if (this.mode === "rise") { this.y -= 2.2; if (this.y <= this.homeY) { this.y = this.homeY; this.mode = "hang"; } }
  }
  hit(fromDir, dmg = 1) {
    this.hp -= dmg; this.flash = 8;
    if (this.hp <= 0) { this.alive = false; return true; }
    if (this.mode === "hang" || this.mode === "shiver") { this.mode = "rise"; }
    return false;
  }
  draw(cam) { drawPod(this, cam); }
}

class Spitter extends Enemy {   // a pitcher plant that lobs thorny seeds at you
  constructor(tx, ty, mul = 1) {

class Boss extends Enemy {   // the Rey Canguro: big hops, shakes the ground, calls little kangaroos
  constructor(tx, ty, level, mul = 1) {
    super();
    this.init("B", 76, 100, 8, 3000);
    this.x = tx + (TILE - this.w) / 2; this.y = ty + TILE - this.h;
    this.minX = level.arena[0]; this.maxX = level.arena[1]; this.mul = mul;
    this.wait = 90; this.hops = 0; this.invuln = 0; this.jumping = false;
    this.title = "REY CANGURO"; this.voice = "jefe"; this.intro = "¡El Rey Canguro!";
  }
  update(level, player, game) {
    this.t++;
    if (this.flash) this.flash--;
    if (this.invuln) this.invuln--;
    const awake = player.x > this.minX - 120;
    if (this.stun > 0) { this.stun--; this.vx *= 0.9; }
    else if (this.onGround && awake) {
      this.vx = 0;
      if (--this.wait <= 0) {
        const anger = this.maxHp - this.hp;
        this.dir = player.x + player.w / 2 > this.x + this.w / 2 ? 1 : -1;
        this.vy = -(this.hops % 3 === 2 ? 14 : 10);
        this.vx = this.dir * (2.4 + anger * 0.12) * this.mul;
        this.wait = Math.max(28, randInt(45, 75) - anger * 3);
        this.hops++; this.jumping = true;
      }
    }
    physicsMove(this, level);
    if (this.x < this.minX) { this.x = this.minX; this.vx = Math.abs(this.vx); }
    if (this.x > this.maxX - this.w) { this.x = this.maxX - this.w; this.vx = -Math.abs(this.vx); }
    if (this.onGround && this.jumping) {
      this.jumping = false; game.shake = Math.max(game.shake, 10); game.sound("stomp");
      if (this.hops % 3 === 0 && level.enemies.length < 6) {
        level.enemies.push(new Kangaroo("t", this.x + this.w / 2 - 20 + this.dir * 50, this.y + this.h - TILE, this.mul));
        game.sound("boing");
      }
    }
  }
  hit(fromDir, dmg = 1) {
    if (this.invuln > 0) return false;
    this.hp -= dmg; this.flash = 10; this.invuln = 24; this.stun = 22; this.vx = fromDir * 5;
    if (this.hp <= 0) { this.alive = false; return true; }
    return false;
  }
  draw(cam) { drawKangaroo(this, cam); }
}

// ------------------------------------------------------------------ level
class Coin {
  constructor(x, y) { this.x = x; this.y = y; this.t = Math.random() * 100; }
  rect() { return { x: Math.round(this.x - 9), y: Math.round(this.y - 9 + Math.sin(this.t * 0.08) * 3), w: 18, h: 18 }; }
}
class Level {
  constructor(def) {
    const rows = def.map, width = Math.max(...rows.map(r => r.length)), mul = def.speed;
    this.name = def.name; this.hint = def.hint || ""; this.theme = THEMES[def.theme]; this.bike = null; this.tank = null; this.mode = def.mode || null; this.pickups = [];
    this.rows = rows.map(r => r.padEnd(width, "."));
    this.w = width; this.h = rows.length; this.pxW = this.w * TILE; this.pxH = this.h * TILE;

function angleAt(prog) {   // axe angle in degrees: 0 = up, positive = towards the front
  const idle = -30;
  if (prog < 0.25) return lerp(idle, -80, prog / 0.25);
  if (prog < 0.6) return lerp(-80, 150, easeOut((prog - 0.25) / 0.35));
  return lerp(150, idle, (prog - 0.6) / 0.4);
}
function axeAngle(p) {
  if (p.attackTimer === 0) return -30 + (p.onGround && Math.abs(p.vx) > 0.5 ? Math.sin(p.anim * 1.4) * 4 : 0);
  return angleAt(p.attackFrame() / p.atkTotal);
}

function drawAxe(hand, d, k = 1, gold = false) {
  const n = [-d[1], d[0]], len = AXE_LEN * k, head = AXE_HEAD * k;
  const pt = (c, a, b) => [c[0] + d[0] * a + n[0] * b, c[1] + d[1] * a + n[1] * b];
  const [hx, hy] = hand;
  L(HANDLE_DARK, hx - d[0] * 13, hy - d[1] * 13, hx + d[0] * (len + 1), hy + d[1] * (len + 1), 7);
  L(HANDLE, hx - d[0] * 12, hy - d[1] * 12, hx + d[0] * len, hy + d[1] * len, 4);
  for (const kk of [18, 24, 30]) { const a = pt(hand, kk, -3), b = pt(hand, kk, 3); L(HANDLE_DARK, a[0], a[1], b[0], b[1], 2); }
  const c = [hx + d[0] * head, hy + d[1] * head];
  if (gold) { ctx.globalAlpha = 0.35 + 0.15 * Math.sin(Date.now() / 120); C(GOLD, c[0], c[1], 30); ctx.globalAlpha = 1; }
  const blade = [[6, 3], [17, 21], [6, 26], [-6, 26], [-17, 21], [-6, 3]];
  for (const s of [1, -1]) {   // two blades -> double axe
    const pts = blade.map(([a, b]) => pt(c, a, b * s));
    P(gold ? GOLD_BLADE : BLADE, pts); PS(gold ? GOLD_BLADE_DARK : BLADE_DARK, pts, 2);
    const e1 = pt(c, 12, 21 * s), e2 = pt(c, -12, 21 * s); L(WHITE, e1[0], e1[1], e2[0], e2[1], 2);
  }
  P(BLADE_DARK, [pt(c, 5, -4), pt(c, 15, 0), pt(c, 5, 4)]);
  C(gold ? GOLD_DARK : BLADE_DARK, c[0], c[1], 5);
}
function drawMiniAxe(x, y, angle, gold) {   // the spinning flying axe
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(0.62, 0.62);
  drawAxe([0, 26], [0, -1], 0.55, gold);
  ctx.restore();
}

function drawKnight(p, cam, upg, t) {
  const moving = p.onGround && Math.abs(p.vx) > 0.5, step = moving ? Math.sin(p.anim * 1.4) * 4 : 0;
  flipAt(Math.round(p.x) - cam, Math.round(p.y), p.w, p.facing);
  if (p.bike) ctx.translate(7, 0);   // the knight sits in the middle of the wider bike
  const sh = [24, 19], k = p.reach, rad = axeAngle(p) * Math.PI / 180, d = [Math.sin(rad), -Math.cos(rad)];
  // when swinging the arm follows the axe; otherwise he holds it upright in front, fist at his belt
  const hand = p.attackTimer ? [sh[0] + d[0] * ARM_LEN, sh[1] + d[1] * ARM_LEN] : [30, 31 + step * 0.3];
  const flap = Math.sin(t * 0.15) * 3 + (moving ? 6 : 0) + (p.onGround ? 0 : 5);

  // flowing cape behind everything
  P(CAPE_DARK, [[5, 15], [19, 15], [12, 50], [-4 - flap, 56], [-14 - flap, 47]]);
  P(CAPE, [[7, 16], [17, 16], [9, 46], [-3 - flap, 51], [-10 - flap, 43]]);

  if (p.swingActive()) {   // swing trail
    const prog = p.attackFrame() / p.atkTotal, reach = ARM_LEN + AXE_HEAD * k;
    for (let i = 1; i < 7; i++) {
      const a = angleAt(Math.max(0, prog - i * 0.025)) * Math.PI / 180;
      ctx.globalAlpha = Math.max(0, 160 - i * 24) / 255;
      C(upg.sharp ? GOLD : WHITE, sh[0] + Math.sin(a) * reach, sh[1] - Math.cos(a) * reach, 16 - i * 2);
    }
    ctx.globalAlpha = 1;
  }
  const sw = -step * 0.6;   // back arm: big bicep, bracer, fist
  E(SKIN_DARK, -10, 15, 14, 16); E(SKIN, -9, 16, 12, 14); C(SKIN_LIGHT, -5, 20, 2);
  R(ARMOR_DARK, -8 + sw, 29, 10, 9, 3); C(STEEL_DARK, -3 + sw, 41, 5);

  if (p.bike) {   // the motorbike, then the knight's legs bent onto the footpegs
    ctx.save(); ctx.translate(-7, 0); drawBike(p.x / 11, Math.abs(p.vx) > 6); ctx.restore();
    L(STEEL_DARK, 12, 36, 24, 38, 9); C(ARMOR, 24, 38, 5); L(STEEL_DARK, 24, 38, 26, 47, 8); R(BOOT, 21, 45, 13, 5, 2);
  } else {        // long legs: thigh, knee guard, shin, boot
    const legs = p.onGround ? [[7 + step, 35], [16 - step, 35]] : [[4, 32], [18, 35]];
    for (const [lx, ly] of legs) {
      R(STEEL_DARK, lx, ly, 9, 17, 3); R(ARMOR, lx - 1, ly + 7, 11, 5, 2); R(BOOT, lx - 1, ly + 16, 13, 5, 2);
    }
  }
  const torso = [[-1, 15], [31, 15], [24, 34], [8, 34]];   // broad shoulders, slim waist
  P(ARMOR, torso); PS(ARMOR_DARK, torso, 2);
  for (const x of [3, 15]) { E(ARMOR_MID, x, 16, 12, 9); ES(ARMOR_DARK, x, 16, 12, 9, 1); }
  for (const ax of [11, 16]) for (const ay of [26, 29]) RS(ARMOR_DARK, ax, ay, 5, 3, 1);
  R(HANDLE_DARK, 8, 32, 17, 4); R(GOLD, 16, 32, 5, 4);
  R(STEEL_DARK, 12, 11, 12, 5);   // neck

  // open-faced helmet: proud nose, twirled moustache, tall plume
  const pb = step * 0.5;
  P(PLUME, [[15, -4], [9, -16 + pb], [-4, -15 + pb], [-13 - flap * 0.4, -6 + pb], [1, -3], [11, -1]]);
  P(rgb(255, 120, 110), [[13, -6], [6, -14 + pb], [-3, -12 + pb], [5, -6]]);
  R(ARMOR, 9, -6, 18, 19, 7); RS(ARMOR_DARK, 9, -6, 18, 19, 2, 7);
  R(SKIN, 18, -1, 10, 12, 3);
  R(ARMOR_DARK, 17, -4, 11, 3, 1);                      // raised visor
  L(BLACK, 21, 1.5, 25, 1, 1.5); C(BLACK, 23.5, 3.5, 1.4); // brow and eye
  P(SKIN_DARK, [[26, 3], [29, 6.5], [26, 7]]);           // nose
  P(MOUSTACHE, [[19, 8], [23, 7], [27, 8], [30, 6], [29, 9.5], [23, 9], [19, 10], [16, 8]]);
  L(SKIN_DARK, 22, 11, 25, 10.5, 1);                     // confident grin
  R(ARMOR, 9, 0, 10, 13, 3); C(ARMOR_LIGHT, 14, 5, 2);   // cheek guard
  L(ARMOR_LIGHT, 12, -3, 17, -3, 2);
  C(ARMOR_LIGHT, 1, 16, 6); CS(ARMOR_DARK, 1, 16, 6, 2);

  const ad = p.attackTimer ? d : [Math.sin(0.2), -Math.cos(0.2)];
  if (p.sword) drawSword(hand, ad, k, upg.sharp);   // the broadsword in the final duel
  else if (!game.flyingAxe) drawAxe(hand, ad, k, upg.sharp);   // the axe, then the arm gripping it
  L(SKIN_DARK, sh[0], sh[1], hand[0], hand[1], 12); L(SKIN, sh[0], sh[1], hand[0], hand[1], 9);
  const bi = [lerp(sh[0], hand[0], 0.4), lerp(sh[1], hand[1], 0.4)];
  C(SKIN_DARK, bi[0], bi[1], 8); C(SKIN, bi[0], bi[1], 7); C(SKIN_LIGHT, bi[0] - 2, bi[1] - 2, 2);
  C(ARMOR_DARK, hand[0], hand[1], 6); C(STEEL, hand[0], hand[1], 3);
  C(ARMOR_LIGHT, 26, 17, 6); CS(ARMOR_DARK, 26, 17, 6, 2); C(GOLD, 26, 17, 2);
  ctx.restore();
}

function drawSword(hand, d, k = 1, gold = false, dark = false) {   // double-edged broadsword
  const n = [-d[1], d[0]], len = 64 * k, [hx, hy] = hand;

  L(HANDLE_DARK, ...pt(-12 * k, 0), ...pt(4, 0), 5); C(GOLD, ...pt(-13 * k, 0), 4);
  P(GOLD, [pt(4, -11 * k), pt(8, -11 * k), pt(8, 11 * k), pt(4, 11 * k)]);
  const blade = [pt(8, -5 * k), pt(len - 10, -4.5 * k), pt(len, 0), pt(len - 10, 4.5 * k), pt(8, 5 * k)];

}

function drawKatana(hand, d) {

  L(rgb(30, 24, 30), hx - d[0] * 9, hy - d[1] * 9, hx + d[0] * 4, hy + d[1] * 4, 4);

}

function drawNinja(p, cam, upg, t) {   // the knight as a ninja: blue gi, red headband, bushy eyebrow above the mask
  const GI = rgb(40, 66, 140), GI_D = rgb(22, 36, 84), BAND = rgb(220, 40, 50);
  const moving = p.onGround && Math.abs(p.vx) > 0.5, step = moving ? Math.sin(p.anim * 1.4) * 6 : 0;
  const slide = p.wallT > 0 && !p.onGround && p.vy > 0;
  flipAt(Math.round(p.x) - cam, Math.round(p.y) + 6, p.w, slide ? p.wallDir : p.facing);
  const fl = Math.sin(t * 0.3) * 3, tail = moving || !p.onGround ? 9 : 3;
  L(BAND, 8, 2, -8 - tail, 0 + fl, 3); L(BAND, 8, 4, -6 - tail, 9 + fl, 3);                         // headband tails
  if (!p.attackTimer) { L(rgb(40, 30, 30), 2, 34, 26, 4, 3); R(GOLD, 19, 6, 6, 3); }                // katana on the back
  if (p.onGround) for (const [lx, s] of [[8, step], [17, -step]]) { L(GI_D, lx + 3, 32, lx + 3 + s, 44, 7); R(BLACK, lx - 2 + s, 44, 11, 6, 2); }
  else { L(GI_D, 10, 32, 4, 42, 7); L(GI_D, 18, 32, 25, 40, 7); R(BLACK, -2, 41, 10, 5, 2); R(BLACK, 21, 39, 10, 5, 2); }
  P(GI, [[4, 12], [26, 12], [24, 34], [6, 34]]); L(GI_D, 10, 12, 20, 28, 2); R(BAND, 5, 28, 20, 4);  // gi and belt
  L(GI_D, 7, 16, 2, 28, 6);                                                                          // back arm
  C(GI, 16, 2, 10); R(SKIN, 15, -2, 11, 6, 2); C(BLACK, 22, 1, 1.5); L(MOUSTACHE, 18, -2.5, 25, -3, 2.2);   // hood, eyes, eyebrow
  R(BAND, 6, -6, 20, 4, 1);
  const sh = [20, 16];
  if (p.attackTimer) {
    const rad = axeAngle(p) * Math.PI / 180, d = [Math.sin(rad), -Math.cos(rad)], hand = [sh[0] + d[0] * 12, sh[1] + d[1] * 12];
    drawKatana(hand, d); L(GI, sh[0], sh[1], hand[0], hand[1], 6);

}

function drawShadow(e, cam) {   // shadow ninja: a black silhouette with glowing eyes, a red scarf and a katana
